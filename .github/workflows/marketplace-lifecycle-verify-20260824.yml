name: Marketplace Stripe lifecycle verification

on:
  push:
    branches:
      - fix/marketplace-stripe-dahlia-lifecycle-20260824
    paths:
      - .github/workflows/marketplace-lifecycle-verify-20260824.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
