name: Marketplace v1.2 six-source ingest trigger

on:
  push:
    branches: [main]
    paths:
      - ops/marketplace-v12-six-source-ingest-trigger.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate governed trigger
        shell: bash
        run: |
          set -euo pipefail
          trigger=ops/marketplace-v12-six-source-ingest-trigger.json
          test -f "${trigger}"
          jq -e --arg sha "${GITHUB_SHA}" '
            .contract == "obserra-marketplace-v12-six-source-ingest-trigger-v1" and
            .mode == "ingest" and
            .expected_commit == $sha and
            .approved_catalog_revision == "487043cc23975012e83764a9a0f258f9ff705ab656084be558e76fa64f47faf2"
          ' "${trigger}" >/dev/null

      - name: Dispatch guarded protected delivery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run marketplace-v12-six-source-protected-delivery.yml \
            --ref main \
            -f mode=ingest \
            -f expected_commit="${GITHUB_SHA}" \
            -f approved_catalog_revision=487043cc23975012e83764a9a0f258f9ff705ab656084be558e76fa64f47faf2
