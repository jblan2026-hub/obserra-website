name: Finish Validated Authority Source Patch

on:
  push:
    branches:
      - fix/vercel-production-authority-current-20260820

permissions:
  contents: write

concurrency:
  group: finish-validated-authority-source-patch
  cancel-in-progress: false

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/vercel-production-authority-current-20260820
          fetch-depth: 2

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11 --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      - name: Apply remaining validated authority source patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const CANONICAL = 'prj_lxTKKDa9sbhht7FaigiaF1PONMiC';
          const AUXILIARY = 'prj_FfAnssVJU8pcJydGNJHmCliP6Yme';
          const read = (path) => fs.readFileSync(path, 'utf8');
          const write = (path, value) => fs.writeFileSync(path, value);

          const gatePath = 'scripts/florida-class-d-website-academy-commerce-gate.mjs';
          const oldGate = 'export const CANONICAL_PUBLIC_VERCEL_PROJECT_ID = "prj_FfAnssVJU8pcJydGNJHmCliP6Yme"';
          let gate = read(gatePath);
          const gateCount = gate.split(oldGate).length - 1;
          if (gateCount !== 1) throw new Error(`${gatePath}: expected one old canonical authority, found ${gateCount}`);
          gate = gate.replace(oldGate, `export const CANONICAL_PUBLIC_VERCEL_PROJECT_ID = "${CANONICAL}"`);
          write(gatePath, gate);

          const cutoverPath = '.github/workflows/production-vercel-public-cutover.yml';
          let cutover = read(cutoverPath);
          const oldCanonical = '      CANONICAL_PROJECT_ID: prj_FfAnssVJU8pcJydGNJHmCliP6Yme';
          const oldAuxiliary = '      AUXILIARY_PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC';
          if ((cutover.split(oldCanonical).length - 1) !== 1) throw new Error('cutover canonical project guard did not match exactly once');
          if ((cutover.split(oldAuxiliary).length - 1) !== 1) throw new Error('cutover auxiliary project guard did not match exactly once');
          cutover = cutover.replace(oldCanonical, `      CANONICAL_PROJECT_ID: ${CANONICAL}`);
          cutover = cutover.replace(oldAuxiliary, `      AUXILIARY_PROJECT_ID: ${AUXILIARY}`);

          const retirePattern = /      - name: Retire obsolete auxiliary Vercel project\n[\s\S]*?(?=      - name: Roll back canonical domains on failed cutover)/;
          if (!retirePattern.test(cutover)) throw new Error('obsolete-project retirement block was not found exactly once');
          const quarantineBlock = [
            '      - name: Quarantine duplicate Vercel project',
            "        if: steps.smoke.outcome == 'success'",
            '        shell: bash',
            '        run: |',
            '          set -euo pipefail',
            '',
            '          remove_domain_if_present() {',
            '            local domain="$1"',
            '            local body',
            '            local status',
            '            body="$(mktemp)"',
            '            status="$(curl --silent --show-error \\',
            '              --connect-timeout 10 \\',
            '              --max-time 20 \\',
            '              --output "${body}" \\',
            "              --write-out '%{http_code}' \\",
            '              --request DELETE \\',
            '              --header "Authorization: Bearer ${VERCEL_TOKEN}" \\',
            '              "https://api.vercel.com/v9/projects/${AUXILIARY_PROJECT_ID}/domains/${domain}?teamId=${TEAM_ID}")"',
            '            if [ "${status}" != "200" ] && [ "${status}" != "204" ] && [ "${status}" != "404" ]; then',
            '              cat "${body}" >&2 || true',
            '              rm -f "${body}"',
            '              echo "::error::Failed to remove ${domain} from duplicate Vercel project: HTTP ${status}."',
            '              return 1',
            '            fi',
            '            rm -f "${body}"',
            '          }',
            '',
            '          remove_domain_if_present "${PRIMARY_DOMAIN}"',
            '          remove_domain_if_present "${APEX_DOMAIN}"',
            '',
            '          curl --silent --show-error --fail-with-body \\',
            '            --connect-timeout 10 \\',
            '            --max-time 20 \\',
            '            --request PATCH \\',
            '            --header "Authorization: Bearer ${VERCEL_TOKEN}" \\',
            '            --header "Content-Type: application/json" \\',
            "            --data '{\"commandForIgnoringBuildStep\":\"exit 0\"}' \\",
            '            "https://api.vercel.com/v9/projects/${AUXILIARY_PROJECT_ID}?teamId=${TEAM_ID}" \\',
            '            >/dev/null',
            '',
            '          health="$(curl --silent --show-error --fail --max-time 20 "https://${PRIMARY_DOMAIN}/api/health")"',
            "          observed_project=\"$(jq -r '.routing.observedProjectId // empty' <<<\"${health}\")\"",
            "          observed_sha=\"$(jq -r '.routing.gitCommitSha // empty' <<<\"${health}\")\"",
            '          if [ "${observed_project}" != "${CANONICAL_PROJECT_ID}" ] || [ "${observed_sha}" != "${GITHUB_SHA}" ]; then',
            '            echo "::error::Canonical production identity changed during duplicate-project quarantine."',
            '            exit 1',
            '          fi',
            '',
          ].join('\n');
          write(cutoverPath, cutover.replace(retirePattern, quarantineBlock));
          NODE

      - name: Enforce remaining source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/production-vercel-public-cutover.yml' \
            'scripts/florida-class-d-website-academy-commerce-gate.mjs' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --exit-code -- package-lock.json

      - name: Re-run authority and identity contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/vercel-production-authority-consistency.test.mjs \
            test/vercel-ignore-build.test.mjs \
            test/supabase-auth-runtime.test.mjs \
            test/production-vercel-public-cutover.test.mjs
          node scripts/florida-class-d-website-academy-commerce-gate.mjs
          node scripts/cmmc-level2-rev3-production-evidence.mjs --check

      - name: Re-run payment regression subset
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t payment_tests < <(find test -maxdepth 1 -type f -name '*.test.mjs' | grep -Ei '(payment|stripe|checkout|commerce)' | sort)
          test "${#payment_tests[@]}" -gt 0
          node --test "${payment_tests[@]}"

      - name: Re-run Florida Class D LMS gates
        run: npm run verify:florida-class-d

      - name: Re-run production quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run build
          npm audit --audit-level=high

      - name: Commit remaining validated authority files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Obserra CI"
          git config user.email "ci@obserrallc.com"
          git add \
            .github/workflows/production-vercel-public-cutover.yml \
            scripts/florida-class-d-website-academy-commerce-gate.mjs
          git commit -m "fix(prod): complete Vercel production authority alignment"
          git push origin HEAD:fix/vercel-production-authority-current-20260820
