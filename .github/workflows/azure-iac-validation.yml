name: Azure IaC Validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/azure-bootstrap-production.sh'
      - 'scripts/azure-bootstrap-current-directory.sh'
      - 'scripts/azure-first-release-current-directory.sh'
      - 'scripts/azure-converge-production.sh'
      - '.github/workflows/azure-production-deploy.yml'
      - '.github/workflows/azure-iac-validation.yml'
      - 'test/azure-production-plane-contract.test.mjs'
      - 'test/azure-governed-release-contract.test.mjs'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'scripts/azure-bootstrap-production.sh'
      - 'scripts/azure-bootstrap-current-directory.sh'
      - 'scripts/azure-first-release-current-directory.sh'
      - 'scripts/azure-converge-production.sh'
      - '.github/workflows/azure-production-deploy.yml'
      - '.github/workflows/azure-iac-validation.yml'
      - 'test/azure-production-plane-contract.test.mjs'
      - 'test/azure-governed-release-contract.test.mjs'

permissions:
  contents: read

concurrency:
  group: azure-iac-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Verify Azure CLI and Bicep compiler
        shell: bash
        run: |
          set -euo pipefail
          az version >/dev/null
          az bicep version

      - name: Compile all Azure Bicep templates
        shell: bash
        run: |
          set -euo pipefail
          for template in infra/*.bicep; do
            echo "Compiling ${template}"
            az bicep build --file "${template}" --stdout >/dev/null
          done

      - name: Validate governed Azure shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/azure-bootstrap-production.sh
          bash -n scripts/azure-bootstrap-current-directory.sh
          bash -n scripts/azure-first-release-current-directory.sh
          bash -n scripts/azure-converge-production.sh

      - name: Validate Azure production governed baseline contracts
        run: node --test test/azure-production-plane-contract.test.mjs test/azure-governed-release-contract.test.mjs
