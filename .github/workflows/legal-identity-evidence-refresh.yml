name: Governed Source Evidence Refresh

on:
  push:
    branches:
      - release/fdacs-lms-production-20260817
    paths:
      - .github/legal-identity-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate governed source evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate legal identity evidence
        run: node scripts/legal-identity-audit.mjs --write
      - name: Regenerate CMMC system evidence
        run: node scripts/cmmc-system-evidence.mjs --write
      - name: Verify regenerated evidence before persistence
        shell: bash
        run: |
          node scripts/legal-identity-audit.mjs --check
          node scripts/cmmc-system-evidence.mjs --check
      - name: Upload regenerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: governed-source-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/compliance/LEGAL-IDENTITY-AUDIT.json
            docs/compliance/LEGAL-IDENTITY-AUDIT.md
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
      - name: Commit regenerated evidence when changed
        shell: bash
        run: |
          paths=(
            docs/compliance/LEGAL-IDENTITY-AUDIT.json
            docs/compliance/LEGAL-IDENTITY-AUDIT.md
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Governed source evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Refresh generated governed source evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
