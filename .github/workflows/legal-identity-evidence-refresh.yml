name: Legal Identity Evidence Refresh

on:
  push:
    branches:
      - release/fdacs-lms-production-20260817
    paths:
      - .github/legal-identity-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate legal identity evidence
        run: node scripts/legal-identity-audit.mjs --write
      - name: Upload regenerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: legal-identity-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/compliance/LEGAL-IDENTITY-AUDIT.json
            docs/compliance/LEGAL-IDENTITY-AUDIT.md
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
      - name: Commit regenerated evidence when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/compliance/LEGAL-IDENTITY-AUDIT.json docs/compliance/LEGAL-IDENTITY-AUDIT.md docs/compliance/LEGAL-IDENTITY-AUDIT.sha256; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/compliance/LEGAL-IDENTITY-AUDIT.json docs/compliance/LEGAL-IDENTITY-AUDIT.md docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          git commit -m "Refresh generated legal identity evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
