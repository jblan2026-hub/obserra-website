name: Governed Source Evidence Refresh

on:
  push:
    branches:
      - release/fdacs-lms-production-20260817
    paths:
      - .github/legal-identity-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate governed source evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate legal identity evidence
        run: node scripts/legal-identity-audit.mjs --write
      - name: Verify legal identity evidence before persistence
        run: node scripts/legal-identity-audit.mjs --check
      - name: Commit legal identity evidence when changed
        shell: bash
        run: |
          paths=(
            docs/compliance/LEGAL-IDENTITY-AUDIT.json
            docs/compliance/LEGAL-IDENTITY-AUDIT.md
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Legal identity evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Refresh generated legal identity evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Require clean governed source tree before CMMC generation
        shell: bash
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Governed source tree is not clean before CMMC generation."
            git status --short
            exit 1
          fi

      - name: Regenerate CMMC system evidence from clean governed tree
        run: node scripts/cmmc-system-evidence.mjs --write
      - name: Regenerate CMMC technical and human disposition
        run: npm run generate:cmmc-disposition
      - name: Regenerate CMMC continuous-audit handoff views
        run: npm run generate:cmmc-handoff
      - name: Regenerate FDACS PII database audit record
        run: npm run generate:fdacs-pii-audit
      - name: Verify complete derived evidence before persistence
        shell: bash
        run: |
          node scripts/cmmc-system-evidence.mjs --check
          npm run verify:cmmc-disposition
          npm run verify:cmmc-handoff
          npm run verify:fdacs-pii-audit

      - name: Upload regenerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: governed-source-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/compliance/LEGAL-IDENTITY-AUDIT.json
            docs/compliance/LEGAL-IDENTITY-AUDIT.md
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.json
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256

      - name: Commit complete derived evidence when changed
        shell: bash
        run: |
          paths=(
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.json
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Derived evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Refresh complete derived governed evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify final governed evidence state
        shell: bash
        run: |
          npm run verify:cmmc-evidence
          git diff --exit-code
