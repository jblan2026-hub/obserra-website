name: Diagnose Vercel OIDC REST authentication

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-vercel-cutover.yml

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      TEAM_SLUG: obserra
      CANONICAL_PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
      PRIMARY_DOMAIN: www.obserrallc.com
    steps:
      - name: Mint GitHub Actions OIDC tokens
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const defaultToken = await core.getIDToken();
            const vercelAudienceToken = await core.getIDToken('https://vercel.com/obserra');
            core.setSecret(defaultToken);
            core.setSecret(vercelAudienceToken);
            core.setOutput('default_token', defaultToken);
            core.setOutput('vercel_audience_token', vercelAudienceToken);

      - name: Test read-only Vercel token-exchange variants
        shell: bash
        env:
          DEFAULT_OIDC_TOKEN: ${{ steps.oidc.outputs.default_token }}
          VERCEL_AUDIENCE_OIDC_TOKEN: ${{ steps.oidc.outputs.vercel_audience_token }}
        run: |
          set -euo pipefail

          rest_access_succeeded=false

          try_exchange() {
            local label="$1"
            local team_selector="$2"
            local oidc_token="$3"
            local exchange_body
            local exchange_status
            local access_token
            local error_code
            local error_description
            local read_body
            local read_status
            local read_project

            exchange_body="$(mktemp)"
            exchange_status="$(curl --silent --show-error \
              --output "${exchange_body}" \
              --write-out '%{http_code}' \
              --request POST \
              https://api.vercel.com/login/oauth/token \
              --data "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data "client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD" \
              --data "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
              --data "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
              --data-urlencode "team_id_or_slug=${team_selector}" \
              --data-urlencode "subject_token=${oidc_token}")"

            access_token="$(jq -r '.access_token // empty' "${exchange_body}" 2>/dev/null || true)"
            error_code="$(jq -r '.error // .error.code // empty' "${exchange_body}" 2>/dev/null || true)"
            error_description="$(jq -r '.error_description // .error.message // empty' "${exchange_body}" 2>/dev/null || true)"

            echo "VARIANT=${label}"
            echo "EXCHANGE_HTTP=${exchange_status}"
            echo "EXCHANGE_ERROR=${error_code}"
            echo "EXCHANGE_DESCRIPTION=${error_description}"

            if [ "${exchange_status}" != "200" ] || [ -z "${access_token}" ]; then
              rm -f "${exchange_body}"
              return 0
            fi

            echo "::add-mask::${access_token}"
            echo "EXCHANGE_SUCCEEDED=true"
            rm -f "${exchange_body}"

            read_body="$(mktemp)"
            read_status="$(curl --silent --show-error \
              --output "${read_body}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${access_token}" \
              "https://api.vercel.com/v9/projects/${CANONICAL_PROJECT_ID}/domains/${PRIMARY_DOMAIN}?teamId=${TEAM_ID}")"
            read_project="$(jq -r '.projectId // empty' "${read_body}" 2>/dev/null || true)"

            echo "REST_READ_HTTP=${read_status}"
            echo "REST_READ_PROJECT=${read_project}"

            if [ "${read_status}" = "200" ] && [ "${read_project}" = "${CANONICAL_PROJECT_ID}" ]; then
              rest_access_succeeded=true
            fi
            rm -f "${read_body}"
          }

          try_exchange default-token-team-id "${TEAM_ID}" "${DEFAULT_OIDC_TOKEN}"
          try_exchange default-token-team-slug "${TEAM_SLUG}" "${DEFAULT_OIDC_TOKEN}"
          try_exchange vercel-audience-token-team-id "${TEAM_ID}" "${VERCEL_AUDIENCE_OIDC_TOKEN}"
          try_exchange vercel-audience-token-team-slug "${TEAM_SLUG}" "${VERCEL_AUDIENCE_OIDC_TOKEN}"

          echo "OIDC_GENERAL_VERCEL_REST_AVAILABLE=${rest_access_succeeded}"
          if [ "${rest_access_succeeded}" != "true" ]; then
            exit 4
          fi
