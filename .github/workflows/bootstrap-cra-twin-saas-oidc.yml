name: Bootstrap CRA Twin SaaS OIDC

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-cra-twin-saas-oidc.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: bootstrap-cra-twin-saas-oidc
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: 38d660ff-611e-4f6c-ad29-70f5cf118f52
  AZURE_TENANT_ID: 7d8b7b64-c80c-4c8a-a514-66f6b1cf8607
  AZURE_CLIENT_ID: dc3ff3e1-ea35-4879-afa9-fa3eee49df85
  AZURE_RESOURCE_GROUP: rg-obserra-prod-eastus
  AZURE_DEPLOY_IDENTITY: id-obserra-github-prod
  BRANCH_CREDENTIAL_NAME: github-cra-twin-saas-feature
  PR_CREDENTIAL_NAME: github-cra-twin-saas-pr
  MAIN_CREDENTIAL_NAME: github-cra-twin-saas-main
  BRANCH_SUBJECT: repo:jblan2026-hub@309821056/Obserra-EU-CRA-governace-app@1332654162:ref:refs/heads/feature/obserra-advanced-frontends-20260822
  PR_SUBJECT: repo:jblan2026-hub@309821056/Obserra-EU-CRA-governace-app@1332654162:pull_request
  MAIN_SUBJECT: repo:jblan2026-hub@309821056/Obserra-EU-CRA-governace-app@1332654162:ref:refs/heads/main

jobs:
  authorize-twin-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate with existing Obserra Azure deployment identity
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Add Twin branch, PR and main federated credentials
        shell: bash
        run: |
          set -euo pipefail
          issuer='https://token.actions.githubusercontent.com'
          audience='api://AzureADTokenExchange'

          upsert_credential() {
            local name="$1"
            local subject="$2"
            if az identity federated-credential show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --identity-name "${AZURE_DEPLOY_IDENTITY}" \
              --name "${name}" >/dev/null 2>&1; then
              az identity federated-credential update \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --identity-name "${AZURE_DEPLOY_IDENTITY}" \
                --name "${name}" \
                --issuer "${issuer}" \
                --subject "${subject}" \
                --audiences "${audience}" \
                --output none
            else
              az identity federated-credential create \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --identity-name "${AZURE_DEPLOY_IDENTITY}" \
                --name "${name}" \
                --issuer "${issuer}" \
                --subject "${subject}" \
                --audiences "${audience}" \
                --output none
            fi

            az identity federated-credential show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --identity-name "${AZURE_DEPLOY_IDENTITY}" \
              --name "${name}" \
              --output json > "/tmp/${name}.json"
            jq -e --arg subject "${subject}" \
              '.subject == $subject and .issuer == "https://token.actions.githubusercontent.com" and (.audiences | index("api://AzureADTokenExchange")) != null' \
              "/tmp/${name}.json" >/dev/null
          }

          upsert_credential "${BRANCH_CREDENTIAL_NAME}" "${BRANCH_SUBJECT}"
          upsert_credential "${PR_CREDENTIAL_NAME}" "${PR_SUBJECT}"
          upsert_credential "${MAIN_CREDENTIAL_NAME}" "${MAIN_SUBJECT}"

          echo "CRA_TWIN_SAAS_BRANCH_OIDC=authorized" >> "$GITHUB_STEP_SUMMARY"
          echo "CRA_TWIN_SAAS_PR_OIDC=authorized" >> "$GITHUB_STEP_SUMMARY"
          echo "CRA_TWIN_SAAS_MAIN_OIDC=authorized" >> "$GITHUB_STEP_SUMMARY"

      - name: Record OIDC authorization evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -cn \
            --arg generated_at "${generated_at}" \
            --arg subscription "${AZURE_SUBSCRIPTION_ID}" \
            --arg tenant "${AZURE_TENANT_ID}" \
            --arg client "${AZURE_CLIENT_ID}" \
            --arg branch_subject "${BRANCH_SUBJECT}" \
            --arg pr_subject "${PR_SUBJECT}" \
            --arg main_subject "${MAIN_SUBJECT}" \
            '{status:"authorized",generated_at:$generated_at,subscription_id:$subscription,tenant_id:$tenant,client_id:$client,branch_subject:$branch_subject,pr_subject:$pr_subject,main_subject:$main_subject}')"
          encoded="$(printf '%s\n' "${payload}" | base64 -w0)"
          path='ops/cra-twin-saas-oidc-authorized.json'
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha 2>/dev/null || true)"
          if [ -n "${current_sha}" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='ops(azure): record CRA Twin OIDC authorization' \
              -f content="${encoded}" \
              -f sha="${current_sha}" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='ops(azure): record CRA Twin OIDC authorization' \
              -f content="${encoded}" >/dev/null
          fi
