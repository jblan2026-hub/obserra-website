name: PR168 Downstream Evidence Remediation

on:
  push:
    branches:
      - ci/pr168-cmmc-remediation-20260820
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH: docs/postmerge-handoff-20260820
      EXPECTED_HEAD: 5bcb192acc118df822ae80c24ddee7bce49c9c58
      CI: "true"
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Require exact PR head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "Refusing remediation: expected $EXPECTED_HEAD, found $actual" >&2
            exit 1
          }
          test -z "$(git status --porcelain)"

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate downstream governed evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:cmmc-disposition
          npm run generate:fdacs-pii-audit
          npm run generate:cmmc-handoff

      - name: Verify complete CMMC evidence chain
        run: npm run verify:cmmc-evidence

      - name: Enforce downstream generated-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 8
          expected=(
            "docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md"
            "docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256"
            "docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json"
            "docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md"
            "docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256"
            "docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json"
            "docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md"
            "docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256"
          )
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Commit and push downstream evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256 \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          git commit -m "docs(compliance): converge handoff evidence chain"
          git push origin "HEAD:${TARGET_BRANCH}"
