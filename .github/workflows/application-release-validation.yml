name: Temporary Production Secret Provisioning

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

concurrency:
  group: temporary-production-secret-provisioning
  cancel-in-progress: false

jobs:
  provision-academy-access-signing-secret:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/production-authority-reconciliation-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      CANONICAL_PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
    steps:
      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}"

      - name: Upsert dedicated Academy signing secret
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          export SIGNING_SECRET
          node <<'NODE'
          const fs = require('fs');
          const payload = [{
            key: 'ACADEMY_ACCESS_SIGNING_SECRET',
            value: process.env.SIGNING_SECRET,
            type: 'sensitive',
            target: ['production'],
            comment: 'Dedicated HMAC key for Obserra EPI Academy anonymous access cookies. Managed separately from Stripe webhook credentials.'
          }];
          fs.writeFileSync('/tmp/vercel-env-payload.json', JSON.stringify(payload), { mode: 0o600 });
          NODE
          status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/vercel-env-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/vercel-env-payload.json \
            "https://api.vercel.com/v10/projects/${CANONICAL_PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}")"
          rm -f /tmp/vercel-env-payload.json
          unset SIGNING_SECRET
          if [ "${status}" != "200" ] && [ "${status}" != "201" ]; then
            rm -f /tmp/vercel-env-response.json
            echo "::error::Vercel environment-variable upsert failed with HTTP ${status}."
            exit 1
          fi
          rm -f /tmp/vercel-env-response.json

      - name: Verify secret metadata without decryption
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${CANONICAL_PROJECT_ID}/env?teamId=${TEAM_ID}")"
          count="$(jq '[.envs[]? | select(.key == "ACADEMY_ACCESS_SIGNING_SECRET") | select(.type == "sensitive") | select((.target // []) | index("production"))] | length' <<<"${response}")"
          if [ "${count}" -lt 1 ]; then
            echo "::error::Dedicated Academy signing secret metadata was not present after upsert."
            exit 1
          fi
          echo "Dedicated Academy signing secret is configured as sensitive for production on the canonical project."
