name: Temporary Paired CMMC Evidence Refresh

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: temporary-paired-cmmc-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh-paired-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/production-authority-reconciliation-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate paired governed evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:cmmc-disposition
          npm run generate:fdacs-pii-audit
          npm run generate:cmmc-handoff
          npm run verify:cmmc-evidence

      - name: Verify only paired generated evidence changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -ge 1
          for path in "${changed[@]}"; do
            case "$path" in
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json|docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md|docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256|docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.json|docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md|docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256|docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json|docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md|docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit exact paired evidence
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.json \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          git diff --cached --check
          git commit -m "chore(compliance): refresh paired CMMC evidence"
          git push origin "HEAD:${HEAD_REF}"
