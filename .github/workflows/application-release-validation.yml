name: Temporary Governed Evidence Refresh

on:
  push:
    branches:
      - fix/production-authority-reconciliation-20260819
    paths:
      - ".github/workflows/application-release-validation.yml"

permissions:
  contents: write

concurrency:
  group: temporary-governed-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm bounded branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/production-authority-reconciliation-20260819"

      - name: Regenerate governed non-final evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:legal-identity-audit
          npm run generate:cmmc-system-evidence
          npm run verify:legal-identity-audit
          npm run verify:cmmc-system-evidence

      - name: Verify only generated evidence changed
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          docs/compliance/CMMC-SYSTEM-EVIDENCE.json
          docs/compliance/CMMC-SYSTEM-EVIDENCE.md
          docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          docs/compliance/LEGAL-IDENTITY-AUDIT.json
          docs/compliance/LEGAL-IDENTITY-AUDIT.md
          docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit exact generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/LEGAL-IDENTITY-AUDIT.json \
            docs/compliance/LEGAL-IDENTITY-AUDIT.md \
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          git diff --cached --check
          git commit -m "chore(compliance): refresh generated evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
