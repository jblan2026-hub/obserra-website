name: Temporary CMMC Evidence Refresh

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: temporary-cmmc-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh-cmmc:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/production-authority-reconciliation-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate CMMC evidence from committed inputs
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:cmmc-system-evidence
          npm run verify:cmmc-system-evidence

      - name: Verify only governed CMMC evidence changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -ge 2
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/compliance/CMMC-SYSTEM-EVIDENCE.json'
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256'
          for path in "${changed[@]}"; do
            case "$path" in
              docs/compliance/CMMC-SYSTEM-EVIDENCE.json|docs/compliance/CMMC-SYSTEM-EVIDENCE.md|docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit exact CMMC generated evidence
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          git diff --cached --check
          git commit -m "chore(compliance): refresh CMMC evidence from clean inputs"
          git push origin "HEAD:${HEAD_REF}"
