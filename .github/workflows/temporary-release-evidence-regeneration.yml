name: Temporary release evidence regeneration

on:
  push:
    branches:
      - codex/restore-speaking-recognition-20260815

permissions:
  contents: write

concurrency:
  group: temporary-release-evidence-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove this one-use workflow
        run: git rm .github/workflows/temporary-release-evidence-regeneration.yml

      - name: Commit stabilized source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary evidence workflow"

      - name: Regenerate and commit legal identity evidence
        run: |
          node scripts/legal-identity-audit.mjs --write
          git add docs/compliance/LEGAL-IDENTITY-AUDIT.json docs/compliance/LEGAL-IDENTITY-AUDIT.md docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          git commit -m "Refresh legal identity evidence"

      - name: Regenerate controlled release evidence
        run: |
          node scripts/cmmc-system-evidence.mjs --write
          node scripts/cmmc-technical-human-disposition.mjs --write
          node scripts/cmmc-continuous-audit-handoff.mjs --write
          node scripts/fdacs-pii-database-audit-record.mjs --write
          node scripts/cmmc-system-evidence.mjs --check
          node scripts/cmmc-technical-human-disposition.mjs --check
          node scripts/cmmc-continuous-audit-handoff.mjs --check
          node scripts/legal-identity-audit.mjs --check
          node scripts/fdacs-pii-database-audit-record.mjs --check
          git add docs/compliance/CMMC-SYSTEM-EVIDENCE.json docs/compliance/CMMC-SYSTEM-EVIDENCE.md docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          git add docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256
          git add docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          git commit -m "Refresh controlled release evidence"

      - name: Push exact regenerated branch
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
