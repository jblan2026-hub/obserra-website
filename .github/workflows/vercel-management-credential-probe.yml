name: Vercel management credential probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      CANONICAL_PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
    steps:
      - name: Require configured management credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Vercel management credential is not configured in GitHub Actions."
            exit 2
          fi
          echo "Vercel management credential is configured."

      - name: Verify read-only Vercel management authorization
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output "${body}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${CANONICAL_PROJECT_ID}?teamId=${TEAM_ID}")"
          if [ "${status}" != "200" ]; then
            echo "::error::Configured Vercel credential is not authorized for canonical project management (HTTP ${status})."
            rm -f "${body}"
            exit 3
          fi
          project="$(jq -r '.id // empty' "${body}")"
          rm -f "${body}"
          test "${project}" = "${CANONICAL_PROJECT_ID}" || {
            echo "::error::Vercel credential returned an unexpected project identity."
            exit 4
          }
          echo "Vercel management credential has canonical project read authorization."
