name: One-time Next security lock remediation

on:
  push:
    branches:
      - feature/florida-class-d-lms-foundation
    paths:
      - "package.json"

permissions:
  contents: write

concurrency:
  group: one-time-next-security-lock
  cancel-in-progress: false

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/florida-class-d-lms-foundation
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate dependency lock from declared versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean locked install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run repository tests
        run: npm test

      - name: Run static validation
        run: npm run lint

      - name: Build production application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""

      - name: Commit regenerated lock only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate lock for patched Next dependencies"
          git push origin HEAD:feature/florida-class-d-lms-foundation
