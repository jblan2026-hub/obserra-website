name: Production Vercel public cutover
# The exact merge SHA is required for independently auditable public cutover evidence.
run-name: Canonical Vercel public cutover for ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-vercel-public-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      CANONICAL_PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
      DUPLICATE_PROJECT_ID: prj_FfAnssVJU8pcJydGNJHmCliP6Yme
      NON_CANONICAL_DOMAIN_PROJECT_IDS: "prj_FfAnssVJU8pcJydGNJHmCliP6Yme prj_v6Hb7FkpkUoLKlHkjzKJ5HVgYDaL"
      PRIMARY_DOMAIN: www.obserrallc.com
      APEX_DOMAIN: obserrallc.com
    steps:
      - name: Require configured Vercel credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Neither VERCEL_TOKEN nor VERCEL_ACCESS_TOKEN is configured."
            exit 1
          fi

      - name: Wait for exact canonical READY deployment
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=""
          for attempt in $(seq 1 60); do
            response=""
            if ! response="$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 20 \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${CANONICAL_PROJECT_ID}&teamId=${TEAM_ID}&limit=100")"; then
              echo "::warning::Vercel deployment lookup failed on attempt ${attempt}/60; retrying."
              sleep 10
              continue
            fi
            if ! candidate="$(jq -r --arg sha "${GITHUB_SHA}" '
              [.deployments[]
                | select((.meta.githubCommitSha // "") == $sha)
                | select((.readyState // .state // "") == "READY")
                | (.uid // .id // empty)][0] // empty
            ' <<<"${response}" 2>/dev/null)"; then
              candidate=""
              echo "::warning::Vercel deployment lookup returned an unreadable response on attempt ${attempt}/60; retrying."
            fi
            if [ -n "${candidate}" ]; then
              break
            fi
            echo "Waiting for canonical Vercel deployment for ${GITHUB_SHA} (${attempt}/60)."
            sleep 10
          done
          if [ -z "${candidate}" ]; then
            echo "::error::No exact READY canonical deployment appeared for ${GITHUB_SHA}."
            exit 1
          fi
          details="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 20 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${candidate}?teamId=${TEAM_ID}")"
          project="$(jq -r '.projectId // .project.id // empty' <<<"${details}")"
          sha="$(jq -r '.meta.githubCommitSha // empty' <<<"${details}")"
          ready="$(jq -r '.readyState // .state // empty' <<<"${details}")"
          deployment_url="$(jq -r '.url // empty' <<<"${details}")"
          if [ "${project}" != "${CANONICAL_PROJECT_ID}" ] || [ "${sha}" != "${GITHUB_SHA}" ] || [ "${ready}" != "READY" ]; then
            echo "::error::Canonical deployment identity verification failed."
            exit 1
          fi
          if [ -z "${deployment_url}" ] || [[ ! "${deployment_url}" =~ ^[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Canonical deployment URL is missing or invalid."
            exit 1
          fi
          echo "deployment_id=${candidate}" >> "${GITHUB_OUTPUT}"
          echo "deployment_url=https://${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Preflight exact canonical deployment health
        id: preflight
        shell: bash
        env:
          CANDIDATE_DEPLOYMENT: ${{ steps.candidate.outputs.deployment_id }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.deployment_url }}
        run: |
          set -euo pipefail
          # This block never receives a provider credential. The trace is limited to
          # the failed public-contract command and its exit code.
          trap 'code=$?; printf "::error::Candidate preflight command failed (exit %s): %s\\n" "$code" "$BASH_COMMAND" >&2; exit "$code"' ERR

          website_headers="$(mktemp)"
          website_body="$(mktemp)"
          website_status="$(curl --silent --show-error --max-time 30 \
            --output "${website_body}" \
            --dump-header "${website_headers}" \
            --write-out '%{http_code}' \
            "${CANDIDATE_URL}/api/health")"
          test "${website_status}" = "200"
          jq -e \
            --arg expected_project_id "${CANONICAL_PROJECT_ID}" \
            --arg expected_deployment "${CANDIDATE_DEPLOYMENT}" \
            --arg expected_sha "${GITHUB_SHA}" '
              .service == "obserra-website" and
              .status == "live" and
              .contract == "website-liveness-v1" and
              .routing.expectedProjectId == $expected_project_id and
              .routing.observedProjectId == $expected_project_id and
              .routing.deploymentId == $expected_deployment and
              .routing.gitCommitSha == $expected_sha and
              .routing.authority == "verified" and
              .routing.verified == true
            ' "${website_body}" >/dev/null
          grep -Eqi '^cache-control:[[:space:]]*no-store' "${website_headers}"
          grep -Eqi '^x-obserra-routing-authority:[[:space:]]*verified' "${website_headers}"

          commerce_headers="$(mktemp)"
          commerce_body="$(mktemp)"
          commerce_status="$(curl --silent --show-error --max-time 30 \
            --output "${commerce_body}" \
            --dump-header "${commerce_headers}" \
            --write-out '%{http_code}' \
            "${CANDIDATE_URL}/api/academy/commerce-health")"
          if [ "${commerce_status}" = "200" ]; then
            jq -e '
              .contract == "academy-commerce-health-v1" and
              .operational == true and
              .paymentProvider == "stripe" and
              .providerVerification.environment == "live" and
              .providerVerification.connected == true and
              .providerVerification.chargesEnabled == true and
              .webhookVerification == "required" and
              .identity == "available" and
              .identityEnvironment == "live" and
              .durableStorage == "available" and
              .storageSchema == "academy-durable-state-v2" and
              .purchaserIdentityHashing == "available" and
              .fulfillment.idempotencyKey == "stripe-event-id" and
              .fulfillment.auditLedger == "durable-supabase"
            ' "${commerce_body}" >/dev/null
          elif [ "${commerce_status}" = "503" ]; then
            jq -e '
              .contract == "academy-commerce-health-v1" and
              .operational == false and
              .identity == "available" and
              .identityEnvironment == "live"
            ' "${commerce_body}" >/dev/null

            # Direct deployment hosts intentionally expose read-only GET health contracts.
            # The checkout lock is verified on the canonical host after alias assignment,
            # when rollback aliases have already been captured.
          else
            echo "::error::Academy commerce health returned unexpected HTTP ${commerce_status}."
            exit 1
          fi
          grep -Eqi '^cache-control:[[:space:]]*no-store' "${commerce_headers}"
          grep -Eqi '^x-obserra-commerce-contract:[[:space:]]*academy-commerce-health-v1' "${commerce_headers}"

          applications_headers="$(mktemp)"
          applications_body="$(mktemp)"
          applications_status="$(curl --silent --show-error --max-time 30 \
            --output "${applications_body}" \
            --dump-header "${applications_headers}" \
            --write-out '%{http_code}' \
            "${CANDIDATE_URL}/api/apps/commerce-health")"
          if [ "${applications_status}" = "200" ]; then
            jq -e '
              .contract == "applications-commerce-health-v1" and
              .operational == true and
              .schemaVersion == "applications-commerce-v1" and
              .eventLedger == "append-only" and
              .entitlementAuthority == "durable-subscription-snapshot-v1" and
              .stripeConfigured == true and
              .stripeLivemode == true and
              .providerConnected == true and
              .chargesEnabled == true and
              .identityReady == true
            ' "${applications_body}" >/dev/null
          elif [ "${applications_status}" = "503" ]; then
            jq -e '
              .contract == "applications-commerce-health-v1" and
              .operational == false and
              .schemaVersion == "applications-commerce-v1"
            ' "${applications_body}" >/dev/null
          else
            echo "::error::Applications commerce health returned unexpected HTTP ${applications_status}."
            exit 1
          fi
          grep -Eqi '^cache-control:[[:space:]]*no-store' "${applications_headers}"

          florida_live="$(mktemp)"
          florida_live_status="$(curl --silent --show-error --max-time 30 \
            --output "${florida_live}" \
            --write-out '%{http_code}' \
            "${CANDIDATE_URL}/api/florida-class-d/health/live")"
          test "${florida_live_status}" = "200"
          jq -e '.service == "florida-class-d-lms" and .status == "live"' "${florida_live}" >/dev/null

          florida_ready="$(mktemp)"
          florida_ready_headers="$(mktemp)"
          florida_ready_status="$(curl --silent --show-error --max-time 30 \
            --output "${florida_ready}" \
            --dump-header "${florida_ready_headers}" \
            --write-out '%{http_code}' \
            "${CANDIDATE_URL}/api/florida-class-d/health/ready")"
          if [ "${florida_ready_status}" = "200" ]; then
            jq -e '.service == "florida-class-d-lms" and .status == "ready"' "${florida_ready}" >/dev/null
          elif [ "${florida_ready_status}" = "503" ]; then
            jq -e '.service == "florida-class-d-lms" and .status == "not_ready"' "${florida_ready}" >/dev/null
            grep -Eqi '^retry-after:[[:space:]]*[0-9]+' "${florida_ready_headers}"
          else
            echo "::error::Florida Class D readiness returned unexpected HTTP ${florida_ready_status}."
            exit 1
          fi

      - name: Capture rollback aliases
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          alias_deployment() {
            local alias="$1"
            local body
            local status
            local code
            local message
            local deployment
            body="$(mktemp)"
            if ! status="$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${body}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v4/aliases/${alias}?teamId=${TEAM_ID}")"; then
              rm -f "${body}"
              echo "::error::Vercel rollback-alias lookup failed before an HTTP response was received for ${alias}." >&2
              return 1
            fi
            code="$(jq -r '.error.code // empty' "${body}" 2>/dev/null || true)"
            message="$(jq -r '.error.message // empty' "${body}" 2>/dev/null || true)"
            if [ "${status}" = "404" ]; then
              rm -f "${body}"
              echo "::error::Required rollback alias ${alias} is not configured (HTTP 404${code:+, ${code}})." >&2
              return 1
            fi
            if [ "${status}" != "200" ]; then
              rm -f "${body}"
              echo "::error::Vercel rollback-alias lookup failed for ${alias}: HTTP ${status}${code:+, ${code}}${message:+ - ${message}}" >&2
              return 1
            fi
            deployment="$(jq -r '.deploymentId // .deployment.id // empty' "${body}")"
            rm -f "${body}"
            if [ -z "${deployment}" ]; then
              echo "::error::Vercel returned no deployment ID for required rollback alias ${alias}." >&2
              return 1
            fi
            printf '%s\n' "${deployment}"
          }
          primary="$(alias_deployment "${PRIMARY_DOMAIN}")"
          apex="$(alias_deployment "${APEX_DOMAIN}")"
          echo "primary=${primary}" >> "${GITHUB_OUTPUT}"
          echo "apex=${apex}" >> "${GITHUB_OUTPUT}"

      - name: Move canonical domains to production project
        id: move
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          move_domain() {
            local domain="$1"
            local output_name="$2"
            local project_id
            local body
            local status
            local reported_project
            local source_project
            local target_body
            local target_status
            local target_project
            local move_response
            local moved_project
            local moved_name
            local -a source_projects
            source_projects=()

            for project_id in ${NON_CANONICAL_DOMAIN_PROJECT_IDS}; do
              body="$(mktemp)"
              if ! status="$(curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 20 \
                --output "${body}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v9/projects/${project_id}/domains/${domain}?teamId=${TEAM_ID}")"; then
                rm -f "${body}"
                echo "::error::Unable to determine project-domain ownership for ${domain} on ${project_id} before an HTTP response was received."
                return 1
              fi

              if [ "${status}" = "404" ]; then
                rm -f "${body}"
                continue
              fi
              if [ "${status}" != "200" ]; then
                cat "${body}" >&2 || true
                rm -f "${body}"
                echo "::error::Unable to determine project-domain ownership for ${domain} on ${project_id}: HTTP ${status}."
                return 1
              fi

              reported_project="$(jq -r '.projectId // empty' "${body}")"
              rm -f "${body}"
              if [ "${reported_project}" != "${project_id}" ]; then
                echo "::error::Domain ${domain} lookup for ${project_id} returned inconsistent ownership ${reported_project:-<empty>}."
                return 1
              fi
              source_projects+=("${project_id}")
            done

            if [ "${#source_projects[@]}" -gt 1 ]; then
              echo "::error::Ambiguous noncanonical ownership for ${domain}: ${source_projects[*]}."
              return 1
            fi

            if [ "${#source_projects[@]}" -eq 0 ]; then
              target_body="$(mktemp)"
              if ! target_status="$(curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 20 \
                --output "${target_body}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v9/projects/${CANONICAL_PROJECT_ID}/domains/${domain}?teamId=${TEAM_ID}")"; then
                rm -f "${target_body}"
                echo "::error::Unable to verify canonical ownership for ${domain} before an HTTP response was received."
                return 1
              fi
              if [ "${target_status}" != "200" ]; then
                cat "${target_body}" >&2 || true
                rm -f "${target_body}"
                echo "::error::Domain ${domain} is absent from every known noncanonical claimant and not owned by the canonical project (HTTP ${target_status})."
                return 1
              fi
              target_project="$(jq -r '.projectId // empty' "${target_body}")"
              rm -f "${target_body}"
              if [ "${target_project}" != "${CANONICAL_PROJECT_ID}" ]; then
                echo "::error::Domain ${domain} canonical ownership response is inconsistent."
                return 1
              fi
              echo "${output_name}_moved=false" >> "${GITHUB_OUTPUT}"
              echo "${output_name}_source_project=" >> "${GITHUB_OUTPUT}"
              return 0
            fi

            source_project="${source_projects[0]}"
            move_response="$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 20 \
              --request POST \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"projectId\":\"${CANONICAL_PROJECT_ID}\"}" \
              "https://api.vercel.com/v1/projects/${source_project}/domains/${domain}/move?teamId=${TEAM_ID}")"
            moved_project="$(jq -r '.projectId // empty' <<<"${move_response}")"
            moved_name="$(jq -r '.name // empty' <<<"${move_response}")"
            if [ "${moved_project}" != "${CANONICAL_PROJECT_ID}" ] || [ "${moved_name}" != "${domain}" ]; then
              echo "::error::Vercel returned an inconsistent ownership result while moving ${domain}."
              return 1
            fi
            echo "${output_name}_moved=true" >> "${GITHUB_OUTPUT}"
            echo "${output_name}_source_project=${source_project}" >> "${GITHUB_OUTPUT}"
          }

          move_domain "${PRIMARY_DOMAIN}" primary
          move_domain "${APEX_DOMAIN}" apex

      - name: Assign canonical domains to exact candidate deployment
        id: alias
        if: steps.move.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_DEPLOYMENT: ${{ steps.candidate.outputs.deployment_id }}
        run: |
          set -euo pipefail
          test -n "${CANDIDATE_DEPLOYMENT}"

          assign_alias() {
            local domain="$1"
            local body
            local status
            local assigned

            body="$(mktemp)"
            if ! status="$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${body}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"alias\":\"${domain}\"}" \
              "https://api.vercel.com/v2/deployments/${CANDIDATE_DEPLOYMENT}/aliases?teamId=${TEAM_ID}")"; then
              rm -f "${body}"
              echo "::error::Unable to assign ${domain} to the approved candidate deployment before an HTTP response was received."
              return 1
            fi

            if [ "${status}" != "200" ] && [ "${status}" != "201" ]; then
              rm -f "${body}"
              echo "::error::Unable to assign ${domain} to the approved candidate deployment: HTTP ${status}."
              return 1
            fi

            assigned="$(jq -r '.alias // .name // empty' "${body}")"
            rm -f "${body}"
            if [ "${assigned}" != "${domain}" ]; then
              echo "::error::Vercel returned an inconsistent alias assignment for ${domain}."
              return 1
            fi
          }

          assign_alias "${PRIMARY_DOMAIN}"
          assign_alias "${APEX_DOMAIN}"

      - name: Verify canonical LMS and prelicense commerce lock
        id: smoke
        if: steps.alias.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_DEPLOYMENT: ${{ steps.candidate.outputs.deployment_id }}
        run: |
          set -euo pipefail
          observed_deployment=""
          observed_sha=""
          observed_project=""
          for attempt in $(seq 1 12); do
            health="$(curl --silent --show-error --fail --max-time 20 "https://${PRIMARY_DOMAIN}/api/health" || true)"
            observed_deployment="$(jq -r '.routing.deploymentId // empty' <<<"${health}" 2>/dev/null || true)"
            observed_sha="$(jq -r '.routing.gitCommitSha // empty' <<<"${health}" 2>/dev/null || true)"
            observed_project="$(jq -r '.routing.observedProjectId // empty' <<<"${health}" 2>/dev/null || true)"
            if [ "${observed_deployment}" = "${CANDIDATE_DEPLOYMENT}" ] \
              && [ "${observed_sha}" = "${GITHUB_SHA}" ] \
              && [ "${observed_project}" = "${CANONICAL_PROJECT_ID}" ]; then
              break
            fi
            sleep 10
          done
          test "${observed_deployment}" = "${CANDIDATE_DEPLOYMENT}"
          test "${observed_sha}" = "${GITHUB_SHA}"
          test "${observed_project}" = "${CANONICAL_PROJECT_ID}"

          curl --silent --show-error --fail --max-time 20 "https://${PRIMARY_DOMAIN}/" >/dev/null
          academy="$(curl --silent --show-error --fail --max-time 20 "https://${PRIMARY_DOMAIN}/academy")"
          printf '%s' "${academy}" | grep -F "Academy LMS is live; new enrollment is not yet open" >/dev/null
          curl --silent --show-error --fail --max-time 20 "https://${PRIMARY_DOMAIN}/florida-security-training" >/dev/null
          curl --silent --show-error --fail --max-time 20 "https://${PRIMARY_DOMAIN}/apps" >/dev/null
          curl --silent --show-error --fail --max-time 20 https://app.obserrallc.com/api/health >/dev/null

          canonical_applications_headers="$(mktemp)"
          canonical_applications_body="$(mktemp)"
          canonical_applications_status="$(curl --silent --show-error --max-time 20 \
            --output "${canonical_applications_body}" \
            --dump-header "${canonical_applications_headers}" \
            --write-out '%{http_code}' \
            "https://${PRIMARY_DOMAIN}/api/apps/commerce-health")"
          if [ "${canonical_applications_status}" = "200" ]; then
            jq -e '.contract == "applications-commerce-health-v1" and .operational == true' "${canonical_applications_body}" >/dev/null
          elif [ "${canonical_applications_status}" = "503" ]; then
            jq -e '.contract == "applications-commerce-health-v1" and .operational == false' "${canonical_applications_body}" >/dev/null
          else
            echo "::error::Canonical Applications commerce health returned unexpected HTTP ${canonical_applications_status}."
            exit 1
          fi
          grep -Eqi '^cache-control:[[:space:]]*no-store' "${canonical_applications_headers}"

          attempt_id="$(cat /proc/sys/kernel/random/uuid)"
          issued_at="$(date +%s)"
          checkout_headers="$(mktemp)"
          checkout_body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 \
            --output "${checkout_body}" \
            --dump-header "${checkout_headers}" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Origin: https://${PRIMARY_DOMAIN}" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "course=zero-trust-strategy" \
            --data-urlencode "checkoutAttemptId=${attempt_id}" \
            --data-urlencode "checkoutAttemptIssuedAt=${issued_at}" \
            "https://${PRIMARY_DOMAIN}/api/academy/checkout")"
          test "${status}" = "307"
          grep -i '^location: .*enrollment=licensing-pending' "${checkout_headers}" >/dev/null
          grep -i '^x-obserra-sales-license: pending' "${checkout_headers}" >/dev/null

      - name: Quarantine duplicate project and verify canonical domain ownership
        id: quarantine
        if: steps.smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 20 \
            --request PATCH \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"commandForIgnoringBuildStep":"exit 0"}' \
            "https://api.vercel.com/v9/projects/${DUPLICATE_PROJECT_ID}?teamId=${TEAM_ID}" \
            >/dev/null

          for project_id in ${NON_CANONICAL_DOMAIN_PROJECT_IDS}; do
            project_domains="$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 20 \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${project_id}/domains?teamId=${TEAM_ID}&limit=100")"
            if jq -e --arg primary "${PRIMARY_DOMAIN}" --arg apex "${APEX_DOMAIN}" '
              .domains[]? | select(.name == $primary or .name == $apex)
            ' <<<"${project_domains}" >/dev/null; then
              echo "::error::Noncanonical Vercel project ${project_id} still owns a canonical production domain after move."
              exit 1
            fi
          done

          health="$(curl --silent --show-error --fail --max-time 20 "https://${PRIMARY_DOMAIN}/api/health")"
          observed_project="$(jq -r '.routing.observedProjectId // empty' <<<"${health}")"
          observed_sha="$(jq -r '.routing.gitCommitSha // empty' <<<"${health}")"
          if [ "${observed_project}" != "${CANONICAL_PROJECT_ID}" ] || [ "${observed_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Canonical production identity changed during duplicate-project quarantine."
            exit 1
          fi

      - name: Roll back canonical domains on failed cutover
        id: recovery
        if: ${{ always() && steps.rollback.outcome == 'success' && steps.rollback.outputs.primary != '' && steps.rollback.outputs.apex != '' && (steps.move.outcome == 'failure' || steps.alias.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        shell: bash
        env:
          ROLLBACK_PRIMARY: ${{ steps.rollback.outputs.primary }}
          ROLLBACK_APEX: ${{ steps.rollback.outputs.apex }}
          ROLLBACK_PRIMARY_PROJECT: ${{ steps.move.outputs.primary_source_project }}
          ROLLBACK_APEX_PROJECT: ${{ steps.move.outputs.apex_source_project }}
          MOVED_PRIMARY: ${{ steps.move.outputs.primary_moved }}
          MOVED_APEX: ${{ steps.move.outputs.apex_moved }}
        run: |
          set -euo pipefail
          if [ -z "${ROLLBACK_PRIMARY}" ] || [ -z "${ROLLBACK_APEX}" ]; then
            echo "::error::Rollback deployment IDs were not captured; canonical domains cannot be safely restored."
            exit 1
          fi

          restore_domain() {
            local domain="$1"
            local moved="$2"
            local source_project="$3"
            local deployment="$4"
            local body
            local status

            if [ -z "${deployment}" ]; then
              echo "::error::Rollback deployment was not captured for ${domain}."
              return 1
            fi

            if [ "${moved}" = "true" ]; then
              if [ -z "${source_project}" ]; then
                echo "::error::Rollback source project was not captured for moved domain ${domain}."
                return 1
              fi

              body="$(mktemp)"
              status="$(curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 20 \
                --output "${body}" \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "{\"projectId\":\"${source_project}\"}" \
                "https://api.vercel.com/v1/projects/${CANONICAL_PROJECT_ID}/domains/${domain}/move?teamId=${TEAM_ID}")"
              if [ "${status}" != "200" ]; then
                rm -f "${body}"
                echo "::error::Failed to return ${domain} to prior Vercel project ${source_project}: HTTP ${status}."
                return 1
              fi
              rm -f "${body}"
            fi

            curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 20 \
              --request POST \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"alias\":\"${domain}\"}" \
              "https://api.vercel.com/v2/deployments/${deployment}/aliases?teamId=${TEAM_ID}" \
              >/dev/null
          }

          restore_domain "${PRIMARY_DOMAIN}" "${MOVED_PRIMARY}" "${ROLLBACK_PRIMARY_PROJECT}" "${ROLLBACK_PRIMARY}"
          restore_domain "${APEX_DOMAIN}" "${MOVED_APEX}" "${ROLLBACK_APEX_PROJECT}" "${ROLLBACK_APEX}"
          echo "::error::Production cutover failed; every canonical alias was restored and every moved domain was returned to its captured prior project."
          exit 1

      - name: Publish safe cutover control-plane outcome
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ROLLBACK_CAPTURE_OUTCOME: ${{ steps.rollback.outcome }}
          MOVE_OUTCOME: ${{ steps.move.outcome }}
          ALIAS_OUTCOME: ${{ steps.alias.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          QUARANTINE_OUTCOME: ${{ steps.quarantine.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          context="Obserra canonical cutover evidence"
          state="failure"
          description="cutover failed before recorded phase"

          if [ "${RECOVERY_OUTCOME}" = "failure" ]; then
            description="cutover failed; canonical rollback did not complete"
          elif [ "${CREDENTIAL_OUTCOME}" != "success" ]; then
            description="blocked: Vercel credential unavailable"
          elif [ "${CANDIDATE_OUTCOME}" != "success" ]; then
            description="blocked: exact candidate not verified"
          elif [ "${PREFLIGHT_OUTCOME}" != "success" ]; then
            description="blocked: candidate preflight failed"
          elif [ "${ROLLBACK_CAPTURE_OUTCOME}" != "success" ]; then
            description="blocked: prior canonical aliases not captured"
          elif [ "${MOVE_OUTCOME}" != "success" ]; then
            description="blocked: canonical domain ownership move failed"
          elif [ "${ALIAS_OUTCOME}" != "success" ]; then
            description="blocked: canonical alias assignment failed"
          elif [ "${SMOKE_OUTCOME}" != "success" ]; then
            description="blocked: canonical post-cutover smoke failed"
          elif [ "${QUARANTINE_OUTCOME}" != "success" ]; then
            description="blocked: duplicate-project quarantine failed"
          else
            state="success"
            description="canonical host verified exact candidate"
          fi

          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc             --arg state "${state}"             --arg context "${context}"             --arg description "${description}"             --arg target_url "${target_url}"             '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --silent --show-error --fail-with-body             --request POST             --header "Authorization: Bearer ${GITHUB_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "Content-Type: application/json"             --data "${payload}"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             >/dev/null
