name: Marketplace v1.2 Stripe reconciliation request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ops/marketplace-v12-stripe-reconcile-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-v12-stripe-binding-reconciliation
  cancel-in-progress: false

env:
  EXPECTED_CATALOG_REVISION: 487043cc23975012e83764a9a0f258f9ff705ab656084be558e76fa64f47faf2
  EXECUTION_BRANCH: ops/execute-marketplace-v12-stripe-reconcile-20260823
  AZURE_TENANT_ID: 7d8b7b64-c80c-4c8a-a514-66f6b1cf8607
  AZURE_SUBSCRIPTION_ID: 38d660ff-611e-4f6c-ad29-70f5cf118f52
  AZURE_DELIVERY_CLIENT_ID: b8da232a-713f-4c25-a61e-4fb34d13e229
  AZURE_KEY_VAULT_NAME: kv-obserra-prod-38d660
  OBSERRA_APPLICATIONS_SUPABASE_URL: https://ykmrlcfitsubqajgfnye.supabase.co

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/execute-marketplace-v12-stripe-reconcile-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out exact authoritative main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate governed review-only request and source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          jq -e --arg revision "${EXPECTED_CATALOG_REVISION}" '
            .contract == "obserra-marketplace-v12-stripe-reconcile-request-v1"
            and .catalogRevision == $revision
            and .mode == "review-only"
            and .allowCheckoutActivation == false
            and .allowCharges == false
            and .allowSubscriptions == false
            and .allowEntitlements == false
          ' ops/marketplace-v12-stripe-reconcile-request.json >/dev/null
          node scripts/marketplace-catalog-delivery-gate.mjs

      - name: Install locked review dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Authenticate dedicated Marketplace delivery identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ env.AZURE_DELIVERY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile deterministic live Stripe shard without checkout activation
        shell: bash
        run: |
          set -euo pipefail
          read_secret() {
            local name="$1" value
            value="$(az keyvault secret show --vault-name "${AZURE_KEY_VAULT_NAME}" --name "${name}" --query value -o tsv --only-show-errors)"
            test -n "${value:-}" || { echo "::error::Required Marketplace binding authority is unavailable: ${name}."; exit 1; }
            echo "::add-mask::${value}" >&2
            printf '%s' "${value}"
          }
          service_role_key="$(read_secret applications-supabase-service-role-key)"
          stripe_key="$(read_secret applications-stripe-secret-key)"
          hash_secret="$(read_secret applications-commerce-hash-secret)"
          export OBSERRA_APPLICATIONS_SUPABASE_SERVICE_ROLE_KEY="${service_role_key}"
          export APPLICATIONS_STRIPE_SECRET_KEY="${stripe_key}"
          export OBSERRA_APPLICATIONS_COMMERCE_HASH_SECRET="${hash_secret}"
          export OBSERRA_MARKETPLACE_V12_RECONCILIATION_RUN=review
          output="${RUNNER_TEMP}/marketplace-v12-binding-shard-${{ matrix.shard }}.json"
          node scripts/reconcile-marketplace-v12-stripe-bindings.mjs \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --concurrency 2 >"${output}"
          jq -e '
            .contract == "obserra-marketplace-v12-bulk-binding-reconcile-v1"
            and .failureCount == 0
            and .processedProducts == .assignedProducts
            and .reviewedOfferBindings == .requiredOfferBindings
            and .activationChanged == false
            and .checkoutActivated == false
          ' "${output}" >/dev/null
          unset OBSERRA_APPLICATIONS_SUPABASE_SERVICE_ROLE_KEY APPLICATIONS_STRIPE_SECRET_KEY OBSERRA_APPLICATIONS_COMMERCE_HASH_SECRET service_role_key stripe_key hash_secret

      - name: Retain non-sensitive shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marketplace-v12-binding-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/marketplace-v12-binding-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/execute-marketplace-v12-stripe-reconcile-20260823'
    needs: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    steps:
      - name: Check out exact authoritative main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Install locked review dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Authenticate dedicated Marketplace delivery identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ env.AZURE_DELIVERY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify catalog-wide live Stripe binding evidence
        shell: bash
        run: |
          set -euo pipefail
          read_secret() {
            local name="$1" value
            value="$(az keyvault secret show --vault-name "${AZURE_KEY_VAULT_NAME}" --name "${name}" --query value -o tsv --only-show-errors)"
            test -n "${value:-}" || { echo "::error::Required Marketplace verification authority is unavailable: ${name}."; exit 1; }
            echo "::add-mask::${value}" >&2
            printf '%s' "${value}"
          }
          service_role_key="$(read_secret applications-supabase-service-role-key)"
          stripe_key="$(read_secret applications-stripe-secret-key)"
          export OBSERRA_APPLICATIONS_SUPABASE_SERVICE_ROLE_KEY="${service_role_key}"
          export APPLICATIONS_STRIPE_SECRET_KEY="${stripe_key}"
          export OBSERRA_MARKETPLACE_V12_EVIDENCE_RUN=review
          export OBSERRA_ALLOW_LIVE_STRIPE_OUTSIDE_PRODUCTION=true
          output="${RUNNER_TEMP}/marketplace-v12-stripe-evidence.json"
          node scripts/verify-marketplace-v12-stripe-evidence.mjs >"${output}"
          jq -e '
            .contract == "obserra-marketplace-v12-stripe-evidence-review-v1"
            and .reviewOnly == true
            and .activationChanged == false
            and .verified == true
            and .failureCount == 0
            and .requiredProductCards == 11390
            and .reviewedProductCards == 11390
            and .verifiedOfferBindings == .requiredOfferBindings
            and .stripeAccountChargesEnabled == true
            and .bindingReceipt.contract == "obserra-marketplace-v12-runtime-binding-receipt-v1"
          ' "${output}" >/dev/null
          unset OBSERRA_APPLICATIONS_SUPABASE_SERVICE_ROLE_KEY APPLICATIONS_STRIPE_SECRET_KEY service_role_key stripe_key

      - name: Retain non-sensitive catalog-wide verification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marketplace-v12-stripe-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/marketplace-v12-stripe-evidence.json
          if-no-files-found: ignore
          retention-days: 30
