name: PR172 CMMC Converge Once

on:
  push:
    branches:
      - fix/vercel-exclusive-authority-regression-20260820

permissions:
  contents: write

concurrency:
  group: pr172-cmmc-converge-once
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-exclusive-authority-regression-20260820
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove one-shot workflow and commit clean source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr172-cmmc-converge-once.yml
          git commit -m "ci: remove one-shot CMMC convergence helper"
          git push origin HEAD:fix/vercel-exclusive-authority-regression-20260820

      - name: Generate CMMC evidence from clean source tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          npm run generate:cmmc-system-evidence
          npm run verify:cmmc-system-evidence

      - name: Commit generated evidence only
        run: |
          set -euo pipefail
          git add docs/compliance/CMMC-SYSTEM-EVIDENCE.json docs/compliance/CMMC-SYSTEM-EVIDENCE.md docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          git diff --cached --quiet && { echo "No generated evidence changes required"; exit 0; }
          git commit -m "docs(compliance): converge PR172 CMMC system evidence"
          git push origin HEAD:fix/vercel-exclusive-authority-regression-20260820
