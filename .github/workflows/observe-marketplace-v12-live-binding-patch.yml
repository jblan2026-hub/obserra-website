name: Observe Marketplace v1.2 live binding patch

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/observe-marketplace-v12-live-binding-patch.yml

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Record latest live-binding patch run
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVATION_BRANCH: ops/marketplace-v12-ingest-dispatch-20260823
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, re, urllib.error, urllib.parse, urllib.request
          repo='jblan2026-hub/obserra-website'; workflow='patch-marketplace-v12-live-bindings-once.yml'; token=os.environ['GH_TOKEN']; branch=os.environ['OBSERVATION_BRANCH']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-live-binding-observer','Content-Type':'application/json'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response: return json.load(response)
          runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=10').get('workflow_runs',[])
          if not runs: raise SystemExit('no live-binding patch workflow run found')
          run=runs[0]; run_id=int(run['id'])
          jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100').get('jobs',[])
          failed=[]; job_ids=[]
          for job in jobs:
            job_ids.append(int(job['id']))
            for step in job.get('steps',[]):
              if step.get('conclusion')=='failure': failed.append(step.get('name'))
          blocker=None
          if run.get('conclusion')=='failure':
            for job_id in job_ids:
              try:
                with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/jobs/{job_id}/logs',headers=headers),timeout=60) as response: text=response.read().decode('utf-8',errors='replace')
              except Exception: continue
              patterns=[
                r'HTTP Error (\d+): ([^\n\r]+)',
                r'expected binding line missing: ([^\n\r]+)',
                r'##\[error\]([^\n\r]+)',
              ]
              for pattern in patterns:
                match=re.search(pattern,text)
                if match:
                  blocker=' | '.join(match.groups()) if match.lastindex and match.lastindex>1 else match.group(1).strip()
                  break
              if blocker: break
          receipt={'contract':'obserra-marketplace-v12-live-binding-patch-observation-v1','runId':run_id,'runUrl':run.get('html_url'),'status':run.get('status'),'conclusion':run.get('conclusion'),'headSha':run.get('head_sha'),'failedSteps':failed,'blocker':blocker}
          content=(json.dumps(receipt,indent=2)+'\n').encode(); path='ops/marketplace-v12-live-binding-patch-observation.json'; encoded=urllib.parse.quote(path,safe='/')
          sha=None
          try: sha=get(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}').get('sha')
          except urllib.error.HTTPError as error:
            if error.code!=404: raise
          body={'message':'ops: record Marketplace live-binding patch observation','content':base64.b64encode(content).decode(),'branch':branch}
          if sha: body['sha']=sha
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as response:
            if response.status not in (200,201): raise SystemExit(response.status)
          print(json.dumps(receipt,sort_keys=True))
          PY
