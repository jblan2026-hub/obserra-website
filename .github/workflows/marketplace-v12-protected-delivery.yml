name: Marketplace v1.2 protected delivery
run-name: Marketplace v1.2 protected delivery ${{ inputs.mode }} for ${{ inputs.expected_commit }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify locally or ingest exact artifacts into protected storage
        required: true
        type: choice
        options: [verify, ingest]
        default: verify
      expected_commit:
        description: Exact main commit approved for this run
        required: true
        type: string
      approved_catalog_revision:
        description: Exact approved marketplace catalog revision
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-v12-protected-delivery
  cancel-in-progress: false

jobs:
  protected-delivery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    env:
      EXPECTED_CATALOG_REVISION: 487043cc23975012e83764a9a0f258f9ff705ab656084be558e76fa64f47faf2
      AZURE_TENANT_ID: 7d8b7b64-c80c-4c8a-a514-66f6b1cf8607
      AZURE_SUBSCRIPTION_ID: 38d660ff-611e-4f6c-ad29-70f5cf118f52
      AZURE_DELIVERY_CLIENT_ID: b8da232a-713f-4c25-a61e-4fb34d13e229
      AZURE_KEY_VAULT_NAME: kv-obserra-prod-38d660
      AZURE_SOURCE_STORAGE_ACCOUNT: stobserramktv1238d660
      AZURE_SOURCE_CONTAINER: marketplace-v12-source
      OBSERRA_APPLICATIONS_SUPABASE_URL: https://ykmrlcfitsubqajgfnye.supabase.co
      OBSERRA_MARKETPLACE_V12_PROTECTED_DELIVERY_APPROVED_REVISION: ${{ inputs.approved_catalog_revision }}

    steps:
      - name: Check out the exact approved main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Pin the governed release identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${{ inputs.expected_commit }}" || { echo "::error::Checked-out commit differs from approval."; exit 1; }
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}" || { echo "::error::Repository HEAD differs from approval."; exit 1; }
          test "${{ inputs.approved_catalog_revision }}" = "${EXPECTED_CATALOG_REVISION}" || { echo "::error::Catalog revision differs from the exact approved v1.2 revision."; exit 1; }
          test -n "${AZURE_DELIVERY_CLIENT_ID:-}" || { echo "::error::Dedicated protected-delivery identity is not configured."; exit 1; }
          test -n "${AZURE_TENANT_ID:-}" || { echo "::error::Azure tenant identity is not configured."; exit 1; }
          test -n "${AZURE_SOURCE_STORAGE_ACCOUNT:-}" || { echo "::error::Protected source storage account is not configured."; exit 1; }
          test -n "${AZURE_SOURCE_CONTAINER:-}" || { echo "::error::Protected source container is not configured."; exit 1; }
          node scripts/marketplace-catalog-delivery-gate.mjs

      - name: Authenticate the dedicated protected-delivery identity
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ env.AZURE_DELIVERY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight protected-delivery Key Vault prerequisites
        if: inputs.mode == 'ingest'
        shell: bash
        run: |
          set -euo pipefail
          require_binding_metadata() {
            local secret_name="$1" secret_id
            if ! secret_id="$(az keyvault secret show \
              --vault-name "${AZURE_KEY_VAULT_NAME}" \
              --name "${secret_name}" \
              --query id \
              --output tsv \
              --only-show-errors)"; then
              echo "::error::Required protected-delivery binding metadata is unavailable: ${secret_name}."
              exit 1
            fi
            test -n "${secret_id:-}" || { echo "::error::Required protected-delivery binding metadata is unavailable: ${secret_name}."; exit 1; }
            unset secret_id
          }
          for secret_name in \
            applications-supabase-service-role-key \
            applications-stripe-secret-key \
            applications-stripe-webhook-secret \
            applications-commerce-hash-secret \
            ai-marketplace-release-aws-access-key-id \
            ai-marketplace-release-aws-secret-access-key \
            ai-marketplace-release-bucket \
            ai-marketplace-release-kms-key-id \
            ai-marketplace-release-cdn-url \
            ai-marketplace-cloudfront-key-pair-id \
            ai-marketplace-cloudfront-private-key \
            ai-marketplace-v12-release-evidence-hmac-key; do
            require_binding_metadata "${secret_name}"
          done
          echo "::notice::Verified metadata for all 12 protected-delivery prerequisites."

      - name: Download and verify the exact supplied archive set
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/marketplace-v12-sources"
          mkdir -p "${source_dir}"
          test "$(az account show --query id -o tsv)" = "${AZURE_SUBSCRIPTION_ID}"
          test "$(az account show --query tenantId -o tsv)" = "${AZURE_TENANT_ID}"
          az storage blob download-batch \
            --auth-mode login \
            --account-name "${AZURE_SOURCE_STORAGE_ACCOUNT}" \
            --source "${AZURE_SOURCE_CONTAINER}" \
            --destination "${source_dir}" \
            --pattern "*.zip" \
            --only-show-errors
          az storage blob download \
            --auth-mode login \
            --account-name "${AZURE_SOURCE_STORAGE_ACCOUNT}" \
            --container-name "${AZURE_SOURCE_CONTAINER}" \
            --name "obserra-supplied-archives.json" \
            --file "${source_dir}/obserra-supplied-archives.json" \
            --only-show-errors
          find "${source_dir}" -type f -name '*.zip' -exec chmod 0400 {} +
          chmod 0400 "${source_dir}/obserra-supplied-archives.json"

      - name: Materialize and integrity-check all v1.2 release artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/marketplace-v12-sources"
          artifact_dir="${RUNNER_TEMP}/marketplace-v12-artifacts"
          work_dir="${RUNNER_TEMP}/marketplace-v12-work"
          evidence_dir="${RUNNER_TEMP}/marketplace-v12-evidence"
          mkdir -p "${artifact_dir}" "${work_dir}" "${evidence_dir}"
          node scripts/marketplace-v12-artifact-materialize.mjs \
            --catalog data/marketplace/obserra-marketplace-card-catalog.json.gz \
            --summary data/marketplace/obserra-marketplace-card-catalog.summary.json \
            --archive-manifest "${source_dir}/obserra-supplied-archives.json" \
            --archive-dir "${source_dir}" \
            --output-dir "${artifact_dir}" \
            --work-dir "${work_dir}" \
            --checkpoint "${evidence_dir}/checkpoint.json" \
            --delivery-catalog "${evidence_dir}/delivery-catalog.json" \
            --verified-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            >"${evidence_dir}/materialization-result.json"
          jq -e '.complete == true and .requiredProducts == 11390 and .requiredArchives == 15 and .activationChanged == false' "${evidence_dir}/materialization-result.json" >/dev/null

      - name: Read guarded commerce and delivery bindings from Key Vault
        if: inputs.mode == 'ingest'
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${RUNNER_TEMP}/marketplace-v12-secrets"
          mkdir -p "${secret_dir}"
          chmod 0700 "${secret_dir}"
          read_secret() {
            local secret_name="$1" output_name="$2"
            az keyvault secret show --vault-name "${AZURE_KEY_VAULT_NAME}" --name "${secret_name}" --query value -o tsv >"${secret_dir}/${output_name}"
            test -s "${secret_dir}/${output_name}" || { echo "::error::Required protected-delivery binding is unavailable: ${secret_name}."; exit 1; }
            chmod 0600 "${secret_dir}/${output_name}"
            local protected_value
            protected_value="$(<"${secret_dir}/${output_name}")"
            echo "::add-mask::${protected_value}"
            unset protected_value
          }
          read_secret applications-supabase-service-role-key supabase-service-role-key
          read_secret applications-stripe-secret-key stripe-secret-key
          read_secret applications-stripe-webhook-secret stripe-webhook-secret
          read_secret ai-marketplace-release-aws-access-key-id aws-access-key-id
          read_secret ai-marketplace-release-aws-secret-access-key aws-secret-access-key
          read_secret ai-marketplace-release-bucket release-bucket
          read_secret ai-marketplace-release-kms-key-id release-kms-key-id
          read_secret ai-marketplace-release-cdn-url release-cdn-url
          read_secret ai-marketplace-cloudfront-key-pair-id cloudfront-key-pair-id
          read_secret ai-marketplace-cloudfront-private-key cloudfront-private-key
          read_secret ai-marketplace-v12-release-evidence-hmac-key release-evidence-hmac-key

      - name: Verify live Stripe authority and ingest protected artifacts
        if: inputs.mode == 'ingest'
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${RUNNER_TEMP}/marketplace-v12-secrets"
          evidence_dir="${RUNNER_TEMP}/marketplace-v12-evidence"
          export OBSERRA_APPLICATIONS_SUPABASE_SERVICE_ROLE_KEY="$(<"${secret_dir}/supabase-service-role-key")"
          export APPLICATIONS_STRIPE_SECRET_KEY="$(<"${secret_dir}/stripe-secret-key")"
          export APPLICATIONS_STRIPE_WEBHOOK_SECRET="$(<"${secret_dir}/stripe-webhook-secret")"
          export OBSERRA_AI_MARKETPLACE_V12_EVIDENCE_RUN=review
          export OBSERRA_ALLOW_LIVE_STRIPE_OUTSIDE_PRODUCTION=true
          export AWS_ACCESS_KEY_ID="$(<"${secret_dir}/aws-access-key-id")"
          export AWS_SECRET_ACCESS_KEY="$(<"${secret_dir}/aws-secret-access-key")"
          export AWS_REGION="${{ vars.OBSERRA_MARKETPLACE_RELEASE_AWS_REGION }}"
          test -n "${AWS_REGION:-}" || { echo "::error::Protected release region is not configured."; exit 1; }
          node scripts/verify-marketplace-v12-stripe-evidence.mjs >"${evidence_dir}/stripe-evidence.json"
          jq -e '.verified == true and .failureCount == 0 and .requiredProductCards == 11390 and .verifiedOfferBindings == .requiredOfferBindings and .bindingReceipt.contract == "obserra-marketplace-v12-runtime-binding-receipt-v1" and .bindingReceipt.requiredProducts == 11390 and .bindingReceipt.reviewedProductCards == 11390 and .bindingReceipt.liveReviewedOfferBindings == .bindingReceipt.requiredOfferBindings and .stripeAccountChargesEnabled == true and (.stripeAccountId | test("^acct_[A-Za-z0-9]+$"))' "${evidence_dir}/stripe-evidence.json" >/dev/null
          jq -c '.bindingReceipt' "${evidence_dir}/stripe-evidence.json" >"${evidence_dir}/runtime-binding-receipt.json"
          chmod 0600 "${evidence_dir}/runtime-binding-receipt.json"
          node scripts/verify-marketplace-v12-ledger-evidence.mjs >"${evidence_dir}/ledger-evidence.json"
          jq -e '.durableLedgerVerified == true and .entitlementAuthority == "ai-marketplace-commerce-ledger-v1"' "${evidence_dir}/ledger-evidence.json" >/dev/null
          node scripts/marketplace-v12-artifact-ingest.mjs \
            --catalog data/marketplace/obserra-marketplace-card-catalog.json.gz \
            --summary data/marketplace/obserra-marketplace-card-catalog.summary.json \
            --archive-manifest "${RUNNER_TEMP}/marketplace-v12-sources/obserra-supplied-archives.json" \
            --artifact-dir "${RUNNER_TEMP}/marketplace-v12-artifacts" \
            --delivery-catalog "${evidence_dir}/delivery-catalog.json" \
            --stripe-evidence "${evidence_dir}/stripe-evidence.json" \
            --bucket "$(<"${secret_dir}/release-bucket")" \
            --kms-key-id "$(<"${secret_dir}/release-kms-key-id")" \
            --region "${AWS_REGION}" \
            --activate >"${evidence_dir}/ingest-result.json"
          jq -e '.protectedArtifactSetComplete == true and .requiredProducts == 11390' "${evidence_dir}/ingest-result.json" >/dev/null
          node scripts/marketplace-v12-runtime-evidence.mjs \
            --binding-receipt "${evidence_dir}/runtime-binding-receipt.json" \
            --delivery-catalog "${evidence_dir}/delivery-catalog.json" \
            --stripe-evidence "${evidence_dir}/stripe-evidence.json" \
            --ingest-evidence "${evidence_dir}/ingest-result.json" \
            --ledger-evidence "${evidence_dir}/ledger-evidence.json" \
            --cdn-url-file "${secret_dir}/release-cdn-url" \
            --cloudfront-key-pair-id-file "${secret_dir}/cloudfront-key-pair-id" \
            --cloudfront-private-key-file "${secret_dir}/cloudfront-private-key" \
            --hmac-key-file "${secret_dir}/release-evidence-hmac-key" \
            --receipt-output "${evidence_dir}/runtime-delivery-receipt.json" \
            --evidence-output "${evidence_dir}/runtime-release-evidence.json" \
            --signature-output "${evidence_dir}/runtime-release-evidence-signature" \
            >"${evidence_dir}/runtime-evidence-build.json"
          jq -e '.complete == true and .activationChanged == false and .requiredProducts == 11390 and .durableLedgerVerified == true and .protectedDeliveryVerified == true' "${evidence_dir}/runtime-evidence-build.json" >/dev/null
          unset OBSERRA_APPLICATIONS_SUPABASE_SERVICE_ROLE_KEY APPLICATIONS_STRIPE_SECRET_KEY APPLICATIONS_STRIPE_WEBHOOK_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

      - name: Publish exact runtime activation evidence to Key Vault
        if: inputs.mode == 'ingest'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/marketplace-v12-evidence"
          set_secret_file() {
            local secret_name="$1" source_file="$2"
            test -s "${source_file}" || { echo "::error::Runtime evidence file is unavailable for ${secret_name}."; exit 1; }
            az keyvault secret set \
              --vault-name "${AZURE_KEY_VAULT_NAME}" \
              --name "${secret_name}" \
              --file "${source_file}" \
              --output none
          }
          set_secret_value() {
            local secret_name="$1" value="$2"
            az keyvault secret set \
              --vault-name "${AZURE_KEY_VAULT_NAME}" \
              --name "${secret_name}" \
              --value "${value}" \
              --output none
          }
          set_secret_file ai-marketplace-v12-binding-receipt-json "${evidence_dir}/runtime-binding-receipt.json"
          set_secret_file ai-marketplace-v12-delivery-catalog-json "${evidence_dir}/runtime-delivery-receipt.json"
          set_secret_file ai-marketplace-v12-release-evidence-json "${evidence_dir}/runtime-release-evidence.json"
          set_secret_file ai-marketplace-v12-release-evidence-signature "${evidence_dir}/runtime-release-evidence-signature"
          # Approval is written last. Any interrupted earlier write therefore
          # remains digest-mismatched and runtime checkout stays fail-closed.
          set_secret_value ai-marketplace-v12-activation-approved-revision "${EXPECTED_CATALOG_REVISION}"

      - name: Read back exact marketplace v1.2 runtime binding metadata
        if: inputs.mode == 'ingest'
        shell: bash
        run: |
          set -euo pipefail
          require_binding_metadata() {
            local secret_name="$1" secret_id
            secret_id="$(az keyvault secret show \
              --vault-name "${AZURE_KEY_VAULT_NAME}" \
              --name "${secret_name}" \
              --query id \
              --output tsv \
              --only-show-errors)"
            test -n "${secret_id:-}" || { echo "::error::Published marketplace runtime binding metadata is unavailable: ${secret_name}."; exit 1; }
            unset secret_id
          }
          for secret_name in \
            applications-supabase-service-role-key \
            applications-stripe-secret-key \
            applications-stripe-webhook-secret \
            applications-commerce-hash-secret \
            ai-marketplace-v12-binding-receipt-json \
            ai-marketplace-v12-delivery-catalog-json \
            ai-marketplace-v12-release-evidence-json \
            ai-marketplace-v12-release-evidence-signature \
            ai-marketplace-v12-release-evidence-hmac-key \
            ai-marketplace-v12-activation-approved-revision \
            ai-marketplace-release-cdn-url \
            ai-marketplace-cloudfront-key-pair-id \
            ai-marketplace-cloudfront-private-key; do
            require_binding_metadata "${secret_name}"
          done
          echo "::notice::Verified metadata for all 13 exact Marketplace v1.2 runtime bindings."

      - name: Retain non-sensitive release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: marketplace-v12-protected-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/marketplace-v12-evidence/materialization-result.json
            ${{ runner.temp }}/marketplace-v12-evidence/stripe-evidence.json
            ${{ runner.temp }}/marketplace-v12-evidence/ledger-evidence.json
            ${{ runner.temp }}/marketplace-v12-evidence/ingest-result.json
            ${{ runner.temp }}/marketplace-v12-evidence/runtime-binding-receipt.json
            ${{ runner.temp }}/marketplace-v12-evidence/runtime-delivery-receipt.json
            ${{ runner.temp }}/marketplace-v12-evidence/runtime-release-evidence.json
            ${{ runner.temp }}/marketplace-v12-evidence/runtime-evidence-build.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove downloaded and materialized product bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            "${RUNNER_TEMP}/marketplace-v12-sources" \
            "${RUNNER_TEMP}/marketplace-v12-artifacts" \
            "${RUNNER_TEMP}/marketplace-v12-work" \
            "${RUNNER_TEMP}/marketplace-v12-secrets"; do
            if [ -n "${target}" ] && [[ "${target}" == "${RUNNER_TEMP}/marketplace-v12-"* ]]; then
              rm -rf -- "${target}"
            fi
          done
