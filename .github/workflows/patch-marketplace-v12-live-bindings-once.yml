name: Patch Marketplace v1.2 live Azure bindings once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-marketplace-v12-live-bindings-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Replace stale variable references with verified non-secret Azure authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request

          repo = 'jblan2026-hub/obserra-website'
          path = '.github/workflows/marketplace-v12-protected-delivery.yml'
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'obserra-marketplace-v12-live-binding-patch',
              'Content-Type': 'application/json',
          }
          url = f'https://api.github.com/repos/{repo}/contents/{path}?ref=main'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              current = json.load(response)
          content = base64.b64decode(current['content']).decode('utf-8')
          replacements = {
              'AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}': 'AZURE_TENANT_ID: 7d8b7b64-c80c-4c8a-a514-66f6b1cf8607',
              'AZURE_DELIVERY_CLIENT_ID: ${{ vars.OBSERRA_MARKETPLACE_DELIVERY_CLIENT_ID }}': 'AZURE_DELIVERY_CLIENT_ID: b8da232a-713f-4c25-a61e-4fb34d13e229',
              'AZURE_SOURCE_STORAGE_ACCOUNT: ${{ vars.OBSERRA_MARKETPLACE_SOURCE_STORAGE_ACCOUNT }}': 'AZURE_SOURCE_STORAGE_ACCOUNT: stobserramktv1238d660',
              'AZURE_SOURCE_CONTAINER: ${{ vars.OBSERRA_MARKETPLACE_SOURCE_CONTAINER }}': 'AZURE_SOURCE_CONTAINER: marketplace-v12-source',
          }
          changed = content
          for old, new in replacements.items():
              if old not in changed and new not in changed:
                  raise SystemExit(f'expected binding line missing: {old}')
              changed = changed.replace(old, new)
          if changed == content:
              print('No changes required; live Azure bindings already pinned.')
              raise SystemExit(0)
          body = {
              'message': 'fix: bind Marketplace protected delivery to verified Azure authority',
              'content': base64.b64encode(changed.encode()).decode(),
              'sha': current['sha'],
              'branch': 'main',
          }
          put = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=json.dumps(body).encode(),
              method='PUT',
              headers=headers,
          )
          with urllib.request.urlopen(put, timeout=30) as response:
              result = json.load(response)
          print(json.dumps({'commit': result['commit']['sha'], 'path': path}))
          PY

