name: Enable Vercel Key Vault runtime identity
run-name: Enable canonical Vercel Key Vault identity for ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-vercel-key-vault-runtime.yml"
      - "lib/production-runtime-secrets.ts"
      - "lib/applications-commerce.ts"
      - "lib/academy-persistence.ts"
      - "app/api/apps/**"
      - "app/api/academy/**"
      - "app/api/webhook/**"
      - "app/apps/**"
      - "app/portal/orders/page.tsx"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: vercel-key-vault-runtime-bootstrap
  cancel-in-progress: false

jobs:
  enable-runtime-identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Client and tenant IDs are public identity metadata, not credentials.
      # Keep repository overrides, but fall back to the exact governed identity
      # already pinned by the Azure production bootstrap and architecture record.
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || 'dc3ff3e1-ea35-4879-afa9-fa3eee49df85' }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || '7d8b7b64-c80c-4c8a-a514-66f6b1cf8607' }}
      AZURE_SUBSCRIPTION_ID: 38d660ff-611e-4f6c-ad29-70f5cf118f52
      AZURE_RESOURCE_GROUP: rg-obserra-prod-eastus
      AZURE_RUNTIME_IDENTITY: id-obserra-runtime-prod
      KEY_VAULT_NAME: kv-obserra-prod-38d660
      KEY_VAULT_SECRETS_USER_ROLE_ID: 4633458b-17de-408a-b874-0445c86b69e6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      VERCEL_TEAM_SLUG: obserra
      VERCEL_PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
      VERCEL_PROJECT_NAME: obserra-website-live
      VERCEL_GIT_ORG: jblan2026-hub
      VERCEL_GIT_REPO: obserra-website
      VERCEL_CANONICAL_ORIGIN: https://www.obserrallc.com
      AZURE_TOKEN_AUDIENCE: api://AzureADTokenExchange
      FEDERATED_CREDENTIAL_NAME: vercel-obserra-website-live-production
      # Canonical public runtime metadata. These values are identifiers/URLs, not credentials.
      OBSERRA_APPLICATIONS_SUPABASE_URL: https://ykmrlcfitsubqajgfnye.supabase.co
      OBSERRA_ACADEMY_SUPABASE_URL: https://nwxnyqlyzyufgoadtqxs.supabase.co
      OBSERRA_ACADEMY_SUPABASE_PROJECT_REF: nwxnyqlyzyufgoadtqxs
      OBSERRA_IDENTITY_RUNTIME_ENABLED: "true"

    steps:
      - name: Authenticate the governed deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Bind the canonical Vercel production workload to the runtime identity
        shell: bash
        run: |
          set -euo pipefail

          test -n "${VERCEL_TOKEN:-}" || { echo "::error::No Vercel API credential is configured."; exit 1; }
          test -n "${AZURE_DEPLOY_CLIENT_ID:-}" || { echo "::error::The governed Azure deployment identity is not configured."; exit 1; }
          test -n "${AZURE_TENANT_ID:-}" || { echo "::error::The governed Azure tenant is not configured."; exit 1; }
          test "$(az account show --query id -o tsv)" = "${AZURE_SUBSCRIPTION_ID}"
          test "$(az account show --query tenantId -o tsv)" = "${AZURE_TENANT_ID}"

          runtime_identity="$(az identity show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_RUNTIME_IDENTITY}" --output json)"
          runtime_client_id="$(jq -er '.clientId | strings' <<<"${runtime_identity}")"
          runtime_principal_id="$(jq -er '.principalId | strings' <<<"${runtime_identity}")"

          key_vault="$(az keyvault show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${KEY_VAULT_NAME}" --output json)"
          key_vault_id="$(jq -er '.id | strings' <<<"${key_vault}")"
          jq -e '
            .properties.enableRbacAuthorization == true and
            .properties.publicNetworkAccess == "Enabled" and
            .properties.networkAcls.defaultAction == "Allow"
          ' <<<"${key_vault}" >/dev/null || {
            echo "::error::The canonical Key Vault is not configured for reachable RBAC secret access."
            exit 1
          }

          role_assignments="$(az role assignment list --assignee-object-id "${runtime_principal_id}" --scope "${key_vault_id}" --output json)"
          normalized_key_vault_id="$(tr '[:upper:]' '[:lower:]' <<<"${key_vault_id}")"
          jq -e --arg scope "${normalized_key_vault_id}" --arg role "${KEY_VAULT_SECRETS_USER_ROLE_ID}" '
            any(.[];
              ((.scope // "") | ascii_downcase) == $scope and
              (((.roleDefinitionId // "") | ascii_downcase) | endswith($role))
            )
          ' <<<"${role_assignments}" >/dev/null || {
            echo "::error::The existing runtime identity lacks the exact Key Vault Secrets User role at the canonical vault."
            exit 1
          }

          # The deployment identity intentionally has no Key Vault data-plane role.
          # Runtime commerce probes below prove that only the production workload
          # identity can read the required bindings without exposing their values.
          unset role_assignments

          project_before="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}")"
          jq -e \
            --arg id "${VERCEL_PROJECT_ID}" \
            --arg name "${VERCEL_PROJECT_NAME}" \
            --arg org "${VERCEL_GIT_ORG}" \
            --arg repo "${VERCEL_GIT_REPO}" '
              .id == $id and .name == $name and
              .link.type == "github" and .link.org == $org and .link.repo == $repo and
              .link.productionBranch == "main"
            ' <<<"${project_before}" >/dev/null || {
            echo "::error::The configured Vercel project is not the canonical production project."
            exit 1
          }

          oidc_config="$(jq -cn '{oidcTokenConfig:{enabled:true,issuerMode:"team"}}')"
          project_after="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --request PATCH --header "Authorization: Bearer ${VERCEL_TOKEN}" --header "Content-Type: application/json" \
            --data "${oidc_config}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}")"
          jq -e '.oidcTokenConfig.enabled == true and .oidcTokenConfig.issuerMode == "team"' <<<"${project_after}" >/dev/null || {
            echo "::error::The Vercel project did not accept the required team-scoped OIDC configuration."
            exit 1
          }
          project_verified="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}")"
          jq -e \
            --arg id "${VERCEL_PROJECT_ID}" \
            --arg name "${VERCEL_PROJECT_NAME}" \
            --arg org "${VERCEL_GIT_ORG}" \
            --arg repo "${VERCEL_GIT_REPO}" '
            .id == $id and .name == $name and
            .link.type == "github" and .link.org == $org and .link.repo == $repo and
            .link.productionBranch == "main" and
            .oidcTokenConfig.enabled == true and .oidcTokenConfig.issuerMode == "team"
          ' <<<"${project_verified}" >/dev/null || {
            echo "::error::The Vercel project OIDC configuration could not be read back exactly."
            exit 1
          }
          unset project_before project_after project_verified oidc_config

          # Project tokens are development-context tokens, not production runtime proof.
          issuer="https://oidc.vercel.com/${VERCEL_TEAM_SLUG}"
          subject="owner:${VERCEL_TEAM_SLUG}:project:${VERCEL_PROJECT_NAME}:environment:production"
          audience="${AZURE_TOKEN_AUDIENCE}"
          existing_credentials="$(az identity federated-credential list --resource-group "${AZURE_RESOURCE_GROUP}" --identity-name "${AZURE_RUNTIME_IDENTITY}" --output json)"
          if jq -e --arg name "${FEDERATED_CREDENTIAL_NAME}" 'any(.[]; .name == $name)' <<<"${existing_credentials}" >/dev/null; then
            if ! jq -e --arg name "${FEDERATED_CREDENTIAL_NAME}" --arg issuer "${issuer}" --arg subject "${subject}" --arg audience "${audience}" '
              [.[] | select(.name == $name)] as $credentials |
              ($credentials | length == 1) and
              $credentials[0].issuer == $issuer and
              $credentials[0].subject == $subject and
              ($credentials[0].audiences | length == 1) and
              $credentials[0].audiences[0] == $audience
            ' <<<"${existing_credentials}" >/dev/null; then
              az identity federated-credential update \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --identity-name "${AZURE_RUNTIME_IDENTITY}" \
                --name "${FEDERATED_CREDENTIAL_NAME}" \
                --issuer "${issuer}" \
                --subject "${subject}" \
                --audiences "${audience}" \
                --output none
            fi
          else
            az identity federated-credential create \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --identity-name "${AZURE_RUNTIME_IDENTITY}" \
              --name "${FEDERATED_CREDENTIAL_NAME}" \
              --issuer "${issuer}" \
              --subject "${subject}" \
              --audiences "${audience}" \
              --output none
          fi
          federated_credential="$(az identity federated-credential show --resource-group "${AZURE_RESOURCE_GROUP}" --identity-name "${AZURE_RUNTIME_IDENTITY}" --name "${FEDERATED_CREDENTIAL_NAME}" --output json)"
          jq -e --arg name "${FEDERATED_CREDENTIAL_NAME}" --arg issuer "${issuer}" --arg subject "${subject}" --arg audience "${audience}" '
            .name == $name and .issuer == $issuer and .subject == $subject and
            (.audiences | length == 1) and .audiences[0] == $audience
          ' <<<"${federated_credential}" >/dev/null || {
            echo "::error::The Vercel workload binding could not be read back exactly."
            exit 1
          }
          unset existing_credentials federated_credential issuer subject audience

          # This API response is deliberately non-decrypted: it exposes metadata only.
          project_environment_before="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=false&teamId=${VERCEL_TEAM_ID}")"
          jq -e '
            . as $project_environment |
            def production_target:
              (.target == "production") or
              (((.target // []) | if type == "array" then index("production") != null else false end));
            all(["CLERK_SECRET_KEY", "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"][]; . as $key |
              any($project_environment.envs[]?; .key == $key and production_target)
            )
          ' <<<"${project_environment_before}" >/dev/null || {
            echo "::error::Canonical Vercel production Clerk identity bindings are absent; runtime secret bootstrap cannot safely initialize proxy authentication."
            exit 1
          }
          unset project_environment_before

          vercel_environment_payload="$(jq -cn \
            --arg tenant_id "${AZURE_TENANT_ID}" \
            --arg client_id "${runtime_client_id}" \
            --arg applications_supabase_url "${OBSERRA_APPLICATIONS_SUPABASE_URL}" \
            --arg academy_supabase_url "${OBSERRA_ACADEMY_SUPABASE_URL}" \
            --arg academy_supabase_project_ref "${OBSERRA_ACADEMY_SUPABASE_PROJECT_REF}" \
            --arg identity_runtime_enabled "${OBSERRA_IDENTITY_RUNTIME_ENABLED}" '
            [
              {
                key: "OBSERRA_KEY_VAULT_TENANT_ID",
                value: $tenant_id,
                type: "sensitive",
                target: ["production"],
                comment: "Azure tenant identifier for the canonical Vercel runtime workload identity"
              },
              {
                key: "OBSERRA_KEY_VAULT_CLIENT_ID",
                value: $client_id,
                type: "sensitive",
                target: ["production"],
                comment: "Existing Azure runtime managed identity for canonical Vercel Key Vault access"
              },
              {
                key: "OBSERRA_APPLICATIONS_SUPABASE_URL",
                value: $applications_supabase_url,
                type: "plain",
                target: ["production"],
                comment: "Canonical Applications durable-commerce authority URL"
              },
              {
                key: "OBSERRA_ACADEMY_SUPABASE_URL",
                value: $academy_supabase_url,
                type: "plain",
                target: ["production"],
                comment: "Canonical Academy durable-commerce authority URL"
              },
              {
                key: "OBSERRA_ACADEMY_SUPABASE_PROJECT_REF",
                value: $academy_supabase_project_ref,
                type: "plain",
                target: ["production"],
                comment: "Canonical Academy durable-commerce authority project"
              },
              {
                key: "OBSERRA_IDENTITY_RUNTIME_ENABLED",
                value: $identity_runtime_enabled,
                type: "plain",
                target: ["production"],
                comment: "Explicit canonical production identity activation"
              }
            ]
          ')"
          curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --request POST --header "Authorization: Bearer ${VERCEL_TOKEN}" --header "Content-Type: application/json" \
            --data "${vercel_environment_payload}" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" --output /dev/null
          unset vercel_environment_payload

          project_environment_verified="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=false&teamId=${VERCEL_TEAM_ID}")"
          jq -e \
            --arg applications_supabase_url "${OBSERRA_APPLICATIONS_SUPABASE_URL}" \
            --arg academy_supabase_url "${OBSERRA_ACADEMY_SUPABASE_URL}" \
            --arg academy_supabase_project_ref "${OBSERRA_ACADEMY_SUPABASE_PROJECT_REF}" \
            --arg identity_runtime_enabled "${OBSERRA_IDENTITY_RUNTIME_ENABLED}" '
            . as $project_environment |
            def production_target:
              (.target == "production") or
              (((.target // []) | if type == "array" then index("production") != null else false end));
            (
              all(["OBSERRA_KEY_VAULT_TENANT_ID", "OBSERRA_KEY_VAULT_CLIENT_ID"][]; . as $key |
                any($project_environment.envs[]?; .key == $key and production_target and .type == "sensitive")
              )
            ) and (
              all([
                {key: "OBSERRA_APPLICATIONS_SUPABASE_URL", value: $applications_supabase_url},
                {key: "OBSERRA_ACADEMY_SUPABASE_URL", value: $academy_supabase_url},
                {key: "OBSERRA_ACADEMY_SUPABASE_PROJECT_REF", value: $academy_supabase_project_ref},
                {key: "OBSERRA_IDENTITY_RUNTIME_ENABLED", value: $identity_runtime_enabled}
              ][]; . as $binding |
                any($project_environment.envs[]?;
                  .key == $binding.key and .value == $binding.value and
                  production_target and .type == "plain"
                )
              )
            )
          ' <<<"${project_environment_verified}" >/dev/null || {
            echo "::error::The exact Vercel production runtime bindings were not persisted."
            exit 1
          }
          unset project_environment_verified runtime_client_id runtime_principal_id runtime_identity key_vault normalized_key_vault_id key_vault_id
          echo "::notice::Canonical Vercel production runtime identity is bound to the existing Key Vault reader."

      - name: Build and prove one exact current-environment production deployment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deployment_matches_exact_source() {
            local deployment_file="$1"
            local expected_id="$2"
            jq -e \
              --arg deployment "${expected_id}" \
              --arg project "${VERCEL_PROJECT_ID}" \
              --arg name "${VERCEL_PROJECT_NAME}" \
              --arg org "${VERCEL_GIT_ORG}" \
              --arg repo "${VERCEL_GIT_REPO}" \
              --arg ref "${GITHUB_REF_NAME}" \
              --arg sha "${GITHUB_SHA}" '
                .id == $deployment and
                .projectId == $project and
                .name == $name and
                (.target // "") == "production" and
                ((.readyState // .state // "") == "READY") and
                (.gitSource.type == "github") and
                (.gitSource.org == $org) and
                (.gitSource.repo == $repo) and
                (.gitSource.ref == $ref) and
                (.gitSource.sha == $sha)
              ' "${deployment_file}" >/dev/null
          }

          health_is_operational() {
            local origin="$1"
            local path="$2"
            local contract="$3"
            local body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 --output "${body}" --write-out '%{http_code}' "${origin}${path}")" || {
              rm -f "${body}"
              return 1
            }
            local valid=false
            if [ "${status}" = "200" ] && jq -e --arg contract "${contract}" '.contract == $contract and .operational == true' "${body}" >/dev/null; then
              valid=true
            fi
            rm -f "${body}"
            [ "${valid}" = true ]
          }

          canonical_release_proven() {
            local replacement_id="$1"
            local body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 --output "${body}" --write-out '%{http_code}' "${VERCEL_CANONICAL_ORIGIN}/api/health")" || {
              rm -f "${body}"
              return 1
            }
            local valid=false
            if [ "${status}" = "200" ] && jq -e --arg project "${VERCEL_PROJECT_ID}" --arg deployment "${replacement_id}" --arg sha "${GITHUB_SHA}" '
              .contract == "website-liveness-v1" and .status == "live" and
              .routing.verified == true and .routing.observedProjectId == $project and
              .routing.deploymentId == $deployment and .routing.gitCommitSha == $sha
            ' "${body}" >/dev/null; then
              valid=true
            fi
            rm -f "${body}"
            [ "${valid}" = true ]
          }

          deployment_payload="$(jq -cn \
            --arg name "${VERCEL_PROJECT_NAME}" \
            --arg project "${VERCEL_PROJECT_ID}" \
            --arg org "${VERCEL_GIT_ORG}" \
            --arg repo "${VERCEL_GIT_REPO}" \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg sha "${GITHUB_SHA}" '
              {
                name: $name,
                project: $project,
                target: "production",
                gitSource: { type: "github", org: $org, repo: $repo, ref: $ref, sha: $sha },
                meta: { action: "key-vault-runtime-bootstrap" }
              }
            ')"
          deployment_response="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --request POST --header "Authorization: Bearer ${VERCEL_TOKEN}" --header "Content-Type: application/json" \
            --data "${deployment_payload}" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}")"
          replacement_id="$(jq -er '.id // .uid | strings' <<<"${deployment_response}")"
          unset deployment_payload deployment_response

          replacement_file="$(mktemp)"
          replacement_ready=false
          for attempt in $(seq 1 48); do
            curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${replacement_id}?teamId=${VERCEL_TEAM_ID}" > "${replacement_file}"
            state="$(jq -r '.readyState // .state // empty' "${replacement_file}")"
            case "${state}" in
              READY)
                if deployment_matches_exact_source "${replacement_file}" "${replacement_id}"; then
                  replacement_ready=true
                  break
                fi
                echo "::error::The new deployment reached READY without exact canonical project and Git-source provenance."
                rm -f "${replacement_file}"
                exit 1
                ;;
              ERROR|CANCELED)
                echo "::error::The exact runtime-identity deployment did not become READY."
                rm -f "${replacement_file}"
                exit 1
                ;;
            esac
            sleep 10
          done
          [ "${replacement_ready}" = true ] || {
            echo "::error::The exact runtime-identity deployment timed out before READY."
            rm -f "${replacement_file}"
            exit 1
          }

          deployment_url="$(jq -er '.url | strings' "${replacement_file}")"
          rm -f "${replacement_file}"
          case "${deployment_url}" in
            *.vercel.app) ;;
            *) echo "::error::The exact runtime-identity deployment did not expose a Vercel deployment URL."; exit 1 ;;
          esac
          exact_deployment_origin="https://${deployment_url}"

          direct_health_ready=false
          for attempt in $(seq 1 30); do
            if health_is_operational "${exact_deployment_origin}" "/api/apps/commerce-health" "applications-commerce-health-v1" && \
              health_is_operational "${exact_deployment_origin}" "/api/academy/commerce-health" "academy-commerce-health-v1"; then
              direct_health_ready=true
              break
            fi
            sleep 10
          done
          [ "${direct_health_ready}" = true ] || {
            echo "::error::The exact READY deployment did not make both commerce health contracts operational."
            exit 1
          }

          # Only the existing guarded controller may mutate canonical aliases. Pin
          # the dispatch to the exact deployment that passed both direct probes;
          # its workflow owns rollback and independently verifies alias convergence.
          cutover_payload="$(jq -cn --arg deployment "${replacement_id}" '
            {ref: "main", inputs: {expected_deployment_id: $deployment}}
          ')"
          cutover_response="$(mktemp)"
          cutover_status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "${cutover_payload}" \
            --output "${cutover_response}" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-vercel-public-cutover.yml/dispatches")" || {
              rm -f "${cutover_response}"
              echo "::error::The guarded canonical cutover dispatch failed before acceptance."
              exit 1
            }
          unset cutover_payload
          if [ "${cutover_status}" != "204" ]; then
            rm -f "${cutover_response}"
            echo "::error::The guarded canonical cutover dispatch was not accepted (HTTP ${cutover_status})."
            exit 1
          fi
          rm -f "${cutover_response}"
          echo "::notice::Guarded canonical cutover accepted for exact deployment ${replacement_id}."

          canonical_ready=false
          for attempt in $(seq 1 90); do
            if canonical_release_proven "${replacement_id}" && \
              health_is_operational "${VERCEL_CANONICAL_ORIGIN}" "/api/apps/commerce-health" "applications-commerce-health-v1" && \
              health_is_operational "${VERCEL_CANONICAL_ORIGIN}" "/api/academy/commerce-health" "academy-commerce-health-v1"; then
              canonical_ready=true
              break
            fi
            sleep 10
          done
          [ "${canonical_ready}" = true ] || {
            echo "::error::The canonical public endpoint did not prove the exact deployment and both operational commerce contracts."
            exit 1
          }
          echo "::notice::Canonical public endpoint proves the exact deployment and both commerce health contracts."

