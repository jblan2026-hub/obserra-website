name: Dispatch Marketplace v1.2 Stripe migration

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/dispatch-marketplace-v12-stripe-migration.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Dispatch hardened production migration and observe result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, datetime as dt, json, os, re, time, urllib.error, urllib.parse, urllib.request
          repo='jblan2026-hub/obserra-website'; workflow='migrate-marketplace-v12-stripe-authority.yml'; token=os.environ['GH_TOKEN']; branch='ops/marketplace-v12-ingest-dispatch-20260823'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-stripe-dispatcher','Content-Type':'application/json'}
          def request(url,method='GET',body=None,timeout=30):
            data=None if body is None else json.dumps(body).encode()
            return urllib.request.urlopen(urllib.request.Request(url,data=data,method=method,headers=headers),timeout=timeout)
          started=dt.datetime.now(dt.timezone.utc)
          with request(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches','POST',{'ref':'main'}) as r:
            if r.status!=204: raise SystemExit(r.status)
          run=None
          for _ in range(36):
            time.sleep(5)
            with request(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?event=workflow_dispatch&branch=main&per_page=20') as r: runs=json.load(r).get('workflow_runs',[])
            candidates=[]
            for item in runs:
              created=item.get('created_at')
              try: created_at=dt.datetime.fromisoformat(created.replace('Z','+00:00')) if created else started
              except Exception: created_at=started
              if created_at>=started-dt.timedelta(seconds=10): candidates.append(item)
            if candidates:
              run=sorted(candidates,key=lambda x:x.get('id',0),reverse=True)[0]; break
          if run is None: raise SystemExit('migration run not discoverable')
          run_id=int(run['id'])
          for _ in range(90):
            with request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}') as r: run=json.load(r)
            if run.get('status')=='completed': break
            time.sleep(5)
          with request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100') as r: jobs=json.load(r).get('jobs',[])
          failure_step=None; blocker=None
          safe_codes=['legacy_supabase_authority_unavailable','legacy_live_stripe_authority_unavailable','commerce_hash_authority_invalid','key_vault_migration_failed','azure_federation_rejected','Stripe account charges are not enabled','Canonical production migration endpoint did not become ready','Migrated Key Vault metadata unavailable']
          for job in jobs:
            for step in job.get('steps',[]):
              if step.get('conclusion')=='failure' and failure_step is None: failure_step=step.get('name')
            if run.get('conclusion')=='failure':
              try:
                with request(f'https://api.github.com/repos/{repo}/actions/jobs/{int(job["id"])}/logs',timeout=60) as r: text=r.read().decode('utf-8',errors='replace')
              except Exception: text=''
              for marker in safe_codes:
                if marker in text: blocker=marker; break
            if blocker: break
          receipt={'contract':'obserra-marketplace-v12-stripe-migration-dispatch-v1','runId':run_id,'runUrl':run.get('html_url'),'status':run.get('status'),'conclusion':run.get('conclusion'),'headSha':run.get('head_sha'),'failureStep':failure_step,'blocker':blocker,'observedAt':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z')}
          content=(json.dumps(receipt,indent=2)+'\n').encode(); path='ops/marketplace-v12-stripe-migration-latest.json'; encoded=urllib.parse.quote(path,safe='/'); sha=None
          try:
            with request(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}') as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          body={'message':'ops: record hardened Stripe migration result','content':base64.b64encode(content).decode(),'branch':branch}
          if sha: body['sha']=sha
          with request(f'https://api.github.com/repos/{repo}/contents/{encoded}','PUT',body) as r:
            if r.status not in (200,201): raise SystemExit(r.status)
          print(json.dumps(receipt,sort_keys=True))
          PY
