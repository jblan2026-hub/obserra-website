name: Branch remediation CMMC 172

on:
  push:
    branches:
      - fix/vercel-exclusive-authority-regression-20260820
    paths:
      - .github/workflows/branch-remediation-cmmc-172.yml

permissions:
  contents: write

jobs:
  regenerate-controlled-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/vercel-exclusive-authority-regression-20260820
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Remove one-shot workflow from final source tree
        run: git rm .github/workflows/branch-remediation-cmmc-172.yml

      - name: Regenerate controlled evidence from final intended tree
        run: |
          npm run generate:legal-identity-audit
          npm run generate:cmmc-system-evidence

      - name: Verify generated evidence before commit
        run: |
          npm run verify:legal-identity-audit
          npm run verify:cmmc-system-evidence

      - name: Commit exact generated evidence and self-removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/compliance/LEGAL-IDENTITY-AUDIT.json \
            docs/compliance/LEGAL-IDENTITY-AUDIT.md \
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256 \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            .github/workflows/branch-remediation-cmmc-172.yml
          if git diff --cached --quiet; then
            echo "::error::Controlled evidence generator produced no remediation changes."
            exit 1
          fi
          git commit -m "docs(compliance): regenerate Vercel authority evidence"
          git push origin HEAD:fix/vercel-exclusive-authority-regression-20260820
