name: Production Recovery CMMC Evidence Bootstrap

on:
  push:
    branches:
      - docs/production-recovery-audit-2026-08-14
    paths:
      - "docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.json"
      - "scripts/cmmc-level2-rev3-production-evidence.mjs"
      - ".github/workflows/cmmc-recovery-evidence-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: docs/production-recovery-audit-2026-08-14

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate production recovery audit evidence
        run: node scripts/cmmc-level2-rev3-production-evidence.mjs --write

      - name: Verify generated production recovery evidence
        run: node scripts/cmmc-level2-rev3-production-evidence.mjs --check

      - name: Commit generated artifacts
        run: |
          status="$(git status --porcelain -- docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.md docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.sha256)"
          if [ -z "$status" ]; then
            echo "Generated production evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.md docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.sha256
          git commit -m "compliance: regenerate production recovery evidence artifacts"
          git push origin HEAD:docs/production-recovery-audit-2026-08-14
