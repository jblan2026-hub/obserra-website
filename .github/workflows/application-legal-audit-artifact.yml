name: Legal Identity Audit Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate legal identity audit
        run: node scripts/legal-identity-audit.mjs --write
      - name: Upload generated audit files
        uses: actions/upload-artifact@v4
        with:
          name: legal-identity-audit-remediation
          if-no-files-found: error
          path: |
            docs/compliance/LEGAL-IDENTITY-AUDIT.json
            docs/compliance/LEGAL-IDENTITY-AUDIT.md
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
