name: Discover Marketplace Azure RBAC on main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-marketplace-azure-rbac-on-main.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: marketplace-azure-rbac-discovery
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: dc3ff3e1-ea35-4879-afa9-fa3eee49df85
  AZURE_TENANT_ID: 7d8b7b64-c80c-4c8a-a514-66f6b1cf8607
  AZURE_SUBSCRIPTION_ID: 38d660ff-611e-4f6c-ad29-70f5cf118f52
  AZURE_RESOURCE_GROUP: rg-obserra-prod-eastus
  AZURE_KEY_VAULT_NAME: kv-obserra-prod-38d660
  DEPLOY_PRINCIPAL_ID: f87823b9-4fc5-4c3e-b8ac-63c91c3f15aa
  RUNTIME_PRINCIPAL_ID: 11ee06b7-bad6-4e30-a48b-469fec011fe3
  OBSERVATION_BRANCH: ops/marketplace-v12-ingest-dispatch-20260823

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Authenticate existing governed main-branch Azure identity
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Record non-secret RBAC and Key Vault metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "${AZURE_SUBSCRIPTION_ID}"
          test "$(az account show --query tenantId -o tsv)" = "${AZURE_TENANT_ID}"

          deploy_roles="$(az role assignment list --assignee-object-id "${DEPLOY_PRINCIPAL_ID}" --all --query '[].{role:roleDefinitionName,scope:scope}' -o json)"
          runtime_roles="$(az role assignment list --assignee-object-id "${RUNTIME_PRINCIPAL_ID}" --all --query '[].{role:roleDefinitionName,scope:scope}' -o json)"
          vault="$(az keyvault show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_KEY_VAULT_NAME}" --query '{id:id,name:name,location:location,enableRbacAuthorization:properties.enableRbacAuthorization,publicNetworkAccess:properties.publicNetworkAccess,networkDefaultAction:properties.networkAcls.defaultAction}' -o json)"
          identities="$(az identity list --resource-group "${AZURE_RESOURCE_GROUP}" --query '[].{name:name,clientId:clientId,principalId:principalId}' -o json)"
          tmp="${RUNNER_TEMP}/marketplace-azure-rbac.json"
          python - <<'PY' "${deploy_roles}" "${runtime_roles}" "${vault}" "${identities}" >"${tmp}"
          import json, sys
          payload = {
            "contract": "obserra-marketplace-azure-rbac-observation-v1",
            "deployRoles": json.loads(sys.argv[1]),
            "runtimeRoles": json.loads(sys.argv[2]),
            "keyVault": json.loads(sys.argv[3]),
            "identities": json.loads(sys.argv[4]),
          }
          print(json.dumps(payload, indent=2))
          PY

          python - <<'PY' "${tmp}"
          import base64, json, os, urllib.error, urllib.parse, urllib.request, sys
          content=open(sys.argv[1],'rb').read()
          repo='jblan2026-hub/obserra-website'; path='ops/marketplace-v12-azure-rbac.json'; branch=os.environ['OBSERVATION_BRANCH']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-azure-rbac','Content-Type':'application/json'}
          encoded=urllib.parse.quote(path,safe='/')
          get=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}',headers=headers)
          sha=None
          try:
            with urllib.request.urlopen(get,timeout=30) as response: sha=json.load(response).get('sha')
          except urllib.error.HTTPError as error:
            if error.code != 404: raise
          body={'message':'ops: record Marketplace Azure RBAC metadata','content':base64.b64encode(content).decode(),'branch':branch}
          if sha: body['sha']=sha
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(put,timeout=30) as response:
            if response.status not in (200,201): raise SystemExit(response.status)
          PY
