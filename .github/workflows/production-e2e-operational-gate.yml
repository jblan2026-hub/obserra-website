name: Production End-to-End Operational Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: obserra-production-e2e
  cancel-in-progress: true

jobs:
  production-operational-verification:
    name: Website, Academy, identity, commerce, and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify website liveness contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            'https://www.obserrallc.com/api/health' \
            -D /tmp/website-health-headers.txt -o /tmp/website-health.json
          jq -e '.service == "obserra-website" and .status == "live" and .contract == "website-liveness-v1"' /tmp/website-health.json >/dev/null
          jq -e --arg expected_project_id 'prj_lxTKKDa9sbhht7FaigiaF1PONMiC' '
            .routing.expectedProjectId == $expected_project_id and
            .routing.observedProjectId == $expected_project_id and
            .routing.authority == "verified" and
            .routing.verified == true and
            (.routing.deploymentId | test("^dpl_[A-Za-z0-9]+$")) and
            (.routing.gitCommitSha | test("^[0-9a-f]{40}$"))
          ' /tmp/website-health.json >/dev/null
          grep -Eqi '^cache-control:[[:space:]]*no-store' /tmp/website-health-headers.txt
          grep -Eqi '^x-obserra-health-contract:[[:space:]]*website-liveness-v1' /tmp/website-health-headers.txt
          grep -Eqi '^x-obserra-routing-authority:[[:space:]]*verified' /tmp/website-health-headers.txt
          grep -Eqi '^x-obserra-vercel-project-id:[[:space:]]*prj_lxTKKDa9sbhht7FaigiaF1PONMiC' /tmp/website-health-headers.txt
          grep -Eqi '^x-obserra-vercel-deployment-id:[[:space:]]*dpl_[A-Za-z0-9]+' /tmp/website-health-headers.txt
          grep -Eqi '^x-obserra-release-commit:[[:space:]]*[0-9a-f]{40}' /tmp/website-health-headers.txt

      - name: Verify homepage and security headers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://www.obserrallc.com -o /tmp/home.html
          curl --fail --silent --show-error --head --max-time 30 https://www.obserrallc.com -o /tmp/home-headers.txt
          grep -Eqi 'Obserra' /tmp/home.html
          grep -Eqi '^strict-transport-security:' /tmp/home-headers.txt
          grep -Eqi '^content-security-policy:' /tmp/home-headers.txt
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/home-headers.txt
          grep -Eqi '^x-frame-options:[[:space:]]*DENY' /tmp/home-headers.txt
          grep -Eqi '^x-obserra-identity-provider:[[:space:]]*public' /tmp/home-headers.txt
          grep -Eqi '^x-obserra-identity-status:[[:space:]]*not-required' /tmp/home-headers.txt

      - name: Verify Academy catalog and legal controls
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://www.obserrallc.com/academy -o /tmp/academy.html
          grep -Eqi '60[^0-9]+paid courses|60[^0-9]+course' /tmp/academy.html
          grep -Eqi 'Stripe checkout|checkout.stripe.com' /tmp/academy.html
          grep -Eqi 'not a state license|not.*professional certification|not third-party certification' /tmp/academy.html
          grep -Eqi 'Certificate of Training|completion record' /tmp/academy.html
          grep -Eqi 'action="/api/academy/checkout"' /tmp/academy.html
          grep -Eqi 'method="post"' /tmp/academy.html
          if grep -Eqi '/api/academy/checkout\?course=' /tmp/academy.html; then
            echo 'Academy contains a retired GET mutation link.' >&2
            exit 1
          fi

      - name: Verify authorized EC-Council credential artwork is live
        shell: bash
        run: |
          set -euo pipefail
          base_url='https://www.obserrallc.com/badges/eccouncil'
          for asset in \
            adg-adopt.svg adg-defend.svg adg-govern.svg \
            ceh.png chfi.png ecih.png eces.png cciso.png cnda.png; do
            curl --fail --silent --show-error --max-time 30 \
              "${base_url}/${asset}" -o "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done
          curl --fail --silent --show-error --max-time 30 \
            "${base_url}/asset-manifest.json" -o /tmp/ec-council-asset-manifest.json
          jq -e '
            .recordType == "authorized-ec-council-credential-artwork" and
            .legalOwner == "OBSERRA EXECUTIVE PROTECTION & INTELLIGENCE LLC" and
            (.credentials | length) == 9
          ' /tmp/ec-council-asset-manifest.json >/dev/null
          jq -r '.credentials[] | [.sha256, (.assetPath | split("/") | last)] | @tsv' \
            /tmp/ec-council-asset-manifest.json | while IFS=$'\t' read -r expected asset; do
              actual=$(sha256sum "/tmp/${asset}" | cut -d' ' -f1)
              test "$actual" = "$expected"
            done

      - name: Verify checkout method and same-origin boundaries without creating a payment
        shell: bash
        run: |
          set -euo pipefail
          checkout_status=$(curl --silent --show-error --max-time 30 \
            'https://www.obserrallc.com/api/academy/checkout' \
            -D /tmp/checkout-headers.txt -o /tmp/checkout.json -w '%{http_code}')
          test "$checkout_status" = "405"
          grep -Eqi '^allow:[[:space:]]*POST' /tmp/checkout-headers.txt
          grep -Eqi '^cache-control:[[:space:]].*(private|no-cache|no-store)' /tmp/checkout-headers.txt

          cross_origin_status=$(curl --silent --show-error --max-time 30 \
            --request POST \
            --header 'Origin: https://invalid.example' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data 'course=zero-trust-strategy' \
            'https://www.obserrallc.com/api/academy/checkout' \
            -o /tmp/cross-origin-checkout.json -w '%{http_code}')
          test "$cross_origin_status" = "403"

      - name: Verify Academy commerce is operational or intentionally fail closed
        shell: bash
        run: |
          set -euo pipefail
          health_status=$(curl --silent --show-error --max-time 30 \
            'https://www.obserrallc.com/api/academy/commerce-health' \
            -D /tmp/commerce-headers.txt -o /tmp/commerce-health.json -w '%{http_code}')

          if [ "$health_status" = "200" ]; then
            jq -e '
              .contract == "academy-commerce-health-v1" and
              .operational == true and
              .paymentProvider == "stripe" and
              .providerVerification.environment == "live" and
              .providerVerification.connected == true and
              .providerVerification.chargesEnabled == true and
              .webhookVerification == "required" and
              .identity == "available" and
              .identityEnvironment == "live" and
              .durableStorage == "available" and
              .storageSchema == "academy-durable-state-v2" and
              .purchaserIdentityHashing == "available" and
              .fulfillment.idempotencyKey == "stripe-event-id" and
              .fulfillment.auditLedger == "durable-supabase"
            ' /tmp/commerce-health.json >/dev/null
          elif [ "$health_status" = "503" ]; then
            jq -e '
              .contract == "academy-commerce-health-v1" and
              .operational == false and
              .identity == "available" and
              .identityEnvironment == "live"
            ' /tmp/commerce-health.json >/dev/null

            attempt_id="$(cat /proc/sys/kernel/random/uuid)"
            issued_at="$(date +%s)"
            checkout_lock_status=$(curl --silent --show-error --max-time 30 \
              --request POST \
              --header 'Origin: https://www.obserrallc.com' \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'course=zero-trust-strategy' \
              --data-urlencode "checkoutAttemptId=${attempt_id}" \
              --data-urlencode "checkoutAttemptIssuedAt=${issued_at}" \
              'https://www.obserrallc.com/api/academy/checkout' \
              -D /tmp/licensing-lock-headers.txt -o /tmp/licensing-lock.json -w '%{http_code}')
            test "$checkout_lock_status" = "307"
            grep -Eqi '^location: .*enrollment=licensing-pending' /tmp/licensing-lock-headers.txt
            grep -Eqi '^x-obserra-sales-license:[[:space:]]*pending' /tmp/licensing-lock-headers.txt
          else
            echo "Unexpected Academy commerce health HTTP status: ${health_status}" >&2
            exit 1
          fi

          grep -Eqi '^cache-control:[[:space:]]*no-store' /tmp/commerce-headers.txt
          grep -Eqi '^x-obserra-commerce-contract:[[:space:]]*academy-commerce-health-v1' /tmp/commerce-headers.txt

          cat /tmp/home.html /tmp/academy.html > /tmp/production-pages.html
          if grep -Eqi 'pk_test_|clerk\.accounts\.dev|clerkstage\.dev' /tmp/production-pages.html; then
            echo 'Production is using a development identity/payment configuration.' >&2
            exit 1
          fi

      - name: Verify Florida Class D LMS liveness and honest readiness state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            'https://www.obserrallc.com/api/florida-class-d/health/live' \
            -o /tmp/lms-live.json
          jq -e '.service == "florida-class-d-lms" and .status == "live"' /tmp/lms-live.json >/dev/null

          ready_status=$(curl --silent --show-error --max-time 30 \
            'https://www.obserrallc.com/api/florida-class-d/health/ready' \
            -D /tmp/lms-ready-headers.txt -o /tmp/lms-ready.json -w '%{http_code}')
          if [ "$ready_status" = "200" ]; then
            jq -e '.service == "florida-class-d-lms" and .status == "ready"' /tmp/lms-ready.json >/dev/null
          elif [ "$ready_status" = "503" ]; then
            jq -e '.service == "florida-class-d-lms" and .status == "not_ready"' /tmp/lms-ready.json >/dev/null
            grep -Eqi '^retry-after:[[:space:]]*[0-9]+' /tmp/lms-ready-headers.txt
          else
            echo "Unexpected Florida Class D readiness HTTP status: ${ready_status}" >&2
            exit 1
          fi

      - name: Verify canonical domain redirect
        shell: bash
        run: |
          set -euo pipefail
          final_url=$(curl --silent --show-error --location --max-time 30 -o /dev/null -w '%{url_effective}' https://obserrallc.com)
          case "$final_url" in
            https://www.obserrallc.com|https://www.obserrallc.com/) ;;
            *) echo "Unexpected canonical destination: $final_url" >&2; exit 1 ;;
          esac
