name: Ops - Diagnose Vercel OIDC Runtime

on:
  push:
    branches:
      - automation/vercel-runtime-binding-audit-20260822

permissions:
  contents: read
  statuses: write

concurrency:
  group: ops-diagnose-vercel-oidc-runtime
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
      DEPLOYMENT_ID: dpl_3M1XorH66KxxZCH9N7Dxx7fLEjZg
    steps:
      - name: Require Vercel management credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_TOKEN:-}" ]]

      - name: Read non-secret OIDC runtime settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}?teamId=${TEAM_ID}" \
            -o /tmp/project.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${TEAM_ID}" \
            -o /tmp/deployment.json

          expose="$(jq -r '.autoExposeSystemEnvs // false' /tmp/project.json)"
          claims="absent"
          if jq -e '.oidcTokenClaims // .projectSettings.oidcTokenClaims // empty' /tmp/deployment.json >/dev/null 2>&1; then
            claims="present"
          fi
          echo "autoExposeSystemEnvs=${expose}"
          echo "deploymentOidcClaims=${claims}"
          echo "expose=${expose}" >> "$GITHUB_OUTPUT"
          echo "claims=${claims}" >> "$GITHUB_OUTPUT"

      - name: Publish diagnostic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EXPOSE: ${{ steps.settings.outputs.expose }}
          CLAIMS: ${{ steps.settings.outputs.claims }}
        run: |
          set -euo pipefail
          state="success"
          description="autoExposeSystemEnvs=${EXPOSE}; oidcClaims=${CLAIMS}"
          if [[ "${EXPOSE}" != "true" ]]; then state="failure"; fi
          jq -n --arg state "$state" --arg description "$description" \
            '{state:$state,context:"Obserra Vercel OIDC Runtime",description:$description}' >/tmp/status.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" >/dev/null
