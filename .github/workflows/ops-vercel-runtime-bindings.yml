name: Ops - Vercel Runtime Binding Audit

on:
  push:
    branches:
      - automation/vercel-runtime-binding-audit-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: ops-vercel-runtime-binding-audit
  cancel-in-progress: false

jobs:
  audit-and-converge:
    if: github.event_name == 'push' || github.head_ref == 'automation/vercel-runtime-binding-audit-20260822'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      TARGET_DEPLOYMENT_ID: dpl_EepyEpkiRkhzbyrPKzY9EAFG72Fa
      TARGET_SHA: 1d9ad1f042f527552d1e65763b0bc1f26ba0f829
    steps:
      - name: Require Vercel management credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN/VERCEL_ACCESS_TOKEN is not configured." >&2
            exit 1
          fi

      - name: Inventory production binding names only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}" \
            -o /tmp/vercel-env.json

          check_key() {
            local key="$1"
            if jq -e --arg key "$key" '.envs[]? | select(.key == $key) | select((.target // []) | index("production"))' /tmp/vercel-env.json >/dev/null; then
              echo "PRESENT ${key}"
            else
              echo "MISSING ${key}"
            fi
          }

          echo "Academy production bindings (names only):"
          for key in \
            OBSERRA_ACADEMY_SUPABASE_URL \
            OBSERRA_ACADEMY_SUPABASE_SERVICE_ROLE_KEY \
            OBSERRA_ACADEMY_EMAIL_HASH_SECRET \
            ACADEMY_STRIPE_SECRET_KEY \
            ACADEMY_STRIPE_WEBHOOK_SECRET; do
            check_key "$key"
          done

          echo "FDACS production bindings (names only):"
          for key in \
            OBSERRA_FDACS_SUPABASE_URL \
            OBSERRA_FDACS_SUPABASE_PROJECT_REF \
            OBSERRA_FDACS_SUPABASE_SERVICE_ROLE_KEY \
            STRIPE_SECRET_KEY \
            STRIPE_IDENTITY_WEBHOOK_SECRET \
            OBSERRA_FDACS_CLASS_D_MEDIA_PROVIDER \
            OBSERRA_FDACS_DAILY_API_KEY \
            OBSERRA_FDACS_DI_LICENSE_NUMBER \
            OBSERRA_FDACS_DOCUMENTS_BUCKET; do
            check_key "$key"
          done

          echo "FDACS HA evidence bindings (names only):"
          for key in \
            OBSERRA_FDACS_HA_EDGE_DNS_STATUS \
            OBSERRA_FDACS_HA_APPLICATION_STATUS \
            OBSERRA_FDACS_HA_IDENTITY_STATUS \
            OBSERRA_FDACS_HA_DATABASE_STATUS \
            OBSERRA_FDACS_HA_MEDIA_STATUS \
            OBSERRA_FDACS_HA_DOCUMENT_STORAGE_STATUS \
            OBSERRA_FDACS_HA_COMMERCE_STATUS \
            OBSERRA_FDACS_HA_OBSERVABILITY_STATUS \
            OBSERRA_FDACS_HA_BACKUP_RESTORE_STATUS \
            OBSERRA_FDACS_HA_FAILOVER_EXERCISE_STATUS \
            OBSERRA_FDACS_HA_EVIDENCE_MANIFEST \
            OBSERRA_FDACS_HA_EVIDENCE_MANIFEST_SHA256 \
            OBSERRA_FDACS_HA_RTO_MINUTES \
            OBSERRA_FDACS_HA_RPO_MINUTES \
            OBSERRA_FDACS_HA_LAST_FAILOVER_TEST_AT; do
            check_key "$key"
          done

      - name: Converge known non-secret production constants
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/safe-env.json <<'JSON'
          [
            {"key":"OBSERRA_ACADEMY_SUPABASE_URL","value":"https://nwxnyqlyzyufgoadtqxs.supabase.co","type":"plain","target":["production"]},
            {"key":"OBSERRA_FDACS_SUPABASE_URL","value":"https://ggkxgjhsbgbifiqrhavr.supabase.co","type":"plain","target":["production"]},
            {"key":"OBSERRA_FDACS_SUPABASE_PROJECT_REF","value":"ggkxgjhsbgbifiqrhavr","type":"plain","target":["production"]},
            {"key":"OBSERRA_FDACS_DOCUMENTS_BUCKET","value":"fdacs-class-d-completion-documents","type":"plain","target":["production"]},
            {"key":"OBSERRA_FDACS_CLASS_D_MEDIA_PROVIDER","value":"daily","type":"plain","target":["production"]},
            {"key":"OBSERRA_FDACS_PUBLIC_ORIGIN","value":"https://www.obserrallc.com","type":"plain","target":["production"]}
          ]
          JSON

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/safe-env.json \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}" \
            -o /tmp/upsert.json

          jq -e '(.failed // []) | length == 0' /tmp/upsert.json >/dev/null
          echo "Safe production constants converged. Values were not printed."

      - name: Redeploy exact verified production artifact with updated bindings
        id: redeploy
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/redeploy.json <<JSON
          {"name":"obserra-website-live","deploymentId":"${TARGET_DEPLOYMENT_ID}","target":"production"}
          JSON
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/redeploy.json \
            "https://api.vercel.com/v13/deployments?teamId=${TEAM_ID}" \
            -o /tmp/deployment.json

          new_id="$(jq -r '.id // empty' /tmp/deployment.json)"
          new_url="$(jq -r '.url // empty' /tmp/deployment.json)"
          [[ -n "$new_id" && -n "$new_url" ]]
          echo "deployment_id=$new_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$new_url" >> "$GITHUB_OUTPUT"
          echo "Created production redeploy ${new_id}."

      - name: Wait for Vercel READY and exact SHA
        shell: bash
        env:
          NEW_DEPLOYMENT_ID: ${{ steps.redeploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${NEW_DEPLOYMENT_ID}?teamId=${TEAM_ID}" \
              -o /tmp/current.json
            state="$(jq -r '.readyState // .state // empty' /tmp/current.json)"
            if [[ "$state" == "READY" ]]; then
              sha="$(jq -r '.meta.githubCommitSha // empty' /tmp/current.json)"
              verified="$(jq -r '.meta.githubCommitVerification // empty' /tmp/current.json)"
              [[ "$sha" == "$TARGET_SHA" ]]
              [[ "$verified" == "verified" ]]
              echo "Vercel redeploy READY on exact verified SHA."
              exit 0
            fi
            if [[ "$state" == "ERROR" || "$state" == "CANCELED" ]]; then
              echo "Vercel redeploy entered terminal state ${state}." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for Vercel redeploy." >&2
          exit 1

      - name: Verify canonical website remains exact-current
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "https://www.obserrallc.com/api/health" \
              -o /tmp/health.json || true
            if jq -e --arg sha "$TARGET_SHA" '.status == "live" and .hosting.verified == true and .routing.verified == true and .routing.gitCommitSha == $sha' /tmp/health.json >/dev/null 2>&1; then
              echo "Canonical website remains live on exact current SHA."
              exit 0
            fi
            sleep 4
          done
          echo "Canonical exact-SHA verification failed after redeploy." >&2
          exit 1

      - name: Re-audit production binding names only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}" \
            -o /tmp/vercel-env-final.json

          missing=()
          for key in \
            OBSERRA_ACADEMY_SUPABASE_SERVICE_ROLE_KEY \
            ACADEMY_STRIPE_SECRET_KEY \
            ACADEMY_STRIPE_WEBHOOK_SECRET \
            OBSERRA_FDACS_SUPABASE_SERVICE_ROLE_KEY \
            STRIPE_IDENTITY_WEBHOOK_SECRET \
            OBSERRA_FDACS_DAILY_API_KEY \
            OBSERRA_FDACS_DI_LICENSE_NUMBER \
            OBSERRA_FDACS_HA_EVIDENCE_MANIFEST \
            OBSERRA_FDACS_HA_EVIDENCE_MANIFEST_SHA256; do
            if ! jq -e --arg key "$key" '.envs[]? | select(.key == $key) | select((.target // []) | index("production"))' /tmp/vercel-env-final.json >/dev/null; then
              missing+=("$key")
            fi
          done

          if ((${#missing[@]})); then
            printf 'STILL_MISSING %s\n' "${missing[@]}"
          else
            echo "All primary production secret/evidence binding names are present."
          fi
