name: Ops - Vercel Secret Source Discovery

on:
  push:
    branches:
      - automation/vercel-runtime-binding-audit-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ops-vercel-secret-source-discovery
  cancel-in-progress: true

jobs:
  discover:
    if: github.event_name == 'push' || github.head_ref == 'automation/vercel-runtime-binding-audit-20260822'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      TARGET_SHA: 1d9ad1f042f527552d1e65763b0bc1f26ba0f829
      ACADEMY_URL: https://nwxnyqlyzyufgoadtqxs.supabase.co
    steps:
      - name: Require Vercel management credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_TOKEN:-}" ]]

      - name: Discover compatible source bindings without printing values
        shell: bash
        run: |
          set -euo pipefail

          sources=(
            "obserra-integrated-services:prj_v6Hb7FkpkUoLKlHkjzKJ5HVgYDaL"
            "obserra-website-lcn2:prj_FfAnssVJU8pcJydGNJHmCliP6Yme"
            "obserra-website:prj_o6LgzRVFWJNDcu4uxo0TZPlE2FKe"
            "obserra-academy-secure:prj_KaImEDp1dR8mqhfjdczkvKiFFrM5"
          )

          get_value() {
            local file="$1" key="$2"
            jq -r --arg key "$key" '[.envs[]? | select(.key == $key) | select((.target // []) | index("production"))][0].value // empty' "$file"
          }

          for entry in "${sources[@]}"; do
            name="${entry%%:*}"
            project="${entry#*:}"
            file="/tmp/${project}.json"

            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v10/projects/${project}/env?decrypt=true&teamId=${TEAM_ID}" \
              -o "$file"

            academy_url="$(get_value "$file" OBSERRA_ACADEMY_SUPABASE_URL)"
            academy_service="$(get_value "$file" OBSERRA_ACADEMY_SUPABASE_SERVICE_ROLE_KEY)"
            academy_stripe="$(get_value "$file" ACADEMY_STRIPE_SECRET_KEY)"
            academy_webhook="$(get_value "$file" ACADEMY_STRIPE_WEBHOOK_SECRET)"
            identity_webhook="$(get_value "$file" STRIPE_IDENTITY_WEBHOOK_SECRET)"
            di_license="$(get_value "$file" OBSERRA_FDACS_DI_LICENSE_NUMBER)"
            ha_manifest="$(get_value "$file" OBSERRA_FDACS_HA_EVIDENCE_MANIFEST)"
            ha_digest="$(get_value "$file" OBSERRA_FDACS_HA_EVIDENCE_MANIFEST_SHA256)"

            academy_service_state="absent"
            if [[ -n "$academy_service" ]]; then
              if [[ "$academy_url" == "$ACADEMY_URL" ]]; then
                academy_service_state="compatible"
              else
                academy_service_state="url_mismatch"
              fi
            fi

            academy_stripe_state="absent"
            if [[ "$academy_stripe" == rk_live_* ]]; then academy_stripe_state="compatible"; fi

            academy_webhook_state="absent"
            if [[ "$academy_webhook" == whsec_* ]]; then academy_webhook_state="compatible"; fi

            identity_webhook_state="absent"
            if [[ "$identity_webhook" == whsec_* ]]; then identity_webhook_state="compatible"; fi

            di_state="absent"
            if [[ -n "$di_license" ]]; then di_state="present"; fi

            ha_state="absent"
            if [[ -n "$ha_manifest" && "$ha_digest" =~ ^[0-9a-fA-F]{64}$ ]]; then
              candidate="$(jq -r '.releaseCandidateSha // empty' <<<"$ha_manifest" 2>/dev/null || true)"
              calculated="$(jq -cS . <<<"$ha_manifest" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
              if [[ "$candidate" == "$TARGET_SHA" && "${calculated,,}" == "${ha_digest,,}" ]]; then
                ha_state="candidate_digest_match"
              else
                ha_state="incompatible"
              fi
            fi

            echo "SOURCE ${name}"
            echo "  academy_supabase_service=${academy_service_state}"
            echo "  academy_stripe_key=${academy_stripe_state}"
            echo "  academy_stripe_webhook=${academy_webhook_state}"
            echo "  stripe_identity_webhook=${identity_webhook_state}"
            echo "  fdacs_di_license=${di_state}"
            echo "  fdacs_ha_manifest=${ha_state}"
          done
