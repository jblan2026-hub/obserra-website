name: Ops - Bind Academy Project Ref

on:
  push:
    branches:
      - automation/vercel-runtime-binding-audit-20260822

permissions:
  contents: read
  statuses: write

concurrency:
  group: ops-bind-academy-project-ref
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
    steps:
      - name: Mark binding pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data '{"state":"pending","context":"Obserra Academy Project Ref","description":"Binding non-secret production project ref"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" >/dev/null

      - name: Require Vercel management credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_TOKEN:-}" ]]

      - name: Upsert non-secret Academy project binding
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/env.json <<'JSON'
          [{
            "key":"OBSERRA_ACADEMY_SUPABASE_PROJECT_REF",
            "value":"nwxnyqlyzyufgoadtqxs",
            "type":"plain",
            "target":["production"]
          }]
          JSON

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/env.json \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}" \
            -o /tmp/upsert.json
          jq -e '(.failed // []) | length == 0' /tmp/upsert.json >/dev/null

      - name: Verify production binding by name and target only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}" \
            -o /tmp/envs.json
          jq -e '.envs[] | select(.key == "OBSERRA_ACADEMY_SUPABASE_PROJECT_REF") | select((.target // []) | index("production"))' /tmp/envs.json >/dev/null
          echo "OBSERRA_ACADEMY_SUPABASE_PROJECT_REF=present-production"

      - name: Mark binding success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data '{"state":"success","context":"Obserra Academy Project Ref","description":"Production project ref present; values not exposed"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" >/dev/null

      - name: Mark binding failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data '{"state":"failure","context":"Obserra Academy Project Ref","description":"Production project-ref binding failed"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" >/dev/null || true
