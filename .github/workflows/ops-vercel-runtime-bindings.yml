name: Ops - GitHub Secret Source Discovery

on:
  push:
    branches:
      - automation/vercel-runtime-binding-audit-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ops-github-secret-source-discovery
  cancel-in-progress: true

jobs:
  discover:
    if: github.event_name == 'push' || github.head_ref == 'automation/vercel-runtime-binding-audit-20260822'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      GH_ACADEMY_SUPABASE_SERVICE: ${{ secrets.OBSERRA_ACADEMY_SUPABASE_SERVICE_ROLE_KEY }}
      GH_ACADEMY_STRIPE_KEY: ${{ secrets.ACADEMY_STRIPE_SECRET_KEY }}
      GH_ACADEMY_STRIPE_WEBHOOK: ${{ secrets.ACADEMY_STRIPE_WEBHOOK_SECRET }}
      GH_STRIPE_IDENTITY_WEBHOOK: ${{ secrets.STRIPE_IDENTITY_WEBHOOK_SECRET }}
      GH_FDACS_DI_LICENSE: ${{ secrets.OBSERRA_FDACS_DI_LICENSE_NUMBER }}
      GH_FDACS_HA_MANIFEST: ${{ secrets.OBSERRA_FDACS_HA_EVIDENCE_MANIFEST }}
      GH_FDACS_HA_DIGEST: ${{ secrets.OBSERRA_FDACS_HA_EVIDENCE_MANIFEST_SHA256 }}
      TARGET_SHA: 1d9ad1f042f527552d1e65763b0bc1f26ba0f829
    steps:
      - name: Confirm operations credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_TOKEN:-}" ]]

      - name: Report compatible GitHub secret presence only
        shell: bash
        run: |
          set -euo pipefail

          presence() {
            local label="$1" value="$2"
            if [[ -n "$value" ]]; then
              echo "PRESENT ${label}"
            else
              echo "MISSING ${label}"
            fi
          }

          presence OBSERRA_ACADEMY_SUPABASE_SERVICE_ROLE_KEY "${GH_ACADEMY_SUPABASE_SERVICE:-}"

          if [[ "${GH_ACADEMY_STRIPE_KEY:-}" == rk_live_* ]]; then
            echo "PRESENT_COMPATIBLE ACADEMY_STRIPE_SECRET_KEY"
          elif [[ -n "${GH_ACADEMY_STRIPE_KEY:-}" ]]; then
            echo "PRESENT_INCOMPATIBLE ACADEMY_STRIPE_SECRET_KEY"
          else
            echo "MISSING ACADEMY_STRIPE_SECRET_KEY"
          fi

          if [[ "${GH_ACADEMY_STRIPE_WEBHOOK:-}" == whsec_* ]]; then
            echo "PRESENT_COMPATIBLE ACADEMY_STRIPE_WEBHOOK_SECRET"
          elif [[ -n "${GH_ACADEMY_STRIPE_WEBHOOK:-}" ]]; then
            echo "PRESENT_INCOMPATIBLE ACADEMY_STRIPE_WEBHOOK_SECRET"
          else
            echo "MISSING ACADEMY_STRIPE_WEBHOOK_SECRET"
          fi

          if [[ "${GH_STRIPE_IDENTITY_WEBHOOK:-}" == whsec_* ]]; then
            echo "PRESENT_COMPATIBLE STRIPE_IDENTITY_WEBHOOK_SECRET"
          elif [[ -n "${GH_STRIPE_IDENTITY_WEBHOOK:-}" ]]; then
            echo "PRESENT_INCOMPATIBLE STRIPE_IDENTITY_WEBHOOK_SECRET"
          else
            echo "MISSING STRIPE_IDENTITY_WEBHOOK_SECRET"
          fi

          presence OBSERRA_FDACS_DI_LICENSE_NUMBER "${GH_FDACS_DI_LICENSE:-}"

          ha_state="missing"
          if [[ -n "${GH_FDACS_HA_MANIFEST:-}" && "${GH_FDACS_HA_DIGEST:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            candidate="$(jq -r '.releaseCandidateSha // empty' <<<"${GH_FDACS_HA_MANIFEST}" 2>/dev/null || true)"
            calculated="$(jq -cS . <<<"${GH_FDACS_HA_MANIFEST}" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            if [[ "$candidate" == "$TARGET_SHA" && "${calculated,,}" == "${GH_FDACS_HA_DIGEST,,}" ]]; then
              ha_state="compatible"
            else
              ha_state="incompatible"
            fi
          fi
          echo "FDACS_HA_EVIDENCE=${ha_state}"
