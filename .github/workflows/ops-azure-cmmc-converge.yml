name: One-Shot Azure CMMC Evidence Convergence

on:
  push:
    branches:
      - feat/azure-production-plane-20260821
    paths:
      - .github/workflows/ops-azure-cmmc-converge.yml

permissions:
  contents: write

concurrency:
  group: one-shot-azure-cmmc-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/azure-production-plane-20260821
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate governed system evidence from current source
        run: npm run generate:cmmc-system-evidence

      - name: Verify generated evidence before commit
        run: npm run verify:cmmc-system-evidence

      - name: Commit generated evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          git rm .github/workflows/ops-azure-cmmc-converge.yml
          if git diff --cached --quiet; then
            echo "::error::One-shot convergence produced no controlled change."
            exit 1
          fi
          git commit -m "chore(compliance): converge Azure production evidence"
          git push origin HEAD:feat/azure-production-plane-20260821
