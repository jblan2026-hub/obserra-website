name: PR166 Governed Evidence Apply

on:
  push:
    branches:
      - hotfix/pr166-provider-isolation-source-apply-20260820
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH: fix/165-public-identity-readiness-20260820
      EXPECTED_HEAD: f7689fcc040e3d5ce3e82c6416f0ab29181d30fd
      CI: "true"
    steps:
      - name: Checkout exact validated source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Require exact GREEN source head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "Refusing evidence generation: expected $EXPECTED_HEAD, found $actual" >&2
            exit 1
          }
          test -z "$(git status --porcelain)"

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install supported npm major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate legal identity audit first
        run: npm run generate:legal-identity-audit

      - name: Enforce legal evidence allowlist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "docs/compliance/LEGAL-IDENTITY-AUDIT.json"
          test "${changed[1]}" = "docs/compliance/LEGAL-IDENTITY-AUDIT.md"
          test "${changed[2]}" = "docs/compliance/LEGAL-IDENTITY-AUDIT.sha256"

      - name: Commit legal evidence carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/compliance/LEGAL-IDENTITY-AUDIT.json \
            docs/compliance/LEGAL-IDENTITY-AUDIT.md \
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          git commit -m "docs(compliance): refresh legal identity evidence for #165"

      - name: Generate derived governed evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:cmmc-system-evidence
          npm run generate:cmmc-disposition
          npm run generate:fdacs-pii-audit
          npm run generate:cmmc-handoff

      - name: Enforce derived evidence allowlist and required outputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0

          for file in "${changed[@]}"; do
            case "$file" in
              docs/compliance/CMMC-SYSTEM-EVIDENCE.json|\
              docs/compliance/CMMC-SYSTEM-EVIDENCE.md|\
              docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256|\
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json|\
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md|\
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256|\
              docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md|\
              docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256|\
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json|\
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md|\
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256)
                ;;
              *)
                echo "Unexpected generated evidence file: $file" >&2
                exit 1
                ;;
            esac
          done

          for required in \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required" || {
              echo "Required derived evidence did not change: $required" >&2
              exit 1
            }
          done

      - name: Verify governed evidence and source quality
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:cmmc-evidence
          npm test
          npm run lint

      - name: Commit derived evidence carrier
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          git diff --cached --quiet && {
            echo "No derived evidence changes staged" >&2
            exit 1
          }
          git commit -m "docs(compliance): refresh governed evidence for #165"

      - name: Push ordered evidence commits to target branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${TARGET_BRANCH}"
