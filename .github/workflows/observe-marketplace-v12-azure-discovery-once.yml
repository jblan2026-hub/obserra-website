name: Observe Marketplace Azure discovery once

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/observe-marketplace-v12-azure-discovery-once.yml

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture non-secret discovery workflow metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ops/marketplace-v12-ingest-dispatch-20260823
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          repo='jblan2026-hub/obserra-website'; token=os.environ['GH_TOKEN']; branch=os.environ['BRANCH']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-azure-discovery-observer'}
          url=f'https://api.github.com/repos/{repo}/actions/workflows/discover-marketplace-v12-azure-metadata-once.yml/runs?event=push&branch={branch}&per_page=5'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              p=json.load(r)
          runs=[]
          for x in p.get('workflow_runs',[]):
              runs.append({'id':x.get('id'),'status':x.get('status'),'conclusion':x.get('conclusion'),'head_sha':x.get('head_sha'),'created_at':x.get('created_at'),'html_url':x.get('html_url')})
          content=json.dumps({'workflow':'discover-marketplace-v12-azure-metadata-once.yml','runs':runs},indent=2)+'\n'
          path='ops/marketplace-v12-azure-discovery-observation.json'
          body={'message':'ops: record azure discovery observation','content':base64.b64encode(content.encode()).decode(),'branch':branch}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=json.dumps(body).encode(),method='PUT',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status not in (200,201): raise SystemExit(r.status)
          PY
