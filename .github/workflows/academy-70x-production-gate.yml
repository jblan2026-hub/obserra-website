name: Academy 70x Production Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/academy/**"
      - "app/api/academy/**"
      - "app/api/webhook/stripe/**"
      - "lib/academy.ts"
      - "scripts/academy-70x-gate.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/academy-70x-production-gate.yml"
  push:
    branches:
      - feature/academy-complete-learning-experience
      - agent/sitewide-governance-auto-academy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academy-70x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit dependency lock to active release branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "Dependency lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock website release dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve dependency lock as release evidence
        uses: actions/upload-artifact@v7
        with:
          name: academy-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Academy 70x structural and functional contract gate
        run: npm run test:academy-70x

      - name: Run repository tests
        run: npm test

      - name: Run static quality validation
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Verify generated source is unchanged
        run: git diff --exit-code -- . ':!package-lock.json'
