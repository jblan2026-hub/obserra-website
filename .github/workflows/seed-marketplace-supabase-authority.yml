name: Seed Marketplace Supabase authority

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-marketplace-supabase-authority.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: marketplace-supabase-authority-seed
  cancel-in-progress: false

env:
  MIGRATION_URL: https://ykmrlcfitsubqajgfnye.supabase.co/functions/v1/marketplace-keyvault-authority-migration
  OBSERVATION_BRANCH: ops/marketplace-v12-ingest-dispatch-20260823

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Invoke authenticated Supabase to Key Vault migration
        id: migrate
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange"
          oidc="$(curl -sS --fail-with-body -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}" | jq -er '.value')"
          test -n "${oidc}"
          echo "::add-mask::${oidc}"
          status="$(curl -sS --max-time 30 -o "${RUNNER_TEMP}/supabase-authority-result.json" -w '%{http_code}' -X POST -H "Authorization: Bearer ${oidc}" "${MIGRATION_URL}" || true)"
          unset oidc
          printf '%s' "${status}" > "${RUNNER_TEMP}/supabase-authority-status"
          jq -e 'type == "object" and (.migrated == true or .migrated == false) and ((.state // "") | type == "string") and ((.source // "") | type == "string") and ((.code // "") | type == "string")' "${RUNNER_TEMP}/supabase-authority-result.json" >/dev/null

      - name: Publish non-sensitive migration receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          status_path=os.path.join(os.environ['RUNNER_TEMP'],'supabase-authority-status')
          result_path=os.path.join(os.environ['RUNNER_TEMP'],'supabase-authority-result.json')
          status=open(status_path).read().strip() if os.path.exists(status_path) else '000'
          try: raw=json.load(open(result_path))
          except Exception: raw={}
          receipt={
            'contract':'obserra-marketplace-supabase-keyvault-migration-v1',
            'httpStatus':status,
            'migrated':raw.get('migrated') is True,
            'state':raw.get('state') if isinstance(raw.get('state'),str) else None,
            'source':raw.get('source') if isinstance(raw.get('source'),str) else None,
            'code':raw.get('code') if isinstance(raw.get('code'),str) else None,
          }
          content=(json.dumps(receipt,indent=2)+'\n').encode()
          repo='jblan2026-hub/obserra-website'; path='ops/marketplace-v12-supabase-authority.json'; branch=os.environ['OBSERVATION_BRANCH']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-supabase-authority','Content-Type':'application/json'}
          encoded=urllib.parse.quote(path,safe='/'); sha=None
          get=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}',headers=headers)
          try:
            with urllib.request.urlopen(get,timeout=30) as response: sha=json.load(response).get('sha')
          except urllib.error.HTTPError as error:
            if error.code != 404: raise
          body={'message':'ops: record Marketplace Supabase authority migration','content':base64.b64encode(content).decode(),'branch':branch}
          if sha: body['sha']=sha
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(put,timeout=30) as response:
            if response.status not in (200,201): raise SystemExit(response.status)
          PY

      - name: Require successful migration
        shell: bash
        run: |
          set -euo pipefail
          status="$(<"${RUNNER_TEMP}/supabase-authority-status")"
          [ "${status}" = "200" ] || { code="$(jq -r '.code // "unknown"' "${RUNNER_TEMP}/supabase-authority-result.json")"; echo "::error::Supabase authority migration failed with ${status}/${code}."; exit 1; }
          jq -e '.migrated == true and (.state == "created" or .state == "existing")' "${RUNNER_TEMP}/supabase-authority-result.json" >/dev/null
