name: Regenerate Controlled Evidence on Authority Branch

on:
  push:
    branches:
      - fix/vercel-production-authority-current-20260820

permissions:
  contents: write

concurrency:
  group: branch-regenerate-controlled-evidence
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact authority branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/vercel-production-authority-current-20260820
          fetch-depth: 2

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11 --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      - name: Regenerate legal identity and CMMC system evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:legal-identity-audit
          npm run generate:cmmc-system-evidence

      - name: Verify regenerated controlled evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:legal-identity-audit
          npm run verify:cmmc-system-evidence
          npm run verify:cmmc-production-evidence
          npm run verify:cmmc-traceability

      - name: Enforce generated-only delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          docs/compliance/CMMC-SYSTEM-EVIDENCE.json
          docs/compliance/CMMC-SYSTEM-EVIDENCE.md
          docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          docs/compliance/LEGAL-IDENTITY-AUDIT.json
          docs/compliance/LEGAL-IDENTITY-AUDIT.md
          docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --exit-code -- package-lock.json

      - name: Commit exact generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Obserra CI"
          git config user.email "ci@obserrallc.com"
          git add \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/LEGAL-IDENTITY-AUDIT.json \
            docs/compliance/LEGAL-IDENTITY-AUDIT.md \
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          git diff --cached --quiet && { echo "Controlled evidence already current."; exit 0; }
          git commit -m "docs(compliance): regenerate controlled production evidence"
          git push origin HEAD:fix/vercel-production-authority-current-20260820
