name: PR179 evidence converge once

on:
  push:
    branches:
      - test/cmmc-archive-isolation-hardening-20260820

permissions:
  contents: write

concurrency:
  group: pr179-evidence-converge-once
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify hardened archive isolation test
        run: node --test test/cmmc-archive-target-isolation.test.mjs

      - name: Remove one-shot helper before evidence generation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr179-evidence-converge-once.yml
          git commit -m "chore(ci): remove PR179 evidence helper"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          test -z "$(git status --porcelain)"

      - name: Regenerate legal identity audit from clean tree
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:legal-identity-audit
          npm run verify:legal-identity-audit
          allowed='^(docs/compliance/LEGAL-IDENTITY-AUDIT\.(json|md|sha256))$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "${allowed}" || true)"
          test -z "${unexpected}" || { printf 'Unexpected legal-audit changes:\n%s\n' "${unexpected}"; exit 1; }
          git add docs/compliance/LEGAL-IDENTITY-AUDIT.json docs/compliance/LEGAL-IDENTITY-AUDIT.md docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          if ! git diff --cached --quiet; then
            git commit -m "docs(compliance): refresh PR179 legal evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          test -z "$(git status --porcelain)"

      - name: Regenerate CMMC and FDACS evidence from clean tree
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:cmmc-system-evidence
          npm run generate:cmmc-disposition
          npm run generate:fdacs-pii-audit
          npm run generate:cmmc-handoff
          npm run verify:cmmc-evidence
          npm run verify:legal-identity-audit
          node --test test/cmmc-archive-target-isolation.test.mjs
          allowed='^(docs/compliance/CMMC-SYSTEM-EVIDENCE\.(json|md|sha256)|docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION\.(json|md|sha256)|docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF\.(json|md|sha256)|docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT\.(json|md|sha256))$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "${allowed}" || true)"
          test -z "${unexpected}" || { printf 'Unexpected governed-evidence changes:\n%s\n' "${unexpected}"; exit 1; }
          git add \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.json \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          if ! git diff --cached --quiet; then
            git commit -m "docs(compliance): converge PR179 governed evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          test -z "$(git status --porcelain)"
