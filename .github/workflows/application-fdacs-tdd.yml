name: FDACS Focused TDD

on:
  pull_request:
  push:
    branches:
      - hotfix/owner-lms-test-access-20260817

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run public LMS and owner access contract tests
        run: node --test test/florida-training-public-discovery-contract.test.mjs test/florida-class-d-owner-test-access.test.mjs
