name: PR156 Clean Evidence Convergence

on:
  pull_request:
    paths:
      - ".github/workflows/application-pr156-clean-evidence-carrier.yml"

permissions:
  contents: write

jobs:
  converge:
    name: Generate governed evidence from clean local commits
    if: github.event.pull_request.number == 156 && github.event.pull_request.head.ref == 'fix/apps-private-boundary-main-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/apps-private-boundary-main-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Bind execution to triggering head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove temporary carrier and establish clean target tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/application-pr156-clean-evidence-carrier.yml
          git commit -m "ci(pr156): remove temporary clean evidence carrier"
          test -z "$(git status --porcelain)"

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install supported npm major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and optionally commit legal identity evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:legal-identity-audit
          git diff --name-only | sort > /tmp/legal.changed
          if [ -s /tmp/legal.changed ]; then
            printf '%s\n' \
              docs/compliance/LEGAL-IDENTITY-AUDIT.json \
              docs/compliance/LEGAL-IDENTITY-AUDIT.md \
              docs/compliance/LEGAL-IDENTITY-AUDIT.sha256 | sort > /tmp/legal.allowed
            while IFS= read -r file; do grep -Fx "$file" /tmp/legal.allowed >/dev/null; done < /tmp/legal.changed
            git add -- \
              docs/compliance/LEGAL-IDENTITY-AUDIT.json \
              docs/compliance/LEGAL-IDENTITY-AUDIT.md \
              docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
            git diff --cached --check
            git commit -m "ci(compliance): refresh legal identity evidence"
          fi
          test -z "$(git status --porcelain)"
          npm run verify:legal-identity-audit

      - name: Generate and optionally commit CMMC system evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:cmmc-system-evidence
          git diff --name-only | sort > /tmp/cmmc.changed
          if [ -s /tmp/cmmc.changed ]; then
            printf '%s\n' \
              docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
              docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
              docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 | sort > /tmp/cmmc.allowed
            while IFS= read -r file; do grep -Fx "$file" /tmp/cmmc.allowed >/dev/null; done < /tmp/cmmc.changed
            git add -- \
              docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
              docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
              docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
            git diff --cached --check
            git commit -m "ci(compliance): refresh clean CMMC system evidence"
          fi
          test -z "$(git status --porcelain)"
          npm run verify:cmmc-system-evidence

      - name: Generate and optionally commit technical human disposition
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:cmmc-disposition
          git diff --name-only | sort > /tmp/disposition.changed
          if [ -s /tmp/disposition.changed ]; then
            printf '%s\n' \
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 | sort > /tmp/disposition.allowed
            while IFS= read -r file; do grep -Fx "$file" /tmp/disposition.allowed >/dev/null; done < /tmp/disposition.changed
            git add -- \
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
              docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256
            git diff --cached --check
            git commit -m "ci(compliance): refresh CMMC disposition"
          fi
          test -z "$(git status --porcelain)"
          npm run verify:cmmc-disposition

      - name: Generate and optionally commit FDACS PII audit record
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:fdacs-pii-audit
          git diff --name-only | sort > /tmp/fdacs.changed
          if [ -s /tmp/fdacs.changed ]; then
            printf '%s\n' \
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256 | sort > /tmp/fdacs.allowed
            while IFS= read -r file; do grep -Fx "$file" /tmp/fdacs.allowed >/dev/null; done < /tmp/fdacs.changed
            git add -- \
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
              docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
            git diff --cached --check
            git commit -m "ci(compliance): refresh FDACS PII audit"
          fi
          test -z "$(git status --porcelain)"
          npm run verify:fdacs-pii-audit

      - name: Verify final clean evidence graph and Apps contract
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm run verify:cmmc-evidence
          node --test test/applications-before-filesystem-routing-contract.test.mjs
          git diff --check

      - name: Push verified clean convergence commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/apps-private-boundary-main-20260820
