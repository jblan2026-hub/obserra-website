name: Marketplace v1.2 source inventory current

on:
  push:
    branches:
      - ops/marketplace-v12-release-inventory-20260824
    paths:
      - .github/workflows/marketplace-v12-source-inventory-current.yml

permissions:
  contents: write
  id-token: write

env:
  AZURE_CLIENT_ID: b8da232a-713f-4c25-a61e-4fb34d13e229
  AZURE_TENANT_ID: 7d8b7b64-c80c-4c8a-a514-66f6b1cf8607
  AZURE_SUBSCRIPTION_ID: 38d660ff-611e-4f6c-ad29-70f5cf118f52
  AZURE_STORAGE_ACCOUNT: stobserramktv1238d660
  AZURE_SOURCE_CONTAINER: marketplace-v12-source
  OBSERVATION_BRANCH: ops/marketplace-v12-release-inventory-20260824

jobs:
  inventory:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Authenticate Marketplace delivery identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Inventory source blobs
        shell: bash
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/source.json"
          receipt="${RUNNER_TEMP}/receipt.json"
          az storage blob list --auth-mode login --account-name "${AZURE_STORAGE_ACCOUNT}" --container-name "${AZURE_SOURCE_CONTAINER}" --include m --num-results '*' --output json --only-show-errors >"${inventory}"
          jq '{contract:"obserra-marketplace-v12-source-inventory-v1", sourceBlobCount:length, sourceZipCount:([.[] | select(.name|endswith(".zip"))]|length), blobs:[.[] | {name, bytes:(.properties.contentLength // 0), sha256:(.metadata.sha256 // null)}]}' "${inventory}" >"${receipt}"
          cat "${receipt}"

      - name: Publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          content=open(os.path.join(os.environ['RUNNER_TEMP'],'receipt.json'),'rb').read()
          repo='jblan2026-hub/obserra-website'; branch=os.environ['OBSERVATION_BRANCH']; path='ops/marketplace-v12-source-inventory-current.json'; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-source-inventory','Content-Type':'application/json'}
          encoded=urllib.parse.quote(path,safe='/'); sha=None
          get_url=f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}'
          try:
            with urllib.request.urlopen(urllib.request.Request(get_url,headers=headers),timeout=30) as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code != 404: raise
          body={'message':'ops: record current Marketplace source inventory','content':base64.b64encode(content).decode(),'branch':branch}
          if sha: body['sha']=sha
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
            if r.status not in (200,201): raise SystemExit(r.status)
          PY
