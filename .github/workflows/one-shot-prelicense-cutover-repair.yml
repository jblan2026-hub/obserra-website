name: One-shot prelicense cutover repair

on:
  push:
    branches:
      - fix/vercel-prelicense-cutover-20260821

permissions:
  contents: write

concurrency:
  group: one-shot-prelicense-cutover-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'jblan2026-hub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-prelicense-cutover-20260821
          fetch-depth: 0

      - name: Patch cutover preflight and add regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/production-vercel-public-cutover.yml')
          text = workflow.read_text()

          old_commerce = '''          test "${commerce_status}" = "200"
          jq -e '\''
            .contract == "academy-commerce-health-v1" and
            .operational == true and
            .paymentProvider == "stripe" and
            .providerVerification.environment == "live" and
            .providerVerification.connected == true and
            .providerVerification.chargesEnabled == true and
            .webhookVerification == "required" and
            .identity == "available" and
            .identityEnvironment == "live" and
            .durableStorage == "available" and
            .storageSchema == "academy-durable-state-v2" and
            .purchaserIdentityHashing == "available" and
            .fulfillment.idempotencyKey == "stripe-event-id" and
            .fulfillment.auditLedger == "durable-supabase"
          '\'' "${commerce_body}" >/dev/null
'''

          new_commerce = '''          if [ "${commerce_status}" = "200" ]; then
            jq -e '\''
              .contract == "academy-commerce-health-v1" and
              .operational == true and
              .paymentProvider == "stripe" and
              .providerVerification.environment == "live" and
              .providerVerification.connected == true and
              .providerVerification.chargesEnabled == true and
              .webhookVerification == "required" and
              .identity == "available" and
              .identityEnvironment == "live" and
              .durableStorage == "available" and
              .storageSchema == "academy-durable-state-v2" and
              .purchaserIdentityHashing == "available" and
              .fulfillment.idempotencyKey == "stripe-event-id" and
              .fulfillment.auditLedger == "durable-supabase"
            '\'' "${commerce_body}" >/dev/null
          elif [ "${commerce_status}" = "503" ]; then
            jq -e '\''
              .contract == "academy-commerce-health-v1" and
              .operational == false and
              .identity == "available" and
              .identityEnvironment == "live"
            '\'' "${commerce_body}" >/dev/null

            attempt_id="$(cat /proc/sys/kernel/random/uuid)"
            issued_at="$(date +%s)"
            candidate_checkout_headers="$(mktemp)"
            candidate_checkout_body="$(mktemp)"
            candidate_checkout_status="$(curl --silent --show-error --max-time 20 \\
              --output "${candidate_checkout_body}" \\
              --dump-header "${candidate_checkout_headers}" \\
              --write-out '\''%{http_code}'\'' \\
              --request POST \\
              --header "Origin: ${CANDIDATE_URL}" \\
              --header "Content-Type: application/x-www-form-urlencoded" \\
              --data-urlencode "course=zero-trust-strategy" \\
              --data-urlencode "checkoutAttemptId=${attempt_id}" \\
              --data-urlencode "checkoutAttemptIssuedAt=${issued_at}" \\
              "${CANDIDATE_URL}/api/academy/checkout")"
            test "${candidate_checkout_status}" = "307"
            grep -i '\''^location: .*enrollment=licensing-pending'\'' "${candidate_checkout_headers}" >/dev/null
            grep -i '\''^x-obserra-sales-license: pending'\'' "${candidate_checkout_headers}" >/dev/null
          else
            echo "::error::Academy commerce health returned unexpected HTTP ${commerce_status}."
            exit 1
          fi
'''

          old_florida = '''          florida_ready="$(mktemp)"
          florida_ready_status="$(curl --silent --show-error --max-time 30 \\
            --output "${florida_ready}" \\
            --write-out '\''%{http_code}'\'' \\
            "${CANDIDATE_URL}/api/florida-class-d/health/ready")"
          test "${florida_ready_status}" = "200"
          jq -e '\''.service == "florida-class-d-lms" and .status == "ready"'\'' "${florida_ready}" >/dev/null
'''

          new_florida = '''          florida_ready="$(mktemp)"
          florida_ready_headers="$(mktemp)"
          florida_ready_status="$(curl --silent --show-error --max-time 30 \\
            --output "${florida_ready}" \\
            --dump-header "${florida_ready_headers}" \\
            --write-out '\''%{http_code}'\'' \\
            "${CANDIDATE_URL}/api/florida-class-d/health/ready")"
          if [ "${florida_ready_status}" = "200" ]; then
            jq -e '\''.service == "florida-class-d-lms" and .status == "ready"'\'' "${florida_ready}" >/dev/null
          elif [ "${florida_ready_status}" = "503" ]; then
            jq -e '\''.service == "florida-class-d-lms" and .status == "not_ready"'\'' "${florida_ready}" >/dev/null
            grep -Eqi '\''^retry-after:[[:space:]]*[0-9]+'\'' "${florida_ready_headers}"
          else
            echo "::error::Florida Class D readiness returned unexpected HTTP ${florida_ready_status}."
            exit 1
          fi
'''

          if text.count(old_commerce) != 1:
              raise SystemExit('commerce preflight anchor mismatch')
          if text.count(old_florida) != 1:
              raise SystemExit('Florida readiness preflight anchor mismatch')
          text = text.replace(old_commerce, new_commerce)
          text = text.replace(old_florida, new_florida)
          workflow.write_text(text)

          test = Path('test/production-vercel-public-cutover-contract.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst workflow = fs.readFileSync(".github/workflows/production-vercel-public-cutover.yml", "utf8");\n\ntest("public cutover accepts only ready or explicitly fail-closed regulated modules", () => {\n  assert.match(workflow, /if \[ "\\$\\{commerce_status\\}" = "200" \]; then/);\n  assert.match(workflow, /elif \[ "\\$\\{commerce_status\\}" = "503" \]; then/);\n  assert.match(workflow, /\\.operational == false/);\n  assert.match(workflow, /\\.identity == "available"/);\n  assert.match(workflow, /\\.identityEnvironment == "live"/);\n  assert.match(workflow, /candidate_checkout_status/);\n  assert.match(workflow, /enrollment=licensing-pending/);\n  assert.match(workflow, /x-obserra-sales-license: pending/);\n  assert.match(workflow, /elif \[ "\\$\\{florida_ready_status\\}" = "503" \]; then/);\n  assert.match(workflow, /status == "not_ready"/);\n  assert.match(workflow, /retry-after:/i);\n});\n\ntest("domain move remains after exact deployment preflight and rollback remains mandatory", () => {\n  const preflight = workflow.indexOf("- name: Preflight exact canonical deployment health");\n  const move = workflow.indexOf("- name: Move canonical domains to production project");\n  const rollback = workflow.indexOf("- name: Roll back canonical domains on failed cutover");\n  assert.ok(preflight >= 0 && move > preflight, "domain move must follow preflight");\n  assert.ok(rollback > move, "rollback must remain after the move/smoke phase");\n});\n\ntest("release workflow never enables Academy sales or claims Florida readiness", () => {\n  assert.doesNotMatch(workflow, /ACADEMY_SALES_LICENSED\\s*=\\s*true/);\n  assert.doesNotMatch(workflow, /OBSERRA_FDACS_LIVE_READY\\s*=\\s*true/);\n});\n''')
          PY

      - name: Validate patched release contract
        shell: bash
        run: |
          set -euo pipefail
          node --test test/production-vercel-public-cutover-contract.test.mjs
          git diff --check

      - name: Commit only governed release-gate files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-prelicense-cutover-repair.yml
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/one-shot-prelicense-cutover-repair.yml' \
            '.github/workflows/production-vercel-public-cutover.yml' \
            'test/production-vercel-public-cutover-contract.test.mjs' | sort)"
          test "${changed}" = "${expected}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): allow fail-closed modules during public cutover"
          git push origin HEAD:fix/vercel-prelicense-cutover-20260821
