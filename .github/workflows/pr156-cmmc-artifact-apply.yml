name: PR156 CMMC Artifact Apply

on:
  push:
    branches:
      - hotfix/fdacs-pr156-artifact-apply-20260820
    paths:
      - .github/workflows/pr156-cmmc-artifact-apply.yml

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Verify and apply exact PR156 CMMC remediation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/apps-private-boundary-main-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Require unchanged PR head
        shell: bash
        run: |
          set -euo pipefail
          expected="4ca1879da9a47f9c516500a791609edcf3d8082e"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Download exact CI remediation artifact
        uses: actions/download-artifact@v4
        with:
          name: cmmc-system-evidence-remediation
          path: /tmp/cmmc-remediation
          github-token: ${{ github.token }}
          repository: jblan2026-hub/obserra-website
          run-id: 32408824159

      - name: Verify remediation artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cmmc-remediation
          echo "1b0cceb2f8227bb34f6ec5aaeda4a8cd7905126ff70f5f0dd178a062b7a93a1a  CMMC-SYSTEM-EVIDENCE.json" | sha256sum --check --strict
          echo "27d97c92fff5ead986cfa0a54c4c4f9bf1b412c33775af4c488a2e6de2a343f7  CMMC-SYSTEM-EVIDENCE.md" | sha256sum --check --strict
          echo "b4a26dd12168b2d53a6a1c5e2b8a248f21ff190aabb40962c532669ad51dc1e5  CMMC-SYSTEM-EVIDENCE.sha256" | sha256sum --check --strict

      - name: Apply generated remediation only
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 /tmp/cmmc-remediation/CMMC-SYSTEM-EVIDENCE.json docs/compliance/CMMC-SYSTEM-EVIDENCE.json
          install -m 0644 /tmp/cmmc-remediation/CMMC-SYSTEM-EVIDENCE.md docs/compliance/CMMC-SYSTEM-EVIDENCE.md
          install -m 0644 /tmp/cmmc-remediation/CMMC-SYSTEM-EVIDENCE.sha256 docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          git diff --name-only | sort > /tmp/changed-files.txt
          printf '%s\n' \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 | sort > /tmp/allowed-files.txt
          diff -u /tmp/allowed-files.txt /tmp/changed-files.txt

      - name: Verify CMMC system evidence before persistence
        run: node scripts/cmmc-system-evidence.mjs --check

      - name: Commit verified generated remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          git diff --cached --check
          git commit -m "ci(compliance): apply exact PR156 CMMC remediation"
          git push origin HEAD:fix/apps-private-boundary-main-20260820
