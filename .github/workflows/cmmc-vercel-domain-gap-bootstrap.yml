name: Vercel Domain Ownership Evidence Bootstrap

on:
  push:
    branches:
      - docs/vercel-domain-ownership-gap
    paths:
      - "docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.json"
      - "scripts/cmmc-level2-rev3-production-evidence.mjs"
      - ".github/workflows/cmmc-vercel-domain-gap-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: docs/vercel-domain-ownership-gap
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate corrected production evidence
        run: node scripts/cmmc-level2-rev3-production-evidence.mjs --write
      - name: Verify corrected production evidence
        run: node scripts/cmmc-level2-rev3-production-evidence.mjs --check
      - name: Commit generated artifacts
        run: |
          status="$(git status --porcelain -- docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.md docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.sha256)"
          if [ -z "$status" ]; then
            echo "Generated evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.md docs/florida-class-d-lms/CMMC-LEVEL-2-REV3-PRODUCTION-EVIDENCE.sha256
          git commit -m "compliance: regenerate Vercel domain ownership evidence"
          git push origin HEAD:docs/vercel-domain-ownership-gap
