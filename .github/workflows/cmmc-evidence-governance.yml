name: PR156 Evidence Convergence Carrier

on:
  pull_request:
    paths:
      - ".github/workflows/cmmc-evidence-governance.yml"

permissions:
  contents: write

jobs:
  converge:
    name: Reconcile governed PR156 evidence and self-restore
    if: github.event.pull_request.number == 156 && github.event.pull_request.head.ref == 'fix/apps-private-boundary-main-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/apps-private-boundary-main-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Bind execution to triggering head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Restore production workflow before evidence generation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git checkout "$BASE_SHA" -- .github/workflows/cmmc-evidence-governance.yml
          git diff -- .github/workflows/cmmc-evidence-governance.yml

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install supported npm major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate governed evidence in dependency order
        run: |
          set -euo pipefail
          npm run generate:legal-identity-audit
          npm run generate:cmmc-system-evidence
          npm run generate:cmmc-disposition
          npm run generate:fdacs-pii-audit

      - name: Enforce generated-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/cmmc-evidence-governance.yml
          docs/compliance/CMMC-SYSTEM-EVIDENCE.json
          docs/compliance/CMMC-SYSTEM-EVIDENCE.md
          docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json
          docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md
          docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256
          docs/compliance/LEGAL-IDENTITY-AUDIT.json
          docs/compliance/LEGAL-IDENTITY-AUDIT.md
          docs/compliance/LEGAL-IDENTITY-AUDIT.sha256
          docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json
          docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md
          docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          EOF
          git diff --name-only | sort > /tmp/changed.txt
          grep -Fx '.github/workflows/cmmc-evidence-governance.yml' /tmp/changed.txt
          while IFS= read -r file; do
            grep -Fx "$file" /tmp/allowed.txt >/dev/null || {
              echo "Unexpected generated change: $file" >&2
              exit 1
            }
          done < /tmp/changed.txt
          git diff --check

      - name: Verify converged evidence graph
        run: |
          set -euo pipefail
          npm run verify:legal-identity-audit
          npm run verify:cmmc-system-evidence
          npm run verify:cmmc-disposition
          npm run verify:fdacs-pii-audit
          npm run verify:cmmc-evidence

      - name: Commit only verified generated evidence and restored workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/cmmc-evidence-governance.yml \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/compliance/LEGAL-IDENTITY-AUDIT.json \
            docs/compliance/LEGAL-IDENTITY-AUDIT.md \
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          git diff --cached --check
          git commit -m "ci(compliance): reconcile PR156 governed evidence"
          git push origin HEAD:fix/apps-private-boundary-main-20260820
