name: CMMC Evidence Governance

# TEMPORARILY NON-BLOCKING by owner authorization on 2026-08-21.
# Preserve this workflow/check name so existing branch-protection rules do not
# deadlock while CMMC enforcement is paused. Historical evidence, scripts, and
# control mappings remain in the repository and can be re-enabled deliberately.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmmc-evidence-paused-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-contract:
    name: Verify fail-closed evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: CMMC enforcement temporarily paused
        run: |
          echo "CMMC evidence governance is temporarily NON-BLOCKING by owner authorization."
          echo "No CMMC compliance claim is being made by this workflow."
          echo "Historical CMMC evidence and generators remain preserved for later reactivation."
