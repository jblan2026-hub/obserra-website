name: Branch Validation

on:
  push:
    branches:
      - agent/catalog-subscription-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and static quality
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Macro platform readiness gate
        run: npm run test:platform

      - name: Security resilience and rollback gate
        run: npm run test:security-resilience

      - name: Operational commerce lifecycle and live control room gate
        run: npm run test:operational-release

      - name: Browser asset accessibility and security gate
        run: npm run test:browser-integrity

      - name: Software supply chain readiness gate
        run: npm run test:supply-chain

      - name: Operational service level readiness gate
        run: npm run test:operational-slo

      - name: Data protection and privacy readiness gate
        run: npm run test:data-protection

      - name: AI governance and reliability readiness gate
        run: npm run test:ai-governance

      - name: Commerce and credential integrity readiness gate
        run: npm run test:commerce-credential

      - name: Standalone SaaS catalog readiness gate
        run: npm run test:saas-catalog

      - name: SaaS tenant and entitlement control plane gate
        run: npm run test:saas-control-plane

      - name: SaaS billing lifecycle and persistence gate
        run: npm run test:saas-billing-control-plane

      - name: SaaS usage metering and quota gate
        run: npm run test:saas-usage-metering

      - name: SaaS owner operations and audit gate
        run: npm run test:saas-owner-operations

      - name: SaaS customer subscription summary gate
        run: npm run test:saas-subscription-summary

      - name: Standalone SaaS access-token security gate
        run: npm run test:saas-access-token

      - name: SaaS access-token key rotation gate
        run: npm run test:saas-token-key-rotation

      - name: Rollback and release evidence gate
        run: npm run test:rollback-readiness

      - name: Production build
        run: npm run build

      - name: Verify no generated source drift
        run: git diff --exit-code

  deployed-system-gates:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify browser asset accessibility and security integrity
        run: npm run test:browser-integrity

      - name: Verify software supply chain readiness
        run: npm run test:supply-chain

      - name: Verify operational service level readiness
        run: npm run test:operational-slo

      - name: Verify data protection and privacy readiness
        run: npm run test:data-protection

      - name: Verify AI governance and reliability readiness
        run: npm run test:ai-governance

      - name: Verify commerce and credential integrity readiness
        run: npm run test:commerce-credential

      - name: Verify standalone SaaS catalog readiness
        run: npm run test:saas-catalog

      - name: Verify SaaS tenant and entitlement control plane
        run: npm run test:saas-control-plane

      - name: Verify SaaS billing lifecycle and persistence
        run: npm run test:saas-billing-control-plane

      - name: Verify SaaS usage metering and quotas
        run: npm run test:saas-usage-metering

      - name: Verify SaaS owner operations and audit controls
        run: npm run test:saas-owner-operations

      - name: Verify SaaS customer subscription summary
        run: npm run test:saas-subscription-summary

      - name: Verify standalone SaaS access-token security
        run: npm run test:saas-access-token

      - name: Verify SaaS access-token key rotation
        run: npm run test:saas-token-key-rotation

      - name: Verify rollback and release evidence
        run: npm run test:rollback-readiness

      - name: Verify shared contracts across all targets
        env:
          OBSERRA_WEBSITE_LIVE_URL: ${{ secrets.OBSERRA_WEBSITE_LIVE_URL }}
          OBSERRA_WEBSITE_LCN2_URL: ${{ secrets.OBSERRA_WEBSITE_LCN2_URL }}
          OBSERRA_INTEGRATED_SERVICES_URL: ${{ secrets.OBSERRA_INTEGRATED_SERVICES_URL }}
        run: npm run test:cross-target

      - name: Verify primary website customer and owner journeys
        env:
          OBSERRA_BASE_URL: ${{ secrets.OBSERRA_WEBSITE_LIVE_URL }}
        run: npm run test:journey

      - name: Verify primary website HA performance isolation
        env:
          OBSERRA_BASE_URL: ${{ secrets.OBSERRA_WEBSITE_LIVE_URL }}
        run: npm run test:performance-isolation

      - name: Verify secondary website customer and owner journeys
        env:
          OBSERRA_BASE_URL: ${{ secrets.OBSERRA_WEBSITE_LCN2_URL }}
        run: npm run test:journey

      - name: Verify secondary website HA performance isolation
        env:
          OBSERRA_BASE_URL: ${{ secrets.OBSERRA_WEBSITE_LCN2_URL }}
        run: npm run test:performance-isolation

      - name: Verify integrated services customer and owner journeys
        env:
          OBSERRA_BASE_URL: ${{ secrets.OBSERRA_INTEGRATED_SERVICES_URL }}
        run: npm run test:journey

      - name: Verify integrated services HA performance isolation
        env:
          OBSERRA_BASE_URL: ${{ secrets.OBSERRA_INTEGRATED_SERVICES_URL }}
        run: npm run test:performance-isolation
