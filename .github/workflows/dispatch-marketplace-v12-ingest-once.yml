name: Dispatch Marketplace v1.2 ingest once

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/dispatch-marketplace-v12-ingest-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch governed protected-delivery ingest on main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: a2a105526cc0aea729db6dc879fb11731258fdc9
          CATALOG_REVISION: 487043cc23975012e83764a9a0f258f9ff705ab656084be558e76fa64f47faf2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          url = "https://api.github.com/repos/jblan2026-hub/obserra-website/actions/workflows/marketplace-v12-protected-delivery.yml/dispatches"
          payload = {
              "ref": "main",
              "inputs": {
                  "mode": "ingest",
                  "expected_commit": os.environ["TARGET_SHA"],
                  "approved_catalog_revision": os.environ["CATALOG_REVISION"],
              },
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "obserra-marketplace-ingest-dispatch",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"unexpected dispatch status: {response.status}")
          print("Governed Marketplace v1.2 ingest dispatched for approved main SHA.")
          PY
