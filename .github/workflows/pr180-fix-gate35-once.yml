name: PR180 fix Gate35 identity contract once

on:
  push:
    branches:
      - fix/academy-commerce-health-identity-readiness-20260821

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/academy-commerce-health-identity-readiness-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply exact Gate 35 contract correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/academy-durable-commerce-gate.mjs')
          s = p.read_text()
          old = '''  "academyPurchaserHashConfigured",
  "identity.configured",
  'status: operational ? 200 : 503','''
          new = '''  "academyPurchaserHashConfigured",
  "prepareClerkRuntime",
  "identity.ready",
  'status: operational ? 200 : 503','''
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale commerce-health identity assertion, found {s.count(old)}')
          s = s.replace(old, new, 1)
          anchor = ''']) {
  requireText(commerceHealthFile, commerceHealth, text, "live Academy commerce health contract");
}
'''
          replacement = ''']) {
  requireText(commerceHealthFile, commerceHealth, text, "live Academy commerce health contract");
}
forbidText(commerceHealthFile, commerceHealth, "safeIdentity", "session-level identity dependency in public Academy commerce health");
'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected commerce-health contract loop anchor once, found {s.count(anchor)}')
          p.write_text(s.replace(anchor, replacement, 1))
          PY

      - name: Prove Gate 35 and targeted regression GREEN
        shell: bash
        run: |
          set -euo pipefail
          node --test test/academy-commerce-health-identity-readiness.test.mjs
          npm run verify:academy-durable-commerce

      - name: Remove helper and commit only gate source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr180-fix-gate35-once.yml
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/pr180-fix-gate35-once.yml' 'scripts/academy-durable-commerce-gate.mjs' | sort)"
          test "${changed}" = "${expected}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/academy-durable-commerce-gate.mjs .github/workflows/pr180-fix-gate35-once.yml
          git commit -m "test(academy): align Gate 35 Clerk readiness contract"
          git push origin HEAD:fix/academy-commerce-health-identity-readiness-20260821
