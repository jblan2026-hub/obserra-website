name: Marketplace v1.2 ingest observe once

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-observe-20260824
    paths:
      - .github/workflows/marketplace-v12-ingest-observe-once.yml

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_SHA: 3c4e9bc8a7405f2f8e78fcdc27faf847d1d63fe5
      OBSERVATION_BRANCH: ops/marketplace-v12-ingest-observe-20260824
      CATALOG_REVISION: 487043cc23975012e83764a9a0f258f9ff705ab656084be558e76fa64f47faf2
    steps:
      - name: Observe governed six-source ingest and record terminal evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "jblan2026-hub/obserra-website"
          workflow = "marketplace-v12-six-source-protected-delivery.yml"
          target = os.environ["TARGET_SHA"]
          branch = os.environ["OBSERVATION_BRANCH"]
          revision = os.environ["CATALOG_REVISION"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "obserra-marketplace-ingest-observer-v2",
          }

          def request(url, *, method="GET", body=None, timeout=60):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers={**headers, **({"Content-Type": "application/json"} if data else {})})
              return urllib.request.urlopen(req, timeout=timeout)

          cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=2)
          run = None
          for _ in range(120):
              runs_url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?event=workflow_dispatch&branch=main&per_page=30"
              with request(runs_url) as response:
                  runs = json.load(response).get("workflow_runs", [])
              candidates = []
              for item in runs:
                  title = str(item.get("display_title") or "")
                  created = item.get("created_at")
                  try:
                      created_at = dt.datetime.fromisoformat(created.replace("Z", "+00:00")) if created else cutoff
                  except Exception:
                      created_at = cutoff
                  if target in title and "ingest" in title.lower() and created_at >= cutoff:
                      candidates.append(item)
              if candidates:
                  run = sorted(candidates, key=lambda item: item.get("id", 0), reverse=True)[0]
                  break
              time.sleep(5)
          if run is None:
              raise SystemExit("ingest run for target SHA was not discoverable")

          run_id = int(run["id"])
          run_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          for _ in range(660):
              with request(run_url) as response:
                  run = json.load(response)
              if run.get("status") == "completed":
                  break
              time.sleep(10)
          else:
              raise SystemExit("protected-delivery ingest did not complete inside observer window")

          jobs_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          with request(jobs_url) as response:
              jobs = json.load(response).get("jobs", [])

          failure_step = None
          job_id = None
          step_conclusions = {}
          for job in jobs:
              if job.get("name") == "protected-delivery":
                  job_id = int(job["id"])
                  for step in job.get("steps", []):
                      step_conclusions[str(step.get("name"))] = step.get("conclusion")
                      if failure_step is None and step.get("conclusion") == "failure":
                          failure_step = step.get("name")
                  break

          blocker = None
          if job_id is not None and run.get("conclusion") == "failure":
              logs_url = f"https://api.github.com/repos/{repo}/actions/jobs/{job_id}/logs"
              try:
                  with request(logs_url, timeout=120) as response:
                      text = response.read().decode("utf-8", errors="replace")
                  patterns = [
                      (r"BlobNotFound|The specified blob does not exist", "SOURCE_BLOB_NOT_FOUND"),
                      (r"AuthorizationPermissionMismatch|AuthorizationFailure", "AZURE_AUTHORIZATION_FAILURE"),
                      (r"Required protected-delivery binding metadata is unavailable", "KEY_VAULT_BINDING_UNAVAILABLE"),
                      (r"stripe-evidence|verifiedOfferBindings|stripeAccountChargesEnabled", "STRIPE_BINDING_VERIFICATION_FAILED"),
                      (r"durableLedgerVerified|entitlementAuthority", "LEDGER_VERIFICATION_FAILED"),
                      (r"protectedArtifactSetComplete|requiredProducts", "PROTECTED_ARTIFACT_INGEST_FAILED"),
                      (r"length == 11390|release-inventory", "RELEASE_INVENTORY_VERIFICATION_FAILED"),
                      (r"commerce-health|activationBlocked|protectedDeliveryConfigured", "CANONICAL_COMMERCE_HEALTH_FAILED"),
                  ]
                  for pattern, code in patterns:
                      if re.search(pattern, text, re.IGNORECASE):
                          blocker = code
                          break
              except Exception:
                  blocker = None

          success = run.get("conclusion") == "success"
          receipt = {
              "contract": "obserra-marketplace-v12-six-source-ingest-observation-v2",
              "runId": run_id,
              "runUrl": run.get("html_url"),
              "targetSha": target,
              "catalogRevision": revision,
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "failureStep": failure_step,
              "blocker": blocker,
              "sourceDownloadPassed": step_conclusions.get("Download and verify exactly six sellable source archives") == "success",
              "materializationPassed": step_conclusions.get("Materialize and integrity-check all 11,390 product artifacts") == "success",
              "stripeLedgerAndIngestPassed": step_conclusions.get("Verify live Stripe authority, durable ledger, and ingest protected artifacts") == "success",
              "runtimeEvidencePublished": step_conclusions.get("Publish exact Marketplace runtime activation evidence to Key Vault") == "success",
              "releaseInventoryVerified": step_conclusions.get("Verify exact protected release inventory") == "success",
              "canonicalCommerceHealthVerified": step_conclusions.get("Verify canonical production commerce health") == "success",
              "productionActivationVerified": success,
              "observedAt": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
          }

          content = (json.dumps(receipt, indent=2) + "\n").encode("utf-8")
          path = "ops/marketplace-v12-ingest-observation-latest.json"
          encoded = urllib.parse.quote(path, safe="/")
          get_url = f"https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch, safe='')}"
          sha = None
          try:
              with request(get_url) as response:
                  sha = json.load(response).get("sha")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          body = {
              "message": "ops: record Marketplace v1.2 ingest observation",
              "content": base64.b64encode(content).decode("ascii"),
              "branch": branch,
          }
          if sha:
              body["sha"] = sha
          put_url = f"https://api.github.com/repos/{repo}/contents/{encoded}"
          with request(put_url, method="PUT", body=body) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"unexpected receipt write status {response.status}")

          print(json.dumps(receipt, sort_keys=True))
          PY
