name: Dispatch Marketplace live authority rerun once

on:
  push:
    branches: [ops/marketplace-v12-ingest-dispatch-20260823]
    paths:
      - ".github/workflows/dispatch-marketplace-live-authority-rerun-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Dispatch production variable convergence and Stripe authority migration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo='jblan2026-hub/obserra-website'; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-authority-dispatch','Content-Type':'application/json'}
          for workflow in ('converge-marketplace-production-variables.yml','migrate-marketplace-v12-stripe-authority.yml'):
              url=f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches'
              body=json.dumps({'ref':'main'}).encode()
              req=urllib.request.Request(url,data=body,method='POST',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  if response.status != 204: raise SystemExit(f'{workflow}: dispatch status {response.status}')
              print(f'dispatched {workflow}')
          PY

      - name: Observe terminal workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request
          repo='jblan2026-hub/obserra-website'; branch='ops/marketplace-v12-ingest-dispatch-20260823'; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-authority-observer','Content-Type':'application/json'}
          workflows=['converge-marketplace-production-variables.yml','migrate-marketplace-v12-stripe-authority.yml']
          terminal={}
          deadline=time.time()+1800
          while time.time()<deadline and len(terminal)<len(workflows):
              for workflow in workflows:
                  if workflow in terminal: continue
                  url=f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&event=workflow_dispatch&per_page=3'
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:
                      runs=json.load(response).get('workflow_runs',[])
                  if not runs: continue
                  run=runs[0]
                  if run.get('status')=='completed':
                      jobs_url=run['jobs_url']+'?per_page=100'
                      with urllib.request.urlopen(urllib.request.Request(jobs_url,headers=headers),timeout=30) as response:
                          jobs=json.load(response).get('jobs',[])
                      terminal[workflow]={
                          'runId':run['id'],'status':run['status'],'conclusion':run.get('conclusion'),'htmlUrl':run.get('html_url'),
                          'headSha':run.get('head_sha'),'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion')} for s in j.get('steps',[])]} for j in jobs]
                      }
              if len(terminal)<len(workflows): time.sleep(10)
          if len(terminal)!=len(workflows):
              terminal['observerError']='Timed out before both workflows reached terminal state.'
          content=(json.dumps({'contract':'obserra-marketplace-live-authority-rerun-observation-v1','workflows':terminal},indent=2)+'\n').encode()
          path='ops/marketplace-v12-live-authority-rerun.json'; encoded=urllib.parse.quote(path,safe='/')
          get=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}',headers=headers); sha=None
          try:
              with urllib.request.urlopen(get,timeout=30) as response: sha=json.load(response).get('sha')
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
          body={'message':'ops: record Marketplace live authority rerun','content':base64.b64encode(content).decode(),'branch':branch}
          if sha: body['sha']=sha
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(put,timeout=30) as response:
              if response.status not in (200,201): raise SystemExit(response.status)
          PY
