name: Apply Marketplace v1.2 Azure protected delivery cutover

on:
  push:
    branches:
      - fix/marketplace-v12-azure-protected-delivery-20260823
    paths:
      - .github/workflows/patch-marketplace-v12-azure-delivery.yml
      - .github/scripts/patch-marketplace-v12-azure-delivery.py
      - .github/scripts/fix-marketplace-v12-azure-ingest-metadata.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/marketplace-v12-azure-protected-delivery-20260823
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Pin Azure Blob SDK
        run: npm install --save-exact --ignore-scripts @azure/storage-blob@12.33.0

      - name: Apply provider cutover
        run: python .github/scripts/patch-marketplace-v12-azure-delivery.py

      - name: Correct Azure metadata syntax
        run: python .github/scripts/fix-marketplace-v12-azure-ingest-metadata.py

      - name: Validate generated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check scripts/marketplace-v12-artifact-ingest-azure.mjs
          node --check scripts/marketplace-v12-runtime-evidence.mjs

      - name: Commit provider cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            scripts/marketplace-v12-artifact-ingest-azure.mjs \
            lib/production-runtime-secrets.ts \
            lib/ai-marketplace-delivery.ts \
            lib/marketplace-v12-azure-delivery.ts \
            lib/marketplace-v12-install-bridge.ts \
            app/api/ai-marketplace/download/route.ts \
            app/api/ai-marketplace/install-grant/exchange/route.ts \
            scripts/marketplace-v12-runtime-evidence.mjs \
            .github/workflows/bootstrap-marketplace-v12-azure-source.yml \
            .github/workflows/marketplace-v12-protected-delivery.yml \
            test/marketplace-runtime-key-vault.test.mjs \
            test/marketplace-v12-production-commerce-hardening.test.mjs \
            test/marketplace-runtime-protected-delivery.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No provider cutover changes required."
            exit 0
          fi
          git commit -m "fix: move Marketplace protected delivery to Azure Blob OAuth"
          git push origin HEAD:fix/marketplace-v12-azure-protected-delivery-20260823

