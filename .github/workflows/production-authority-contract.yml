name: Production Authority Contract

on:
  pull_request:
    paths:
      - "lib/auth/runtime-config.ts"
      - "scripts/vercel-ignore-build.sh"
      - ".github/workflows/production-vercel-public-cutover.yml"
      - ".github/workflows/production-e2e-operational-gate.yml"
      - "scripts/florida-class-d-website-academy-commerce-gate.mjs"
      - "scripts/cmmc-level2-rev3-production-evidence.mjs"
      - "test/vercel-ignore-build.test.mjs"
      - "test/vercel-production-authority-consistency.test.mjs"
      - ".github/workflows/production-authority-contract.yml"

permissions:
  contents: read

concurrency:
  group: production-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Run Vercel production authority consistency contract
        run: node --test test/vercel-production-authority-consistency.test.mjs
