name: Observe Marketplace v1.2 Stripe migration

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/observe-marketplace-v12-stripe-migration.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture latest migration run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.parse
          repo='jblan2026-hub/obserra-website'
          workflow='migrate-marketplace-v12-stripe-authority.yml'
          token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-stripe-migration-observer'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=5',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          runs=[]
          for x in data.get('workflow_runs',[]):
              runs.append({k:x.get(k) for k in ['id','name','display_title','event','status','conclusion','head_branch','head_sha','run_number','created_at','updated_at','html_url']})
          out=(json.dumps({'workflow':workflow,'runs':runs},indent=2)+'\n').encode()
          path='ops/marketplace-v12-stripe-migration-observation.json'; branch='ops/marketplace-v12-ingest-dispatch-20260823'
          encoded=urllib.parse.quote(path,safe='/')
          get=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}',headers=headers); sha=None
          try:
              with urllib.request.urlopen(get,timeout=30) as r: sha=json.load(r).get('sha')
          except Exception as e:
              if getattr(e,'code',None)!=404: raise
          body={'message':'ops: record Stripe migration observation','content':base64.b64encode(out).decode(),'branch':branch}
          if sha: body['sha']=sha
          put_headers={**headers,'Content-Type':'application/json'}
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=put_headers)
          with urllib.request.urlopen(put,timeout=30) as r:
              if r.status not in (200,201): raise SystemExit(r.status)
          PY
