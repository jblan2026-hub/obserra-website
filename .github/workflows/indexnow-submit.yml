name: IndexNow Production Discovery

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Website CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: indexnow-production-discovery
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Allow production deployment to settle
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: Submit canonical production URLs to IndexNow
        run: node scripts/indexnow-submit.mjs
