name: Observe Marketplace v1.2 Azure cutover patch

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/observe-marketplace-v12-azure-cutover.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record Azure cutover patch state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo='jblan2026-hub/obserra-website'; workflow='patch-marketplace-v12-azure-delivery.yml'; branch='fix/marketplace-v12-azure-protected-delivery-20260823'; out_branch='ops/marketplace-v12-ingest-dispatch-20260823'; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-azure-cutover-observer','Content-Type':'application/json'}
          def req(url): return urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30)
          with req(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch={urllib.parse.quote(branch,safe="")}&per_page=5') as r: runs=json.load(r).get('workflow_runs',[])
          if not runs: raise SystemExit('No Azure cutover workflow run found')
          run=runs[0]; jobs=[]; blocker=None
          with req(run['jobs_url']+'?per_page=100') as r: raw_jobs=json.load(r).get('jobs',[])
          for job in raw_jobs:
            steps=[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion')} for s in job.get('steps',[])]
            jobs.append({'id':job.get('id'),'name':job.get('name'),'status':job.get('status'),'conclusion':job.get('conclusion'),'steps':steps})
            if run.get('conclusion')=='failure':
              try:
                with req(f'https://api.github.com/repos/{repo}/actions/jobs/{job["id"]}/logs') as lr: text=lr.read().decode('utf-8',errors='replace')
              except Exception: text=''
              safe=[]
              for line in text.splitlines():
                if 'expected 1 occurrence' in line or 'expected 1 regex occurrence' in line or 'Process completed with exit code' in line or 'npm error' in line:
                  safe.append(line[-400:])
              if safe: blocker=safe[-1]
          receipt={'contract':'obserra-marketplace-v12-azure-cutover-observation-v1','runId':run.get('id'),'runUrl':run.get('html_url'),'status':run.get('status'),'conclusion':run.get('conclusion'),'headSha':run.get('head_sha'),'jobs':jobs,'blocker':blocker}
          content=(json.dumps(receipt,indent=2)+'\n').encode(); path='ops/marketplace-v12-azure-cutover-observation.json'; encoded=urllib.parse.quote(path,safe='/'); sha=None
          try:
            with req(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(out_branch,safe="")}') as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          body={'message':'ops: record Marketplace Azure cutover patch state','content':base64.b64encode(content).decode(),'branch':out_branch}
          if sha: body['sha']=sha
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(put,timeout=30) as r:
            if r.status not in (200,201): raise SystemExit(r.status)
          PY
