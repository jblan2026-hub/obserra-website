name: Observe Marketplace v1.2 Azure cutover patch

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/observe-marketplace-v12-azure-cutover.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record Azure cutover patch state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo='jblan2026-hub/obserra-website'; workflow='patch-marketplace-v12-azure-delivery.yml'; branch='fix/marketplace-v12-azure-protected-delivery-20260823'; out_branch='ops/marketplace-v12-ingest-dispatch-20260823'; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-azure-cutover-observer','Content-Type':'application/json'}
          def req(url): return urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30)
          with req(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch={urllib.parse.quote(branch,safe="")}&per_page=10') as r: data=json.load(r)
          runs=[]
          for item in data.get('workflow_runs',[]):
            runs.append({k:item.get(k) for k in ['id','name','display_title','event','status','conclusion','head_branch','head_sha','run_number','created_at','updated_at','html_url']})
          content=(json.dumps({'workflow':workflow,'runs':runs},indent=2)+'\n').encode(); path='ops/marketplace-v12-azure-cutover-observation.json'; encoded=urllib.parse.quote(path,safe='/'); sha=None
          try:
            with req(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(out_branch,safe="")}') as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          body={'message':'ops: record Marketplace Azure cutover run list','content':base64.b64encode(content).decode(),'branch':out_branch}
          if sha: body['sha']=sha
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(put,timeout=30) as r:
            if r.status not in (200,201): raise SystemExit(r.status)
          PY

