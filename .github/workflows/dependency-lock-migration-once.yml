name: Patched Dependency Lock Migration Once

on:
  push:
    branches:
      - feature/cyber-crisis-commander-sales-handoff
    paths:
      - .github/workflows/dependency-lock-migration-once.yml

permissions:
  contents: write

concurrency:
  group: patched-dependency-lock-migration-once
  cancel-in-progress: false

jobs:
  regenerate-audit-and-commit:
    name: Regenerate, audit, validate, and commit the patched lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/cyber-crisis-commander-sales-handoff
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install supported npm major
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11 --no-audit --no-fund
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Regenerate lockfile from the reviewed dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          const expected = {
            next: '16.3.1',
            react: '19.2.8',
            'react-dom': '19.2.8',
            'eslint-config-next': '16.3.1',
          };
          const root = lock.packages?.[''] ?? {};
          for (const [name, version] of Object.entries(expected)) {
            const manifestVersion = manifest.dependencies?.[name] ?? manifest.devDependencies?.[name];
            const lockedRootVersion = root.dependencies?.[name] ?? root.devDependencies?.[name];
            if (manifestVersion !== version || lockedRootVersion !== version) {
              throw new Error(`${name} must be exactly ${version} in package.json and the lockfile root`);
            }
          }
          NODE

      - name: Install the regenerated immutable dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit complete and production dependency graphs
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          set +e
          npm audit --json > security-evidence/npm-audit-full.json
          full_status=$?
          npm audit --omit=dev --json > security-evidence/npm-audit-production.json
          production_status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const reports = [
            ['full', 'security-evidence/npm-audit-full.json'],
            ['production', 'security-evidence/npm-audit-production.json'],
          ];
          const summary = { schema: 'obserra.website-dependency-audit.v1', reports: {} };
          let blocked = false;
          for (const [name, file] of reports) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            const vulnerabilities = Object.values(report.vulnerabilities ?? {}).map((entry) => ({
              name: entry.name,
              severity: entry.severity,
              direct: Boolean(entry.isDirect),
              range: entry.range,
              fixAvailable: entry.fixAvailable,
            }));
            summary.reports[name] = { counts, vulnerabilities };
            console.log(`${name}: critical=${counts.critical ?? 0} high=${counts.high ?? 0} moderate=${counts.moderate ?? 0} low=${counts.low ?? 0}`);
            for (const item of vulnerabilities) {
              console.log(`${name}: ${item.severity} ${item.name} direct=${item.direct} range=${item.range}`);
            }
            if ((counts.critical ?? 0) > 0 || (counts.high ?? 0) > 0) blocked = true;
          }
          fs.writeFileSync('security-evidence/npm-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
          if (blocked) process.exit(1);
          NODE
          printf 'full_exit_status=%s\nproduction_exit_status=%s\n' "$full_status" "$production_status" \
            > security-evidence/npm-audit-command-status.txt

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-dependency-audit-evidence
          path: security-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce high and critical vulnerability gate
        if: steps.audit.outcome != 'success'
        run: |
          echo "The patched dependency graph still contains high or critical vulnerabilities." >&2
          exit 1

      - name: Validate the patched application
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run lint
          npm run build

      - name: Commit the regenerated lock and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/dependency-lock-migration-once.yml
          git commit -m "security: lock patched website dependency graph"
          git fetch origin feature/cyber-crisis-commander-sales-handoff
          git rebase origin/feature/cyber-crisis-commander-sales-handoff
          git push origin HEAD:feature/cyber-crisis-commander-sales-handoff
