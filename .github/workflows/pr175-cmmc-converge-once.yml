name: PR175 CMMC Converge Once

on:
  push:
    branches:
      - fix/readme-production-authority-20260820

permissions:
  contents: write

concurrency:
  group: pr175-cmmc-converge-once
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/readme-production-authority-20260820
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove helper and establish clean measured tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr175-cmmc-converge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr175-cmmc-converge-once.yml
          git commit -m "chore(ci): remove PR175 CMMC convergence helper"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/readme-production-authority-20260820
          test -z "$(git status --porcelain)"

      - name: Regenerate governed evidence in dependency order
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:legal-identity-audit
          npm run generate:cmmc-system-evidence
          npm run generate:cmmc-disposition
          npm run generate:cmmc-handoff
          npm run generate:fdacs-pii-audit
          npm run verify:cmmc-evidence

      - name: Enforce generated-output allowlist
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(docs/compliance/CMMC-SYSTEM-EVIDENCE\.(json|md|sha256)|docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION\.(json|md|sha256)|docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF\.(json|md|sha256)|docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT\.(json|md|sha256))$'
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          test -n "$changed"
          while IFS= read -r path; do
            echo "$path" | grep -Eq "$allowed" || { echo "Unexpected generated change: $path" >&2; exit 1; }
          done <<EOF
          $changed
          EOF

      - name: Commit verified generated evidence only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.json \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          git diff --cached --quiet && { echo "No governed evidence changes to commit" >&2; exit 1; }
          git commit -m "docs(compliance): converge PR175 governed evidence"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/readme-production-authority-20260820
