name: Pin Azure Identity for Marketplace ingest

on:
  push:
    branches:
      - fix/marketplace-v12-azure-ingest-throughput-impl-20260823
    paths:
      - .github/workflows/patch-marketplace-v12-azure-identity-dependency.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: fix/marketplace-v12-azure-ingest-throughput-impl-20260823
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install exact Azure Identity dependency
        run: npm install --save-exact --ignore-scripts --no-audit --no-fund @azure/identity@4.13.2
      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Azure Identity dependency already pinned."
            exit 0
          fi
          git commit -m "build: pin Azure Identity for Marketplace ingest"
          git pull --rebase origin fix/marketplace-v12-azure-ingest-throughput-impl-20260823
          git push origin HEAD:fix/marketplace-v12-azure-ingest-throughput-impl-20260823
