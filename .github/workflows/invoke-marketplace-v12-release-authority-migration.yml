name: Invoke Marketplace v1.2 release authority migration

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/invoke-marketplace-v12-release-authority-migration.yml

permissions:
  contents: write
  id-token: write

jobs:
  invoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      TARGET_URL: https://www.obserrallc.com/api/admin/ai-marketplace-v12/legacy-release-migration
      AUDIENCE: api://AzureADTokenExchange
      OBSERVATION_BRANCH: ops/marketplace-v12-ingest-dispatch-20260823
    steps:
      - name: Invoke canonical production migration and record non-secret result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 25 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          assertion="$(jq -er '.value | strings' <<<"${token_response}")"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 55 --request POST \
            --header "Authorization: Bearer ${assertion}" \
            --header 'Content-Type: application/json' \
            "${TARGET_URL}")"
          unset assertion token_response
          case "${status}" in 200|503) ;; *) echo "::error::Unexpected migration HTTP status ${status}."; cat "${response_file}"; exit 1 ;; esac
          jq -e '
            .contract == "obserra-marketplace-v12-release-authority-migration-v1" and
            (.migrated | type == "boolean") and
            (.states | type == "object") and
            (.sources | type == "object") and
            (.missing | type == "array")
          ' "${response_file}" >/dev/null
          jq --arg status "${status}" '{contract, migrated, httpStatus:$status, states, sources, missing}' "${response_file}" > receipt.json
          rm -f "${response_file}"
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo='jblan2026-hub/obserra-website'; path='ops/marketplace-v12-release-authority.json'; branch=os.environ['OBSERVATION_BRANCH']; token=os.environ['GH_TOKEN']
          content=open('receipt.json','rb').read(); headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'obserra-marketplace-release-authority-invoker','Content-Type':'application/json'}
          encoded=urllib.parse.quote(path,safe='/'); sha=None
          try:
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch,safe="")}',headers=headers)
            with urllib.request.urlopen(req,timeout=30) as response: sha=json.load(response).get('sha')
          except urllib.error.HTTPError as error:
            if error.code != 404: raise
          body={'message':'ops: record Marketplace release authority migration','content':base64.b64encode(content).decode(),'branch':branch}
          if sha: body['sha']=sha
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{encoded}',data=json.dumps(body).encode(),method='PUT',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as response:
            if response.status not in (200,201): raise SystemExit(response.status)
          PY

