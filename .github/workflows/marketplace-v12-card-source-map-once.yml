name: Marketplace v1.2 card source map once

on:
  push:
    branches:
      - ops/marketplace-v12-release-inventory-20260824
    paths:
      - .github/workflows/marketplace-v12-card-source-map-once.yml

permissions:
  contents: write

env:
  OBSERVATION_BRANCH: ops/marketplace-v12-release-inventory-20260824

jobs:
  map-card-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out probe branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Map sellable card source archives
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "${RUNNER_TEMP}/marketplace-v12-card-source-map.json"
          import { readCatalog } from './scripts/marketplace-v12-artifact-lib.mjs';
          const { catalog, summary } = readCatalog({
            catalogPath: 'data/marketplace/obserra-marketplace-card-catalog.json.gz',
            summaryPath: 'data/marketplace/obserra-marketplace-card-catalog.summary.json',
          });
          const cards = catalog.cards.filter((card) => card.product_type !== 'collection' && card.product_type !== 'bundle');
          const counts = new Map();
          for (const card of cards) {
            const name = card?.artifact?.source_archive;
            if (!name) throw new Error(`missing source archive for ${card.product_id}`);
            counts.set(name, (counts.get(name) ?? 0) + 1);
          }
          const archives = [...counts.entries()]
            .map(([filename, productCount]) => {
              const source = catalog.source_archives.find((archive) => archive.filename === filename);
              if (!source) throw new Error(`catalog source archive missing: ${filename}`);
              return { filename, productCount, bytes: source.bytes, sha256: source.sha256 };
            })
            .sort((a, b) => a.filename.localeCompare(b.filename));
          const productCount = archives.reduce((sum, item) => sum + item.productCount, 0);
          console.log(JSON.stringify({
            contract: 'obserra-marketplace-v12-card-source-map-v1',
            catalogRevision: catalog.catalog_revision,
            summarySourceArchiveCount: summary.counts.source_archives,
            sellableProductCount: cards.length,
            sellableSourceArchiveCount: archives.length,
            archives,
            complete: productCount === 11390 && cards.length === 11390,
          }, null, 2));
          NODE
          cat "${RUNNER_TEMP}/marketplace-v12-card-source-map.json"

      - name: Publish source-map receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          source = os.path.join(os.environ['RUNNER_TEMP'], 'marketplace-v12-card-source-map.json')
          content = open(source, 'rb').read()
          repo = 'jblan2026-hub/obserra-website'
          branch = os.environ['OBSERVATION_BRANCH']
          path = 'ops/marketplace-v12-card-source-map.json'
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'obserra-marketplace-card-source-map',
              'Content-Type': 'application/json',
          }
          encoded = urllib.parse.quote(path, safe='/')
          sha = None
          get_url = f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch, safe="")}'
          try:
              with urllib.request.urlopen(urllib.request.Request(get_url, headers=headers), timeout=30) as response:
                  sha = json.load(response).get('sha')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          body = {
              'message': 'ops: record Marketplace card source map',
              'content': base64.b64encode(content).decode('ascii'),
              'branch': branch,
          }
          if sha:
              body['sha'] = sha
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{encoded}',
              data=json.dumps(body).encode(),
              method='PUT',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY