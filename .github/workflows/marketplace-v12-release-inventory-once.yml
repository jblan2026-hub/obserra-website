name: Marketplace v1.2 release inventory once

on:
  push:
    branches:
      - ops/marketplace-v12-release-inventory-20260824
    paths:
      - .github/workflows/marketplace-v12-release-inventory-once.yml

permissions:
  contents: write
  id-token: write

env:
  AZURE_CLIENT_ID: b8da232a-713f-4c25-a61e-4fb34d13e229
  AZURE_TENANT_ID: 7d8b7b64-c80c-4c8a-a514-66f6b1cf8607
  AZURE_SUBSCRIPTION_ID: 38d660ff-611e-4f6c-ad29-70f5cf118f52
  AZURE_STORAGE_ACCOUNT: stobserramktv1238d660
  AZURE_SOURCE_CONTAINER: marketplace-v12-source
  AZURE_RELEASE_CONTAINER: marketplace-v12-release
  EXPECTED_CATALOG_REVISION: 487043cc23975012e83764a9a0f258f9ff705ab656084be558e76fa64f47faf2
  OBSERVATION_BRANCH: ops/marketplace-v12-release-inventory-20260824

jobs:
  inventory:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Authenticate Marketplace delivery identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Inventory private source and release containers
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "${AZURE_SUBSCRIPTION_ID}"
          test "$(az account show --query tenantId -o tsv)" = "${AZURE_TENANT_ID}"

          release_json="${RUNNER_TEMP}/release.json"
          source_json="${RUNNER_TEMP}/source.json"
          receipt="${RUNNER_TEMP}/marketplace-v12-release-inventory.json"

          az storage blob list \
            --auth-mode login \
            --account-name "${AZURE_STORAGE_ACCOUNT}" \
            --container-name "${AZURE_RELEASE_CONTAINER}" \
            --include m \
            --num-results '*' \
            --output json \
            --only-show-errors > "${release_json}"

          az storage blob list \
            --auth-mode login \
            --account-name "${AZURE_STORAGE_ACCOUNT}" \
            --container-name "${AZURE_SOURCE_CONTAINER}" \
            --include m \
            --num-results '*' \
            --output json \
            --only-show-errors > "${source_json}"

          jq -n \
            --arg contract "obserra-marketplace-v12-release-inventory-v1" \
            --arg account "${AZURE_STORAGE_ACCOUNT}" \
            --arg source "${AZURE_SOURCE_CONTAINER}" \
            --arg release "${AZURE_RELEASE_CONTAINER}" \
            --arg revision "${EXPECTED_CATALOG_REVISION}" \
            --slurpfile rel "${release_json}" \
            --slurpfile src "${source_json}" '
              ($rel[0] // []) as $r |
              ($src[0] // []) as $s |
              {
                contract:$contract,
                storageAccount:$account,
                sourceContainer:$source,
                releaseContainer:$release,
                catalogRevision:$revision,
                releaseBlobCount:($r|length),
                releaseZipCount:([$r[] | select(.name|endswith(".zip"))]|length),
                releaseRevisionMatchedCount:([$r[] | select((.metadata.catalog_revision // "") == $revision)]|length),
                releaseProductMetadataCount:([$r[] | select((.metadata.product_id // "") != "" and (.metadata.artifact_sha256 // "") != "" and (.metadata.catalog_revision // "") != "")]|length),
                releaseUniqueProductIds:([$r[] | (.metadata.product_id // empty)] | unique | length),
                sourceBlobCount:($s|length),
                sourceZipCount:([$s[] | select(.name|endswith(".zip"))]|length),
                sourceManifestPresent:([$s[] | select(.name == "obserra-supplied-archives.json")]|length == 1),
                completeReleaseCandidate:(
                  ($r|length) == 11390 and
                  ([$r[] | select(.name|endswith(".zip"))]|length) == 11390 and
                  ([$r[] | select((.metadata.catalog_revision // "") == $revision)]|length) == 11390 and
                  ([$r[] | select((.metadata.product_id // "") != "" and (.metadata.artifact_sha256 // "") != "" and (.metadata.catalog_revision // "") == $revision)]|length) == 11390 and
                  ([$r[] | (.metadata.product_id // empty)] | unique | length) == 11390
                )
              }' > "${receipt}"
          cat "${receipt}"

      - name: Publish non-sensitive inventory receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          source = os.path.join(os.environ['RUNNER_TEMP'], 'marketplace-v12-release-inventory.json')
          content = open(source, 'rb').read()
          repo = 'jblan2026-hub/obserra-website'
          branch = os.environ['OBSERVATION_BRANCH']
          path = 'ops/marketplace-v12-release-inventory.json'
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'obserra-marketplace-release-inventory',
              'Content-Type': 'application/json',
          }
          encoded = urllib.parse.quote(path, safe='/')
          get_url = f'https://api.github.com/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch, safe="")}'
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(get_url, headers=headers), timeout=30) as response:
                  sha = json.load(response).get('sha')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          body = {
              'message': 'ops: record Marketplace release inventory',
              'content': base64.b64encode(content).decode('ascii'),
              'branch': branch,
          }
          if sha:
              body['sha'] = sha
          put_url = f'https://api.github.com/repos/{repo}/contents/{encoded}'
          request = urllib.request.Request(put_url, data=json.dumps(body).encode(), method='PUT', headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY