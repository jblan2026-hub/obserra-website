name: Marketplace sales validation once

on:
  push:
    branches:
      - ops/marketplace-sales-validation-20260824
    paths:
      - .github/workflows/marketplace-sales-validation-once.yml

permissions:
  contents: write

jobs:
  validate-marketplace-sales:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CI: "true"
    steps:
      - name: Checkout exact sales-fix source
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install supported npm major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate sales fix and record durable receipt
        shell: bash
        run: |
          set +e

          git diff --exit-code -- package-lock.json
          lockfile_status=$?

          npm run verify:marketplace-catalog-delivery
          catalog_status=$?

          node --test test/marketplace-sales-live-contract.test.mjs
          focused_test_status=$?

          npm run lint
          lint_status=$?

          npm run build
          build_status=$?

          if [ "${build_status}" -eq 0 ]; then
            npm run verify:marketplace-catalog-delivery -- --build-output .next
            build_trace_status=$?
          else
            build_trace_status=99
          fi

          mkdir -p ops
          cat > ops/marketplace-sales-validation-latest.json <<EOF
          {
            "contract": "obserra-marketplace-sales-validation-v1",
            "sourcePr": 376,
            "sourceSha": "ef1cfdfdb0562596a1bd14611a3afa803a5ae9ae",
            "validationCommit": "${GITHUB_SHA}",
            "lockfileStatus": ${lockfile_status},
            "catalogContractStatus": ${catalog_status},
            "focusedSalesTestStatus": ${focused_test_status},
            "lintStatus": ${lint_status},
            "buildStatus": ${build_status},
            "postBuildCatalogTraceStatus": ${build_trace_status},
            "complete": $([ "${lockfile_status}" -eq 0 ] && [ "${catalog_status}" -eq 0 ] && [ "${focused_test_status}" -eq 0 ] && [ "${lint_status}" -eq 0 ] && [ "${build_status}" -eq 0 ] && [ "${build_trace_status}" -eq 0 ] && echo true || echo false),
            "validatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/marketplace-sales-validation-latest.json
          git commit -m "ops: record Marketplace sales validation" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

          if [ "${lockfile_status}" -ne 0 ] || [ "${catalog_status}" -ne 0 ] || [ "${focused_test_status}" -ne 0 ] || [ "${lint_status}" -ne 0 ] || [ "${build_status}" -ne 0 ] || [ "${build_trace_status}" -ne 0 ]; then
            exit 1
          fi
