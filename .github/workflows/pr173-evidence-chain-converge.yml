name: PR173 Evidence Chain Converge Once

on:
  push:
    branches:
      - fix/canonical-alias-reclaim-20260820

permissions:
  contents: write

concurrency:
  group: pr173-evidence-chain-converge-once
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-alias-reclaim-20260820
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without repository credentials
        run: npm ci

      - name: Remove one-shot helper and commit clean source tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr173-evidence-chain-converge.yml
          git commit -m "ci: remove one-shot PR173 evidence convergence helper"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/canonical-alias-reclaim-20260820
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Regenerate governed evidence from the clean intended tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          npm run generate:legal-identity-audit
          npm run generate:cmmc-system-evidence
          npm run generate:cmmc-disposition
          npm run generate:cmmc-handoff
          npm run generate:fdacs-pii-audit

      - name: Verify complete governed evidence chain
        run: |
          set -euo pipefail
          npm run verify:legal-identity-audit
          npm run verify:cmmc-evidence
          npm run verify:cmmc-production-evidence

      - name: Stage only governed generated outputs
        run: |
          set -euo pipefail
          git add \
            docs/compliance/LEGAL-IDENTITY-AUDIT.json \
            docs/compliance/LEGAL-IDENTITY-AUDIT.md \
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256 \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256 \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.json \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.md \
            docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION.sha256 \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.md \
            docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF.sha256 \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.json \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.md \
            docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT.sha256
          unexpected="$(git diff --cached --name-only | grep -Ev '^(docs/compliance/LEGAL-IDENTITY-AUDIT\.(json|md|sha256)|docs/compliance/CMMC-SYSTEM-EVIDENCE\.(json|md|sha256)|docs/compliance/CMMC-TECHNICAL-HUMAN-DISPOSITION\.(json|md|sha256)|docs/compliance/CMMC-CONTINUOUS-AUDIT-HANDOFF\.(md|sha256)|docs/florida-class-d-lms/FDACS-PII-DATABASE-AUDIT\.(json|md|sha256))$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected staged files:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified generated evidence only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No generated evidence changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(compliance): converge PR173 governed evidence chain"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/canonical-alias-reclaim-20260820
