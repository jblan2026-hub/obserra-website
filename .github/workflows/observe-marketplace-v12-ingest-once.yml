name: Observe Marketplace v1.2 ingest once

on:
  push:
    branches:
      - ops/marketplace-v12-ingest-dispatch-20260823
    paths:
      - .github/workflows/observe-marketplace-v12-ingest-once.yml

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture non-secret protected-delivery workflow metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ops/marketplace-v12-ingest-dispatch-20260823
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request

          repo = "jblan2026-hub/obserra-website"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "obserra-marketplace-ingest-observer",
          }
          runs_url = f"https://api.github.com/repos/{repo}/actions/workflows/marketplace-v12-protected-delivery.yml/runs?event=workflow_dispatch&branch=main&per_page=10"
          req = urllib.request.Request(runs_url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          observed = []
          for run in payload.get("workflow_runs", []):
              observed.append({
                  "id": run.get("id"),
                  "name": run.get("name"),
                  "display_title": run.get("display_title"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_branch": run.get("head_branch"),
                  "head_sha": run.get("head_sha"),
                  "run_number": run.get("run_number"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "html_url": run.get("html_url"),
              })
          content = json.dumps({"workflow":"marketplace-v12-protected-delivery.yml","runs":observed}, indent=2) + "\n"
          path = "ops/marketplace-v12-ingest-observation.json"
          get_url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={os.environ['BRANCH']}"
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(get_url, headers=headers), timeout=30) as response:
                  sha = json.load(response).get("sha")
          except Exception:
              pass
          body = {
              "message": "ops: record marketplace v1.2 ingest observation",
              "content": base64.b64encode(content.encode()).decode(),
              "branch": os.environ["BRANCH"],
          }
          if sha:
              body["sha"] = sha
          put = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{path}",
              data=json.dumps(body).encode(),
              method="PUT",
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(put, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"unexpected observation write status {response.status}")
          print("Observed protected-delivery workflow metadata recorded.")
          PY
