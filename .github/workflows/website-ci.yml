name: Website CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      CI: "true"
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install supported npm major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile remains immutable
        run: git diff --exit-code -- package-lock.json

      - name: Audit complete and production dependency graphs
        id: dependency_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          set +e
          npm audit --json > security-evidence/npm-audit-full.json
          full_status=$?
          npm audit --omit=dev --json > security-evidence/npm-audit-production.json
          production_status=$?
          node scripts/verify-npm-audit.mjs \
            --full security-evidence/npm-audit-full.json \
            --production security-evidence/npm-audit-production.json \
            --output security-evidence/npm-audit-summary.json
          verifier_status=$?
          set -e
          printf 'full_exit_status=%s\nproduction_exit_status=%s\nverifier_exit_status=%s\n' \
            "$full_status" "$production_status" "$verifier_status" \
            > security-evidence/npm-audit-command-status.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "package_lock_sha256=$(sha256sum package-lock.json | awk '{print $1}')"
            echo "audit_verifier_sha256=$(sha256sum scripts/verify-npm-audit.mjs | awk '{print $1}')"
          } > security-evidence/npm-audit-context.txt
          exit "$verifier_status"

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: website-dependency-audit-${{ github.sha }}
          path: security-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce dependency vulnerability gate
        if: steps.dependency_audit.outcome != 'success'
        run: |
          echo "The complete or production website dependency graph contains a high or critical vulnerability, or npm audit could not be verified." >&2
          exit 1

      - name: Run unit and catalog contract tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Verify public site excludes private owner content
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/obserra-owner-separation-smoke.log"
          npm start -- --hostname 127.0.0.1 --port 3100 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat "$log_file" >&2
            exit 1
          fi

          OWNER_SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/owner-command-center-runtime-smoke.mjs
