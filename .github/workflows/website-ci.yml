name: Website CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CI: "true"
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install supported npm major
        run: |
          npm install --global npm@11 --no-audit --no-fund
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile remains immutable
        run: git diff --exit-code -- package-lock.json

      - name: Verify exact legal identity and generated audit pair
        id: legal-audit
        continue-on-error: true
        run: npm run verify:legal-identity-audit

      - name: Generate legal identity audit remediation artifacts
        if: ${{ steps.legal-audit.outcome == 'failure' }}
        run: npm run generate:legal-identity-audit

      - name: Upload legal identity audit remediation artifacts
        if: ${{ steps.legal-audit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: legal-identity-audit-remediation
          if-no-files-found: error
          retention-days: 3
          path: |
            docs/compliance/LEGAL-IDENTITY-AUDIT.json
            docs/compliance/LEGAL-IDENTITY-AUDIT.md
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256

      - name: Fail on legal identity audit drift
        if: ${{ steps.legal-audit.outcome == 'failure' }}
        run: |
          echo "Generated legal identity evidence drifted from the inspected source. Apply the uploaded remediation artifact and rerun CI."
          exit 1

      - name: Run unit and catalog contract tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Verify public site excludes private owner content
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/obserra-owner-separation-smoke.log"
          npm start -- --hostname 127.0.0.1 --port 3100 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat "$log_file" >&2
            exit 1
          fi

          OWNER_SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/owner-command-center-runtime-smoke.mjs

      - name: Record feature-branch runtime-smoke credential boundary
        if: ${{ (env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' || env.CLERK_SECRET_KEY == '') && github.ref != 'refs/heads/main' }}
        run: |
          echo "Full Clerk-backed runtime smoke is deferred because this non-production GitHub Actions context has no Clerk credentials."
          echo "No synthetic, placeholder, or fabricated credentials are substituted. Source tests, lint, and production build remain mandatory."

      - name: Require real Clerk credentials for production runtime smoke
        if: ${{ github.ref == 'refs/heads/main' && (env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' || env.CLERK_SECRET_KEY == '') }}
        run: |
          echo "Production runtime smoke requires real Clerk GitHub Actions credentials."
          exit 1
