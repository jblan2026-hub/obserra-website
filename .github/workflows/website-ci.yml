name: Website CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      OBSERRA_OWNER_EMAIL: ${{ secrets.OBSERRA_OWNER_EMAIL }}
      OBSERRA_OWNER_USER_ID: ${{ secrets.OBSERRA_OWNER_USER_ID }}
      CI: "true"
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit and catalog contract tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Verify anonymous owner route fails closed at runtime
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/obserra-owner-smoke.log"
          npm start -- --hostname 127.0.0.1 --port 3100 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat "$log_file" >&2
            exit 1
          fi

          OWNER_SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/owner-command-center-runtime-smoke.mjs
