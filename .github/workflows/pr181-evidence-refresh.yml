name: PR181 Exact-Head Evidence Refresh

on:
  push:
    branches:
      - fix/academy-supabase-runtime-identity-20260821

permissions:
  contents: write

concurrency:
  group: pr181-exact-head-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'jblan2026-hub/obserra-website' &&
      github.ref == 'refs/heads/fix/academy-supabase-runtime-identity-20260821' &&
      github.actor == 'jblan2026-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/academy-supabase-runtime-identity-20260821
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate exact-head controlled evidence
        run: |
          npm run generate:legal-identity-audit
          npm run generate:cmmc-system-evidence

      - name: Verify exact-head controlled evidence
        run: |
          npm run verify:legal-identity-audit
          npm run verify:cmmc-system-evidence

      - name: Enforce one-shot change boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/pr181-evidence-refresh.yml'
          allowed=(
            "$workflow"
            'docs/compliance/LEGAL-IDENTITY-AUDIT.json'
            'docs/compliance/LEGAL-IDENTITY-AUDIT.md'
            'docs/compliance/LEGAL-IDENTITY-AUDIT.sha256'
            'docs/compliance/CMMC-SYSTEM-EVIDENCE.json'
            'docs/compliance/CMMC-SYSTEM-EVIDENCE.md'
            'docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256'
          )

          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //; s/.* -> //')
          for path in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "Unexpected generated change outside controlled evidence boundary: $path" >&2
              exit 1
            fi
          done

          for evidence in "${allowed[@]:1}"; do
            if ! git status --porcelain=v1 -- "$evidence" | grep -q .; then
              echo "Expected evidence file did not change: $evidence" >&2
              exit 1
            fi
          done

      - name: Commit controlled evidence and self-remove applicator
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/pr181-evidence-refresh.yml'
          git add \
            docs/compliance/LEGAL-IDENTITY-AUDIT.json \
            docs/compliance/LEGAL-IDENTITY-AUDIT.md \
            docs/compliance/LEGAL-IDENTITY-AUDIT.sha256 \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.json \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.md \
            docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256
          git rm "$workflow"

          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            case "$path" in
              "$workflow"|docs/compliance/LEGAL-IDENTITY-AUDIT.json|docs/compliance/LEGAL-IDENTITY-AUDIT.md|docs/compliance/LEGAL-IDENTITY-AUDIT.sha256|docs/compliance/CMMC-SYSTEM-EVIDENCE.json|docs/compliance/CMMC-SYSTEM-EVIDENCE.md|docs/compliance/CMMC-SYSTEM-EVIDENCE.sha256) ;;
              *)
                echo "Refusing to commit unexpected path: $path" >&2
                exit 1
                ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(evidence): refresh generated audit evidence'
          git push origin HEAD:fix/academy-supabase-runtime-identity-20260821
