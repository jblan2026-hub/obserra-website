name: Diagnostic Vercel OIDC domain read

on:
  push:
    branches:
      - diag/vercel-oidc-domain-access-20260820
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  oidc-domain-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEAM_ID: team_xpUE1GefY2JHuFFCqbAdnZAj
      CANONICAL_PROJECT_ID: prj_lxTKKDa9sbhht7FaigiaF1PONMiC
      DUPLICATE_PROJECT_ID: prj_FfAnssVJU8pcJydGNJHmCliP6Yme
      PRIMARY_DOMAIN: www.obserrallc.com
      VERCEL_OAUTH_CLIENT_ID: cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD
    steps:
      - name: Mint GitHub OIDC token
        id: github_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Exchange OIDC token and test Vercel management read access
        id: vercel_oidc
        shell: bash
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.github_oidc.outputs.token }}
        run: |
          set -euo pipefail

          echo "exchange_status=not-run" >> "${GITHUB_OUTPUT}"
          echo "exchange_result=not-run" >> "${GITHUB_OUTPUT}"
          echo "canonical_status=not-run" >> "${GITHUB_OUTPUT}"
          echo "canonical_result=not-run" >> "${GITHUB_OUTPUT}"
          echo "canonical_project=" >> "${GITHUB_OUTPUT}"
          echo "duplicate_status=not-run" >> "${GITHUB_OUTPUT}"
          echo "duplicate_result=not-run" >> "${GITHUB_OUTPUT}"
          echo "duplicate_project=" >> "${GITHUB_OUTPUT}"

          exchange_body="$(mktemp)"
          exchange_status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output "${exchange_body}" \
            --write-out '%{http_code}' \
            --request POST \
            https://api.vercel.com/login/oauth/token \
            --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode "client_id=${VERCEL_OAUTH_CLIENT_ID}" \
            --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "team_id_or_slug=${TEAM_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}")"

          echo "exchange_status=${exchange_status}" >> "${GITHUB_OUTPUT}"
          if [ "${exchange_status}" != "200" ]; then
            error_code="$(jq -r '.error.code // .error // empty' "${exchange_body}" 2>/dev/null || true)"
            rm -f "${exchange_body}"
            echo "exchange_result=denied${error_code:+:${error_code}}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          access_token="$(jq -r '.access_token // empty' "${exchange_body}")"
          rm -f "${exchange_body}"
          if [ -z "${access_token}" ]; then
            echo "exchange_result=no-access-token" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::add-mask::${access_token}"
          echo "exchange_result=access-token-received" >> "${GITHUB_OUTPUT}"

          read_domain() {
            local project_id="$1"
            local status_output="$2"
            local result_output="$3"
            local project_output="$4"
            local body
            local status
            local project
            local code

            body="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${body}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${access_token}" \
              "https://api.vercel.com/v9/projects/${project_id}/domains/${PRIMARY_DOMAIN}?teamId=${TEAM_ID}")"

            echo "${status_output}=${status}" >> "${GITHUB_OUTPUT}"
            if [ "${status}" = "200" ]; then
              project="$(jq -r '.projectId // empty' "${body}")"
              echo "${result_output}=authorized" >> "${GITHUB_OUTPUT}"
              echo "${project_output}=${project}" >> "${GITHUB_OUTPUT}"
              rm -f "${body}"
              return 0
            fi

            code="$(jq -r '.error.code // empty' "${body}" 2>/dev/null || true)"
            echo "${result_output}=denied-or-absent${code:+:${code}}" >> "${GITHUB_OUTPUT}"
            rm -f "${body}"
          }

          read_domain "${CANONICAL_PROJECT_ID}" canonical_status canonical_result canonical_project
          read_domain "${DUPLICATE_PROJECT_ID}" duplicate_status duplicate_result duplicate_project

      - name: Report sanitized diagnostic result to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          EXCHANGE_STATUS: ${{ steps.vercel_oidc.outputs.exchange_status }}
          EXCHANGE_RESULT: ${{ steps.vercel_oidc.outputs.exchange_result }}
          CANONICAL_STATUS: ${{ steps.vercel_oidc.outputs.canonical_status }}
          CANONICAL_RESULT: ${{ steps.vercel_oidc.outputs.canonical_result }}
          CANONICAL_PROJECT: ${{ steps.vercel_oidc.outputs.canonical_project }}
          DUPLICATE_STATUS: ${{ steps.vercel_oidc.outputs.duplicate_status }}
          DUPLICATE_RESULT: ${{ steps.vercel_oidc.outputs.duplicate_result }}
          DUPLICATE_PROJECT: ${{ steps.vercel_oidc.outputs.duplicate_project }}
        with:
          script: |
            const body = [
              '### Vercel OIDC diagnostic result',
              '',
              `- Exchange HTTP status: ${process.env.EXCHANGE_STATUS || 'unavailable'}`,
              `- Exchange result: ${process.env.EXCHANGE_RESULT || 'unavailable'}`,
              `- Canonical project-domain read HTTP status: ${process.env.CANONICAL_STATUS || 'unavailable'}`,
              `- Canonical read result: ${process.env.CANONICAL_RESULT || 'unavailable'}`,
              `- Canonical reported project: ${process.env.CANONICAL_PROJECT || 'none'}`,
              `- Duplicate project-domain read HTTP status: ${process.env.DUPLICATE_STATUS || 'unavailable'}`,
              `- Duplicate read result: ${process.env.DUPLICATE_RESULT || 'unavailable'}`,
              `- Duplicate reported project: ${process.env.DUPLICATE_PROJECT || 'none'}`,
              '',
              'No token values are included in this report and this workflow performs no Vercel mutation.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
