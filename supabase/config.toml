project_id = "obserra-website"

[storage.buckets.fdacs-class-d-completion-documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.fdacs-owner-review-courseware]
public = false
file_size_limit = "100MiB"
allowed_mime_types = [
  "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  "application/pdf",
  "image/png",
  "image/jpeg",
  "image/webp",
  "video/mp4",
  "video/webm",
]

[functions.academy-public-catalog]
verify_jwt = false

[functions.academy-owner-control]
verify_jwt = true

# The Academy persistence gateway accepts Vercel workload identity, not a
# Supabase user JWT. Its handler verifies the Vercel RS256 signature plus exact
# issuer, audience, owner, project, environment, subject, and token lifetime
# before accessing service-role-only Academy RPCs.
[functions.academy-persistence-gateway]
verify_jwt = false
